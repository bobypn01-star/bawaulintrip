const _pe = (a, b) => { EN[a] = b; return a; };
const IU_S = [_pe("Syarat & Ketentuan", "Terms & Conditions"), _pe("Dengan memakai aplikasi, Anda dianggap telah membaca dan menyetujui syarat ini.", "By using the app, you are deemed to have read and agreed to these terms."),
_pe("1. Lisensi: satu lisensi untuk satu penyelenggara. Satu kode perangkat (BU-XXXX-XXXX) berlaku untuk satu HP. Basecamp gratis tanpa batas waktu. Sabana dan Puncak berlaku sampai tanggal berakhir yang tertera di Akun › Paket saya. Edelweis tanpa tanggal berakhir dan berlaku selama aplikasi dan server lisensi masih beroperasi. Bila server lisensi dihentikan, pembeli sah paket berbayar akan mendapat kunci permanen yang bekerja tanpa internet.", "1. License: one license per organizer. One device code (BU-XXXX-XXXX) is valid for one phone. Basecamp is free with no time limit. Sabana and Puncak are valid until the end date shown in Account › My plan. Edelweis has no end date and lasts as long as the app and the license server operate. If the license server is shut down, legitimate buyers of paid plans receive a permanent key that works without internet."),
_pe("2. Yang dilarang: membagikan aplikasi atau tautan pembelian kepada orang lain; menjual ulang atau menyewakan; menghapus atau mengubah identitas pembuat; mengubah kode aplikasi atau menjalankannya dari alamat lain.", "2. Prohibited: sharing the app or purchase links with others; reselling or renting it out; removing or changing the creator's identity; modifying the app code or running it from another address."),
_pe("3. Pemeriksaan lisensi: aplikasi memeriksa status lisensi ke server penjual saat ada internet. Tanpa internet, aplikasi tetap jalan sampai 60 hari sejak pemeriksaan terakhir yang berhasil; setelah itu perlu online sekali. Buka aplikasi dengan internet sebelum berangkat trip. Jam HP yang dimundurkan akan mengunci aplikasi.", "3. License checks: the app checks the license status with the seller's server when there is internet. Without internet, the app keeps working for up to 60 days after the last successful check; after that it must go online once. Open the app with internet before leaving for a trip. Setting the phone clock back will lock the app."),
_pe("4. Pindah HP: gratis, maksimal 2 kali per tahun, dengan nomor WhatsApp yang cocok dengan data pembelian. HP hilang atau rusak dapat dibantu dengan penjelasan. Setiap HP baru punya kode perangkat baru, jadi pembeli meminta kunci baru ke penjual lewat WhatsApp.", "4. Changing phones: free, at most 2 times per year, with the WhatsApp number that matches the purchase record. A lost or broken phone can be helped with an explanation. Every new phone has a new device code, so the buyer asks the seller for a new key via WhatsApp."),
_pe("5. Pencabutan: penjual dapat mencabut lisensi bila syarat dilanggar. Aplikasi tidak langsung terkunci: ada masa pencabutan (saat ini 60 hari) dengan peringatan di layar, lalu aplikasi terkunci begitu terhubung ke server. Data tetap ada di HP dan aplikasi pulih bila lisensi diaktifkan lagi. Pencabutan karena pelanggaran tidak disertai pengembalian uang.", "5. Revocation: the seller may revoke the license if these terms are violated. The app does not lock immediately: there is a revocation period (currently 60 days) with on-screen warnings, after which the app locks once it connects to the server. Data stays on the phone and the app recovers if the license is activated again. Revocation for a violation comes with no refund."),
_pe("6. Data dan cadangan: data trip dan keuangan hanya tersimpan di HP Anda. Satu pengecualian: data pendaftar lewat Pendaftaran Online dititipkan sementara di server sampai Anda mengambilnya (lihat Kebijakan Privasi). Menghapus data aplikasi atau mencopot aplikasi dapat menghilangkan semuanya, jadi cadangkan secara rutin (Akun › Data & Cadangan). Anda bertanggung jawab atas data peserta yang Anda kumpulkan, termasuk data kesehatan seperti alergi, dan wajib meminta izin peserta.", "6. Data and backups: trip and financial data are stored only on your phone. One exception: data from Online Registration is held temporarily on the server until you collect it (see the Privacy Policy). Deleting app data or uninstalling the app can lose everything, so back up regularly (Account › Data & Backup). You are responsible for the participant data you collect, including health data such as allergies, and must obtain participants' permission."),
_pe("7. Batas tanggung jawab: aplikasi adalah alat bantu mencatat dan menghitung. Penjual tidak menanggung kerugian akibat kesalahan input atau hitungan, data yang hilang, atau aplikasi yang tidak bisa dipakai karena lama tanpa internet.", "7. Limit of liability: the app is a tool for recording and calculating. The seller is not liable for losses from input or calculation errors, lost data, or the app being unusable after a long time without internet."),
_pe("8. Paket: Basecamp gratis tanpa batas waktu (satu trip aktif, tiga mode, dan fitur dasar). Sabana dan Puncak berbayar dengan masa aktif sampai tanggal berakhir. Edelweis berbayar sekali tanpa tanggal berakhir. Isi tiap paket tertera di Akun › Paket saya; fitur bertanda Segera belum tersedia. Isi paket dan harga dapat berubah; yang berlaku saat Anda membeli tertera di halaman penjualan.", "8. Plans: Basecamp is free with no time limit (one active trip, three modes, and core features). Sabana and Puncak are paid with an active period until the end date. Edelweis is a one-time payment with no end date. What each plan includes is shown in Account › My plan; features marked Soon are not yet available. Plan contents and prices may change; what applies when you buy is shown on the sales page."),
_pe("9. Setelah paket berakhir: setelah tanggal berakhir ada masa tenggang (saat ini 14 hari) dengan pengingat; selama itu semua fitur paket tetap jalan. Sesudahnya paket kembali ke Basecamp: tiga trip sekaligus, Bagi Hasil, Pendaftaran Online, Salin Template, Rekap Antar-Trip, simulasi lebih dari satu skenario, serta logo dan stempel penyelenggara di PDF dan kwitansi terkunci, dan PDF memuat tanda bawaulin.cash. Fitur dasar tetap gratis. Data Anda tidak dihapus dan tidak disandera: melihat, mencadangkan, memulihkan, dan mengunduh data tetap bisa, dan fitur yang terkunci terbuka lagi saat paket diperpanjang.", "9. After a plan ends: after the end date there is a grace period (currently 14 days) with reminders; during it all plan features keep working. After that the plan returns to Basecamp: three simultaneous trips, Profit Sharing, Online Registration, Copy Template, Cross-Trip Recap, more than one simulation scenario, and the organizer's logo and stamp on PDFs and receipts are locked, and PDFs carry the bawaulin.cash mark. Core features stay free. Your data is not deleted or held hostage: viewing, backing up, restoring, and downloading data still work, and locked features open again when the plan is renewed."),
_pe("10. Harga dan pengembalian uang: harga mengikuti yang tertera di halaman penjualan pada saat Anda membeli. Sabana, Puncak, dan Edelweis adalah produk digital, jadi pembayaran yang sudah diterima tidak dikembalikan. Pengecualian: bila aplikasi gagal diaktifkan karena kesalahan di sisi penjual (misalnya kunci atau paket tidak diterbitkan setelah pembayaran terverifikasi, atau aplikasi tidak bisa diaktifkan akibat kesalahan server atau penjual dan tidak dapat diperbaiki), uang dikembalikan. Pengecualian ini tidak berlaku bila penyebabnya di sisi Anda, misalnya salah mengetik kode, HP tidak cocok, atau berubah pikiran. Pencabutan karena pelanggaran (pasal 5) tetap tanpa pengembalian uang. Untuk mengajukan, hubungi penjual lewat WhatsApp dengan bukti pembayaran.", "10. Price and refunds: the price is as stated on the sales page at the time of your purchase. Sabana, Puncak, and Edelweis are digital products, so payments already received are not refunded. Exception: if the app fails to activate because of an error on the seller's side (for example the key or plan is not issued after payment is verified, or the app cannot be activated due to a server or seller error and cannot be fixed), the money is refunded. This exception does not apply if the cause is on your side, such as mistyping a code, an incompatible phone, or a change of mind. Revocation for a violation (clause 5) is still without refund. To request one, contact the seller via WhatsApp with proof of payment."),
_pe("Pertanyaan: hubungi penjual lewat WhatsApp (Pengaturan › Lapor masalah).", "Questions: contact the seller via WhatsApp (Settings › Report a problem).")];
const IU_P = [_pe("Kebijakan Privasi", "Privacy Policy"), _pe("Data trip dan keuangan Anda disimpan di HP Anda sendiri dan tidak dikirim ke server penjual. Satu pengecualian ada di bagian Pendaftaran Online di bawah.", "Your trip and financial data are stored on your own phone and are not sent to the seller's server. One exception is in the Online Registration section below."),
_pe("Yang dikirim ke server lisensi: kode perangkat, versi aplikasi, token pasang acak, alamat asal aplikasi, dan penanda teknis keaslian kode. Tujuannya hanya memeriksa status lisensi dan menjaga agar satu lisensi dipakai di satu HP.", "Sent to the license server: the device code, app version, a random install token, the app's origin address, and a technical code-authenticity marker. The only purpose is to check license status and keep one license on one phone."),
_pe("Server juga mencatat kejadian teknis (misalnya kode dipakai di dua HP). Saat Anda membeli paket, server mencatat pesanan: kode perangkat, paket dan periode, nominal, status dan waktu pembayaran, metode bayar, serta nama, nomor WhatsApp, dan email bila Anda mengisinya (email boleh kosong). Nama dan nomor WhatsApp dipakai hanya untuk bantuan, bukti pembelian, refund, dan pembukuan penjual; Anda dapat meminta keduanya dihapus atau dianonimkan (nominal transaksi tetap disimpan untuk pembukuan). Pembayaran diproses oleh Midtrans; aplikasi dan server tidak menyimpan nomor kartu atau akun e-wallet Anda. Data pesanan dipakai untuk menerapkan paket, bantuan, refund, dan pembukuan penjual. Perangkat Basecamp yang tidak dibuka lagi selama 90 hari dihapus dari server (data trip Anda tetap di HP). Saat aplikasi pertama kali dibuka, server juga mencatat cara aplikasi dipakai (aplikasi terpasang atau dibuka di browser), kode ajakan teman bila Anda membuka aplikasi lewat tautan ajakan, nama panggilan bila Anda mengisinya (opsional), dan perkiraan negara dari jaringan. Saat Anda menekan tombol unduh APK di website, server mencatat waktu, jenis perangkat secara kasar, dan sidik acak alamat IP yang berganti tiap hari dan dihapus setelah 7 hari. Data ini dipakai untuk statistik penggunaan, bukan untuk mengenali Anda.", "The server also logs technical events (for example a code used on two phones). When you buy a plan, the server records the order: device code, plan and period, amount, payment status and time, payment method, and your name, WhatsApp number, and email if you enter them (email is optional). Your name and WhatsApp number are used only for support, proof of purchase, refunds, and the seller's bookkeeping; you can ask for both to be deleted or anonymized (the transaction amount is kept for bookkeeping). Payments are processed by Midtrans; the app and server do not store your card number or e-wallet account. Order data is used to apply the plan, for support, refunds, and the seller's bookkeeping. Basecamp devices not opened for 90 days are deleted from the server (your trip data stays on your phone). When the app is first opened, the server also records how the app is used (installed app or opened in a browser), the friend-invite code if you opened the app through an invite link, a nickname if you enter one (optional), and an approximate country from the network. When you tap the APK download button on the website, the server records the time, a rough device type, and a random fingerprint of the IP address that changes daily and is deleted after 7 days. This data is used for usage statistics, not to identify you."),
_pe("Server juga mencatat paket Anda (Basecamp, Sabana, Puncak, atau Edelweis), tanggal berakhirnya, dan penanda waktu pencabutan bila ada. Ini hanya penanda; isi trip tidak dikirim.", "The server also records your plan (Basecamp, Sabana, Puncak, or Edelweis), its end date, and a revocation time marker if any. These are markers only; trip contents are not sent."),
_pe("Pendaftaran Online: saat calon peserta mengisi formulir, nama, nomor WhatsApp, meeting point, jawaban alergi makanan, dan catatan mereka dititipkan sementara di server bawaulin.trip dan dikaitkan dengan kode perangkat Anda. Setelah aplikasi Anda mengambilnya, data itu dihapus dari server. Data yang belum diambil dihapus otomatis setelah 30 hari, atau saat Anda menutup pendaftaran. Penjual tidak memakai data ini selain mengantarkannya kepada Anda. Alamat IP pengirim hanya dipakai dalam bentuk sidik acak untuk membatasi kiriman berlebihan. Anda bertanggung jawab meminta izin peserta; info alergi termasuk data kesehatan.", "Online Registration: when a prospective participant fills in the form, their name, WhatsApp number, meeting point, food-allergy answer, and note are held temporarily on the bawaulin.trip server and linked to your device code. Once your app has collected them, the data is deleted from the server. Data not yet collected is deleted automatically after 30 days, or when you close registration. The seller does not use this data except to deliver it to you. The sender's IP address is used only as a random fingerprint to limit excessive submissions. You are responsible for obtaining participants' permission; allergy information counts as health data."),
_pe("Notifikasi: bila Anda mengaktifkan notifikasi pendaftar baru, server menyimpan alamat langganan notifikasi dari HP atau peramban Anda (maksimal 5 per kode) untuk mengirim pemberitahuan. Anda dapat mematikannya kapan saja di halaman Pendaftaran.", "Notifications: if you enable new-registrant notifications, the server stores the notification subscription address from your phone or browser (at most 5 per code) to send alerts. You can turn it off at any time on the Registration page."),
_pe("Lapor masalah lewat WhatsApp hanya mengirim info teknis dan hanya terkirim bila Anda menekan kirim di WhatsApp. Bila Anda memilih Kirim lewat aplikasi (opsional, dengan persetujuan Anda), kategori, pesan, kontak (boleh kosong), versi aplikasi, mode tampil, dan kode perangkat dikirim ke server penjual dan disimpan sampai 180 hari setelah laporan ditandai selesai; tanpa lampiran dan tanpa data trip. Penjual dapat menganonimkan laporan atas permintaan Anda. Cadangan data berupa berkas yang Anda unduh dan simpan sendiri.", "Report a problem via WhatsApp sends only technical info and only when you tap send in WhatsApp. If you choose Send via the app (optional, with your consent), the category, message, contact (may be empty), app version, display mode, and device code are sent to the seller's server and kept for up to 180 days after the report is marked done; no attachments and no trip data. The seller can anonymize a report at your request. Data backups are files you download and keep yourself."),
_pe("Pengumuman dari penjual diterima lewat balasan pemeriksaan lisensi yang sudah ada; tidak ada data tambahan yang dikirim untuk itu. Untuk menahan kiriman berlebihan, penjual dapat memblokir sementara sebuah sidik acak alamat jaringan atau alamat asal aplikasi (hanya manual dan berbatas waktu; alamat IP mentah tidak disimpan). Penjual tidak mengumpulkan kota atau provinsi Anda.", "Announcements from the seller arrive in the license-check reply that already exists; no extra data is sent for this. To stop excessive requests, the seller can temporarily block a random fingerprint of a network address or the app's origin address (manual and time-limited only; raw IP addresses are not stored). The seller does not collect your city or province."),
_pe("Aplikasi tidak memakai iklan atau pelacak pihak ketiga. Aplikasi dihosting di GitHub Pages dan server berjalan di layanan hosting pihak ketiga (Supabase); keduanya dapat mencatat akses jaringan sesuai kebijakannya sendiri.", "The app uses no ads or third-party trackers. The app is hosted on GitHub Pages and the server runs on a third-party hosting service (Supabase); both may log network access under their own policies."),
_pe("Penjual tidak menjual data Anda. Untuk meminta data pembelian Anda dihapus, hubungi penjual lewat WhatsApp.", "The seller does not sell your data. To request deletion of your purchase data, contact the seller via WhatsApp.")];

const SW = { priv: ['priv', false] };
const zsw = id => `<button class="zsw" id="sw_${id}" role="switch" aria-checked="${pref(SW[id][0], SW[id][1])}" aria-label="${id}" onclick="swTap('${id}')"></button>`;
const zsrow = (l, id) => `<div class="zr"><span class="zk">${l}</span><div class="zrt">${zsw(id)}</div></div>`;
const zsel = (l, key, opts, cv) => `<div class="zr"><span class="zk">${l}</span><div class="zrt"><select class="zsel" onchange="selTap('${key}',this.value)">${opts.map(([v, t]) => `<option value="${v}"${String(v) === String(cv) ? ' selected' : ''}>${t}</option>`).join('')}</select></div></div>`;
const zseg = (l, g, opts, cv) => `<div class="zr"><span class="zk">${l}</span><div class="zrt"><div class="zsg">${opts.map(([v, t]) => `<button class="${v === cv ? 'on' : ''}" aria-pressed="${v === cv}" onclick="segTap('${g}','${v}')">${t}</button>`).join('')}</div></div></div>`;
async function swTap(id) { const [k, d] = SW[id], v = !pref(k, d); await setPref(k, v); const e = $('sw_' + id); if (e) e.setAttribute('aria-checked', v); if (id === 'priv') { applyPriv(); if (!v) rerender(); } }
async function selTap(k, v) { if (k === 'kunci' || k === 'ingCad' || k === 'bulat') v = Number(v); await setPref(k, v); toast('Tersimpan'); }
async function segTap(g, v) {
  if (g === 'bhs') { await setPref('bahasa', v); setBahasa(v); } else if (g === 'tema') setTema(v); else { await setPref('fz', v); try { localStorage.setItem('fz', v); } catch (e) {} applyFz(); }

k berubah.", "v2.1.0: lencana baru di Akun: tampilan khusus untuk Developer, VVIP, VIP, Puncak, dan Rintis. Lencana hanya penanda, tidak mengubah fitur. Data dan lisensi tidak berubah.", "v2.0.0: logo dan tagline \"Lieur ngitung, bawa santai\" bawaulin.cash tampil di layar aktivasi dan layar sambutan, dan ikon aplikasi diganti. Data dan lisensi tidak berubah.", 'v1.14.6: Info Umum kini menjelaskan paket Rintis dan Puncak (Syarat & Ketentuan dan Kebijakan Privasi dokumen versi 1.1), dan Panduan punya topik Paket Rintis dan Puncak.', 'v1.14.5: tanda air bawaulin.cash di PDF paket Rintis dikembalikan ke tampilan besar yang jelas terlihat.', 'v1.14.0: paket Rintis: setelah trip pertama selesai, fitur Puncak terkunci (Simulasi, Bagi Hasil, Pendaftaran online, Salin Template, Statistik Antar-Trip, dan PDF tanpa tanda bawaulin.cash). Data tetap aman dan terbuka lagi di Sabana. Ada peringatan sebelum masa trip pertama habis.', 'v1.13.0: lencana status paket di Akun (Latihan, Trip pertama, Rintis, atau Puncak). Belum ada fitur yang dikunci.', 'v1.12.0: halaman Info Umum berisi Syarat & Ketentuan dan Kebijakan Privasi (Pengaturan › Bantuan).', 'v1.11.1: Panduan disesuaikan dengan tombol Batalkan, layar sambutan, dan ajakan cadangkan.', 'v1.11.0: hapus kini bisa dibatalkan (tombol Batalkan 7 detik) tanpa konfirmasi; layar sambutan 3 langkah untuk pengguna baru (Pengaturan > Bantuan > Lihat panduan awal); ajakan mencadangkan data setelah buku trip ditutup.', 'v1.10.1: indikator Online (titik hijau) dan Offline (titik merah) kini selalu tampil di pojok kanan atas, menggantikan tombol tema yang sudah ada di Pengaturan.', 'v1.10.0: Pengaturan dirapikan. Perilaku Input dan Pengingat dihapus (selalu aktif), pembulatan harga jual pindah ke Kalkulator, Tentang dan Bantuan dipisah.', 'v1.9.0: tanda Offline saat tidak ada internet, dan pembaruan aplikasi kini muncul otomatis.', 'v1.8.11: pemeriksaan lisensi dipindah ke server baru.', 'v1.8.10: Hitung Trip (kalkulator), banner, dan label kecil kini tersedia dalam English.', 'v1.8.9: pesan kosong, galat, layar kunci dan lisensi kini tersedia dalam English.', 'v1.8.8: kalimat privasi di Pengaturan disederhanakan dan judul topik Panduan kini tersedia dalam English.', 'v1.8.7: Trip & Arsip, Riwayat Perubahan, dan Bagi Hasil kini tersedia dalam English.', 'v1.8.6: Simulasi, Statistik Antar-Trip, kolom pencarian, dan penjelasan Patungan Otomatis kini tersedia dalam English.', 'v1.8.5: daftar Yang baru, pesan hapus/impor, dan sisa teks halaman diterjemahkan ke English.', 'v1.8.4: langkah rinci dan tips Panduan kini tersedia dalam English.', 'v1.8.3: tanggal mengikuti bahasa dan demo Panduan diterjemahkan ke English. Langkah rinci Panduan menyusul.', 'v1.8.2: terjemahan English diperluas ke Pengaturan, lembar, layar aktivasi dan kunci. Pesan WhatsApp tetap Indonesia.', 'v1.8.1: terjemahan English diperluas ke semua tab utama, toast, dan pesan konfirmasi. Panduan dan Yang baru menyusul.', 'Baru: pilihan Bahasa (Pengaturan › Tampilan): Indonesia atau English. Tahap awal: menu, tab, Pengaturan, tombol, dan pesan utama sudah berbahasa Inggris; teks yang belum diterjemahkan tetap Indonesia. Pesan WhatsApp, kwitansi, dan PDF untuk peserta tetap Indonesia. Panduan dan daftar Yang baru menyusul.', 'Baru: tombol Matikan semua kunci (Pengaturan › Keamanan) mematikan PIN, pola, dan sidik jari sekaligus setelah konfirmasi PIN. Baru juga panduan Keamanan buka aplikasi (Menu › Panduan).', 'Layar kunci didesain ulang: tanpa header, dengan logo besar bercahaya, kartu kaca, pola dan sidik jari lebih jelas, serta tombol pindah cara buka berbentuk pil. Cara kerjanya tidak berubah.', 'Baru: Cara buka aplikasi (Pengaturan › Keamanan). Selain PIN, buka dengan pola 3x3 atau sidik jari. PIN tetap jadi cadangan dan dipakai untuk mengatur. Pola salah 5 kali menunggu 30 detik. Sidik jari bergantung HP dan belum tentu jalan di semua perangkat; bila tidak didukung, opsinya tidak muncul. Cadangan membawa pola, sidik jari didaftarkan ulang.', 'Baru: Riwayat perubahan (Menu › Trip & Arsip, di bawah kartu Tutup Buku). Setiap transaksi uang yang ditambah, diubah (nilai sebelum dan sesudah), dihapus, atau dipulihkan dicatat dengan waktunya, begitu juga saat buku trip ditutup dan dibuka. Isi Nama pencatat bila beberapa panitia memakai HP yang sama. Bisa difilter dan diunduh sebagai CSV. Perubahan sebelum v1.6.0 tidak punya riwayat.', 'Baru: Tutup buku trip (Menu › Trip & Arsip). Setelah trip selesai, transaksi uang dikunci: Pemasukan, Pengeluaran, Catat bayar, penggantian Talangan, transaksi berulang, simulasi dan sewa yang masuk ke Pengeluaran. Arsip cadangan dibuat otomatis, dan kunci hanya bisa dibuka dengan mengetik BUKA. Tamu, Itinerary, Checklist, kwitansi, PDF, dan Rekap tetap bebas.', 'Tab Pembayaran dirombak. Paling atas ringkasan (terkumpul dari target, jumlah Lunas/Sebagian/Belum bayar/Telat, tenggat), lalu daftar peserta dengan pencarian dan filter. Tombol ＋ Catat bayar di tiap peserta mengisi sisa tagihan otomatis dan menyimpannya sebagai Pemasukan kategori Peserta. Tombol Tagih berikutnya membuka WhatsApp peserta yang belum ditagih satu per satu. Pengaturan cara bayar dan tagihan dilipat di bawah. Data lama aman.', 'Cara bayar kini berupa daftar: beberapa rekening bank dan e-wallet (DANA, SeaBank, ShopeePay, GoPay, OVO, LinkAja, atau nama lain), tombol Salin nomor, serta sakelar aktif. Semua yang aktif ikut di pesan tagihan WhatsApp, kwitansi, dan kata kunci {rekening}. Teks rekening lama tetap dipakai sebagai catatan.', 'Baru: Kartu cara bayar (PDF) dan Cara bayar ke grup WhatsApp, berisi semua rekening, e-wallet, QRIS, dan tenggat. Dasar hitung tagihan disederhanakan jadi satu baris (ketuk Ubah); aturan hitungnya tidak berubah.', 'Formulir pendaftaran online disederhanakan: Nama, Nomor WhatsApp, Meeting point, Alergi makanan (Ya/Tidak), dan Catatan. Golongan darah, riwayat penyakit, dan kontak darurat tidak lagi diminta. Pendaftar dengan alergi ditandai "Alergi makanan: Ya" di Catatan tamu. Data tamu lama tidak diubah. Pasang ulang skrip Apps Script pendaftaran yang baru.', 'Baru: Menu › Trip & Arsip › Salin Trip sebagai Template. Trip baru langsung berisi itinerary, checklist (belum siap, tanpa pembawa), dan kategori dari trip sebelumnya; tamu dan uang kosong. Tanggal itinerary bisa digeser otomatis.', 'Baru: Pengaturan › Tentang & Bantuan › Lapor masalah. Membuka WhatsApp penjual dengan info teknis siap kirim (versi, kode perangkat, status lisensi, perangkat), tanpa data trip, peserta, atau uang. Terkirim hanya bila Anda menekan kirim di WhatsApp.', 'Baru: panduan Pindah ke HP baru (Menu › Panduan).', 'Kartu Ringkasan di Akun dihapus.', 'Perbaikan: angka 0 di depan nomor WhatsApp tidak lagi hilang (tagihan WA, daftar Tamu, dan impor pendaftar online). Data lama tidak diubah.', 'Penomoran versi dimulai ulang dari v1.0.0. Tidak ada perubahan fitur.', 'Keamanan lisensi: aplikasi memeriksa status lisensi ke server (otomatis maks. tiap 1 jam, atau kapan saja lewat Pengaturan › Periksa status lisensi sekarang; tidak menahan aplikasi). Tanpa internet tetap jalan sampai 30 hari sejak pemeriksaan terakhir. Lisensi dicabut, versi terlalu lama, atau jam HP dimundurkan akan mengunci aplikasi. Kunci aktivasi lama diganti kunci baru.', 'Ikon Pengaturan (gerigi) pindah ke kanan judul Akun, di bawah tombol terang/gelap. Kartu Pengaturan di Akun dihapus.', 'Kalkulator pindah ke Menu › Kalkulator: tampilan seperti kalkulator HP, memori, riwayat, tombol ÷ Peserta dan Bulat, plus 7 rumus Hitung Trip.', 'Akun: kartu profil dan tombol Pengaturan menyatu, serta ada Data & Cadangan.', 'Tentang pembuat: tombol Instagram dan WhatsApp saja, tanpa tulisan nama atau nomor.', 'Pengaturan baru: pesan tagihan WhatsApp bisa diubah, pembulatan harga jual, dan Cek pembaruan aplikasi.', 'Panduan singkat kini berisi demo bergerak dan langkah rinci untuk semua fitur (Menu › Panduan).'];

p (free) and Import trip recap (Puncak): a recap file can be sent to another phone, added to the Archive, and reopened for editing to match actual results. Note: a v4 backup restored in an older app version only brings the trip of the active mode. Your data and license are unchanged."});

const listSheet = (t, a) => sheetOpen(`<h3>${t}</h3>${a.map(x => `<div class="zli">• ${esc(x)}</div>`).join('')}`);
async function resetPref() {
  if (!confirm('Kembalikan semua pengaturan tampilan dan perilaku ke bawaan? Data trip tidak berubah.')) return;
  DB.pref = {}; await save(); try { localStorage.setItem('t', 'dark'); localStorage.removeItem('fz'); } catch (e) {} setTema('dark'); applyAll(); rerender(); toast('Pengaturan dikembalikan');
}
function togHapus() { const e = $('zdel'); if (e) e.hidden = !e.hidden; }
/* PIN */
const rcBaru = () => { const a = crypto.getRandomValues(new Uint8Array(8)); const c = Array.from(a, x => LIC_AL[x % 32]).join(''); return c.slice(0, 4) + '-' + c.slice(4); };
function togPin() { const e = $('zpin'); if (e) e.hidden = !e.hidden; }
async function savePin() {
  const before = JSON.stringify(DB.pin); await setPin();
  if (JSON.stringify(DB.pin) !== before) { renderPengRefresh(); if (DB.pin && DB.pin.rc && !JSON.parse(before || 'null')) listSheet('Kode pemulihan PIN', ['Simpan kode ini: ' + DB.pin.rc, 'Dipakai jika Anda lupa PIN (tombol "Lupa PIN?" di layar kunci).', 'Bisa dilihat lagi di Pengaturan → Kode pemulihan PIN.']); else toast(DB.pin ? 'PIN disimpan' : 'PIN dinonaktifkan'); }
}
const renderPengRefresh = () => rerender();
function lihatRc() {
  if (!DB.pin) return toast('Aktifkan PIN dulu');
  formSheet('Kode pemulihan PIN', [{ id: 'pin', label: 'Masukkan PIN Anda', type: 'password' }], async v => {
    if (await sha(DB.pin.salt + ':' + v.pin) !== DB.pin.hash) return toast('PIN salah');
    if (!DB.pin.rc) { DB.pin.rc = rcBaru(); await save(); }
    listSheet('Kode pemulihan PIN', ['Kode Anda: ' + DB.pin.rc, 'Simpan di tempat aman. Dipakai lewat "Lupa PIN?" di layar kunci.']);
  });
}
function pinMinta(judul, cb) {
  formSheet(judul, [{ id: 'pin', label: 'Masukkan PIN Anda', type: 'password' }], async v => {
    if (!DB.pin || await sha(DB.pin.salt + ':' + v.pin) !== DB.pin.hash) return toast('PIN salah');
    await cb();
  });
}
function matiSemua() {
  if (!DB.pin) return toast('Kunci sudah mati');
  pinMinta('Matikan semua kunci', async () => {
    if (!confirm('Matikan PIN, pola, dan sidik jari? Aplikasi akan terbuka tanpa kunci. Anda bisa mengaktifkan lagi kapan saja di Pengaturan.')) return;
    DB.pin = null; await save(); rerender(); toast('Semua kunci dimatikan');
  });
}
function caraSheet() {
  if (!DB.pin) return toast('Aktifkan PIN dulu');
  const p = !!DB.pin.pola, b = !!DB.pin.bio;
  sheetOpen(`<h3>Cara buka aplikasi</h3><small class="mut">PIN tetap jadi cadangan. Pola dan sidik jari hanya gerbang di layar, bukan enkripsi data.</small>
    <div class="zr"><span class="zk">Pola 3x3</span><div class="zrt"><span class="zv ${p ? 'ok' : 'zph'}">${p ? 'Aktif' : 'Belum aktif'}</span></div></div>
    <button class="btn alt" onclick="pinMinta('Atur pola', polaAtur)">${p ? 'Ganti pola' : 'Atur pola'}</button>${p ? `<button class="btn alt" onclick="pinMinta('Matikan pola', polaMati)">Matikan pola</button>` : ''}
    <div class="zr"><span class="zk">Sidik jari</span><div class="zrt"><span class="zv ${b ? 'ok' : 'zph'}">${BIO_OK ? (b ? 'Aktif' : 'Belum aktif') : 'Tidak didukung di perangkat ini'}</span></div></div>
    ${BIO_OK ? (b ? `<button class="btn alt" onclick="pinMinta('Matikan sidik jari', bioMati)">Matikan sidik jari</button>` : `<button class="btn alt" onclick="pinMinta('Aktifkan sidik jari', bioAktif)">Aktifkan sidik jari</button>`) : ''}
    <button class="btn red" onclick="matiSemua()">Matikan semua kunci</button>`);
}
function polaAtur() {
  let langkah = 1, pertama = null;
  sheetOpen(`<h3>Atur pola</h3><div id="pamsg" class="msg">Gambar pola (minimal 4 titik).</div><div id="polaPad"></div><button class="btn alt" onclick="$('fsheet').remove()">Batal</button>`);
  const pad = polaPad('polaPad', async seq => {
    const k = seq.join('-');
    if (seq.length < 4) { setMsg('pamsg', 'Minimal 4 titik. Coba lagi.', 0); return pad.reset(); }
    if (langkah === 1) { pertama = k; langkah = 2; setMsg('pamsg', 'Gambar sekali lagi untuk konfirmasi.', 1); return pad.reset(); }
    if (k !== pertama) { langkah = 1; pertama = null; setMsg('pamsg', 'Tidak sama. Ulangi dari awal.', 0); return pad.reset(); }
    const salt = String(Math.random()).slice(2) + Date.now(); DB.pin.pola = { salt, hash: await sha(salt + ':' + k) };
    await save(); const f = $('fsheet'); if (f) f.remove(); rerender(); toast('Pola disimpan');
  });
}
async function polaMati() { delete DB.pin.pola; await save(); rerender(); toast('Pola dimatikan'); }
async function bioAktif() {
  try { const id = await bioDaftar(); if (!id) throw 0; DB.pin.bio = { id }; await save(); rerender(); toast('Sidik jari diaktifkan'); }
  catch (e) { toast('Sidik jari gagal diaktifkan atau dibatalkan'); }
}
async function bioMati() { delete DB.pin.bio; await save(); rerender(); toast('Sidik jari dimatikan'); }

}
async function pulihPin() {

    st: ['Buka Menu › Kalkulator. Tiga mode: Kalkulator, Hitung Trip, dan Riwayat.', 'Tombol angka, + − × ÷, koma desimal, dan ⌫ seperti kalkulator HP. AC menghapus semua.', 'Tombol ( ) pintar: menaruh kurung buka lalu kurung tutup sesuai kebutuhan.', 'Persen menyesuaikan angka di depannya: 200 + 10% = 220, 200 × 10% = 20, 50% = 0,5.', 'Ketuk = untuk menyimpan hitungan ke Riwayat. Hasil bisa dilanjutkan dengan operator berikutnya.', 'Angka bulat 1.000 ke atas otomatis dieja di bawah hasil (terbilang).', 'Chip 📋 Salin menyalin hasil. 👥 ÷ Peserta membagi hasil dengan jumlah peserta Diterima. ⬆ Bulat membulatkan ke atas sesuai pilihan Pembulatan (Rp1.000, 5.000, atau 10.000) di bawahnya.', 'Memori: M+ dan M− menambah atau mengurangi, MR memanggil, MC menghapus.', 'Hitung Trip: Patungan per orang, Harga jual dari target untung, Balik modal, DP dan sisa, Selisih dan persen, Diskon dan PPN, Konversi mata uang. Ketuk Salin hasil untuk membagikannya.', 'Riwayat: ketuk satu baris untuk memakai lagi hasilnya.'],

    st: ['Menu › Pembayaran. Ringkasan di atas menunjukkan jumlah terkumpul, status tiap peserta, dan tenggat.', 'Tagihan per orang diambil dengan urutan: tagihan tetap, lalu harga jual simulasi, lalu Total Realisasi dibagi peserta Diterima. Ketuk Ubah di baris Tagihan per orang untuk melihat hitungan lain.', 'Cari peserta lewat kotak pencarian, atau saring dengan Belum lunas, Sebagian, Lunas, dan Telat.', 'Ketuk ＋ Catat bayar, cek jumlah, pilih Dibayar lewat, lalu Simpan. Pembayaran tersimpan sebagai Pemasukan kategori Peserta dan bisa diubah atau dihapus di Menu › Masuk.', 'Buka kartu Cara bayar untuk menambah rekening bank dan e-wallet (nama bebas, mis. OVO atau LinkAja). Ketuk Salin nomor untuk menyalin. Matikan Aktif bila tidak ingin tampil.', 'Ketuk 💬 Tagih untuk mengirim pesan WhatsApp berisi total, yang sudah dibayar, sisa, tenggat, dan semua cara bayar aktif. Tagih berikutnya membuka peserta yang belum ditagih satu per satu. Isi pesan bisa diubah di Pengaturan › Pesan tagihan.', 'Bagikan › Kartu cara bayar (PDF) atau Cara bayar ke grup WhatsApp untuk memberi tahu semua peserta sekaligus.', 'Ketuk 🧾 Kwitansi untuk membuat kwitansi. Nomor berformat KW/kode penyelenggara/kode destinasi/tahun/urut. Cetak ulang dengan jumlah bayar yang sama memakai nomor yang sama.', 'Tanda tangan, stempel, nama penanda tangan, dan kode penyelenggara diatur di Akun › Kwitansi.'],

function selesaiBSData() {

  rowsOf('pengeluaran').forEach(r => {

    if (i >= 0) { P[i].talang += v; P[i].items.push(r['Detail pengeluaran']); }
    else { const k = normN(w), o = ext[k] || (ext[k] = { nama: w, ponsel: '', peran: 'Di luar daftar anggota', iuran: 0, talang: 0, items: [], luar: true }); o.talang += v; o.items.push(r['Detail pengeluaran']); }
  });

  A.forEach(p => { p.adil = p.luar ? 0 : fair; p.setor = p.iuran + p.talang; p.sel = Math.round(p.setor - p.adil); });
  const kasR = sum(A, p => p.sel), hold = P.find(p => p.peran === 'Bendahara'), kasNama = hold ? hold.nama : 'Kas';
  A.forEach(p => { p.pegang = hold && p === hold ? kasR : 0; p.net = p.sel + (hold && p === hold ? -kasR : 0); });
  const bal = A.map(p => ({ nama: p.nama, v: p.net })); if (!hold && kasR) bal.push({ nama: 'Kas', v: -kasR });
  const deb = bal.filter(x => x.v < 0).map(x => ({ nama: x.nama, v: -x.v })).sort((a, c) => c.v - a.v), kre = bal.filter(x => x.v > 0).map(x => ({ nama: x.nama, v: x.v })).sort((a, c) => c.v - a.v), tf = [];
  let i = 0, j = 0; while (i < deb.length && j < kre.length) { const m = Math.min(deb[i].v, kre[j].v); if (m > 0) tf.push({ dari: deb[i].nama, ke: kre[j].nama, jml: m }); deb[i].v -= m; kre[j].v -= m; if (deb[i].v <= 0) i++; if (kre[j].v <= 0) j++; }

}
