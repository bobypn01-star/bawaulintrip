<header><img id="hlogo" src="logo.png" alt="Logo"><div class="ht"><h1>Budgeting Pendakian</h1><small id="hnama">bawaulin.trip</small></div><div id="net" role="status"></div></header>

<script>
/* ===== Struktur data (sama dengan sheet di Spreadsheet lama) ===== */
const CFG = {
  tamu: { label: 'Tamu', fields: [
    { h: 'Nama', type: 'text', req: 1 }, { h: 'Meeting Point', type: 'text' }, { h: 'Ponsel', type: 'tel' },
    { h: 'Status', type: 'select', options: ['Diterima', 'Menunggu respons', 'Ditolak'] },
    { h: 'Tagihan', type: 'select', options: ['Lunas', 'DP', 'Belum Lunas'] }, { h: 'Catatan', type: 'textarea' }] },
  pemasukan: { label: 'Pemasukan', fields: [
    { h: 'Detail pemasukan', type: 'text', req: 1 }, { h: 'Kategori', type: 'select', options: ['Peserta', 'Panitia', 'Sponsor'] },
    { h: 'Biaya', type: 'number', rp: 1 }, { h: 'Tanggal transaksi', type: 'date' }, { h: 'Dibayar oleh', type: 'text' }, { h: 'Catatan', type: 'textarea' }] },
  pengeluaran: { label: 'Pengeluaran', fields: [
    { h: 'Detail pengeluaran', type: 'text', req: 1 },
    { h: 'Kategori', type: 'select', options: ['Transportasi', 'Konsumsi', 'Peralatan', 'Darurat', 'Simaksi', 'Ojeg BC', 'P3K', 'Lainnya'] },
    { h: 'Anggaran', type: 'number', rp: 1 }, { h: 'Biaya', type: 'number', rp: 1 }, { h: 'Quantity', type: 'number', def: 1 },
    { h: 'Total Anggaran', ro: 1, rp: 1, f: r => (+r['Anggaran'] || 0) * (+r['Quantity'] || 0) },
    { h: 'Total Biaya', ro: 1, rp: 1, f: r => (+r['Biaya'] || 0) * (+r['Quantity'] || 0) },
    { h: 'Tanggal transaksi', type: 'date' }, { h: 'Dibayar oleh', type: 'text' }, { h: 'Catatan', type: 'textarea' }] },
  itinerary: { label: 'Itinerary', fields: [
    { h: 'Aktivitas', type: 'text', req: 1 },
    { h: 'Jenis aktivitas', type: 'select', options: ['Mepo - BC', 'BC - POS 1', 'POS 1 - POS 2', 'POS 2 - POS 3', 'POS 3 - POS 4', 'POS 4 - POS 5', 'POS 5 - POS 6', 'ISHOMA', 'CAMP GROUND', 'CAMP - BC', 'BC - MEPO', 'SUMMIT'] },
    { h: 'Waktu mulai', type: 'datetime-local' }, { h: 'Waktu berakhir', type: 'datetime-local' }, { h: 'Lokasi', type: 'text' }, { h: 'Catatan', type: 'textarea' }] },
  perlengkapan: { label: 'Perlengkapan', fields: [
    { h: 'Perlengkapan', type: 'text', req: 1 }, { h: 'Kebutuhan', type: 'number' }, { h: 'Kesediaan', type: 'number' },
    { h: 'Sewa', ro: 1, f: r => Math.max(0, (+r['Kebutuhan'] || 0) - (+r['Kesediaan'] || 0)) },
    { h: 'Harga/Unit', type: 'number', rp: 1 },
    { h: 'Total Sewa', ro: 1, rp: 1, f: r => Math.max(0, (+r['Kebutuhan'] || 0) - (+r['Kesediaan'] || 0)) * (+r['Harga/Unit'] || 0) }] }
};
const KEYS = Object.keys(CFG);

/* ===== Penyimpanan lokal (IndexedDB) ===== */
let DB, cur = 'dashboard', editId = null;
const blank = () => ({ set: { destinasi: '', realisasi: 0 }, tamu: [], pemasukan: [], pengeluaran: [], itinerary: [], perlengkapan: [], checklist: [], arsip: [], sim: [], simAktif: null, pin: null, ganti: {}, kat: {}, ulang: [], seen: {}, trash: [], log: [], pribadi: [], lastBackup: 0, seq: 1, pref: {}, profil: {}, kw: {}, nomor: {} });
function idb() { return new Promise((ok, no) => { const r = indexedDB.open('budgeting', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); }
async function load() { const d = await idb(); return new Promise(ok => { const q = d.transaction('kv').objectStore('kv').get('db'); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); }
async function save() { const d = await idb(); return new Promise(ok => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(DB, 'db'); t.oncomplete = ok; t.onerror = ok; }); }

/* ===== Helper ===== */
const $ = id => document.getElementById(id);
const rp = n => 'Rp ' + Math.round(Number(n) || 0).toLocaleString('id-ID');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = v => { const m = String(v || '').match(/^(\d{4})-(\d\d)-(\d\d)(?:T(\d\d:\d\d))?/); return m ? m[3] + '/' + m[2] + '/' + m[1] + (m[4] ? ' ' + m[4] : '') : (v || ''); };
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
function badge(v) {
  const s = String(v).toLowerCase(), c = ['lunas', 'diterima'].includes(s) ? 'g' : ['dp', 'menunggu respons'].includes(s) ? 'y' : ['belum lunas', 'ditolak'].includes(s) ? 'r' : '';
  return c ? `<span class="badge ${c}">${esc(v)}</span>` : esc(v);
}
function calc(key, r) { const o = Object.assign({}, r); CFG[key].fields.forEach(f => { if (f.ro) o[f.h] = f.f(o); }); return o; }
const rowsOf = key => DB[key].map(r => calc(key, r));
const sum = (a, f) => a.reduce((s, x) => s + (+f(x) || 0), 0);
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type || 'application/json' })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
/* v1.0.1: rapikan nomor HP (angka 0 di depan sering hilang dari Google Sheet) */
function normHP(v) { const s = String(v == null ? '' : v).trim(); if (!s || !/^[+\d\s().-]+$/.test(s)) return s; const d = s.replace(/\D/g, ''); if (/^62\d{8,13}$/.test(d)) return '0' + d.slice(2); if (/^8\d{8,11}$/.test(d)) return '0' + d; return s; }
function waDigits(v) { let d = normHP(v).replace(/\D/g, ''); if (d.indexOf('0') === 0) d = '62' + d.slice(1); return d; }
function openWA(t, no) { const a = document.createElement('a'); a.href = 'https://wa.me/' + (no || '') + '?text=' + encodeURIComponent(t); a.target = '_blank'; document.body.appendChild(a); a.click(); a.remove(); }
function setMsg(id, text, ok) { const e = $(id); if (e) { e.textContent = text; e.className = 'msg ' + (ok ? 'ok' : 'err'); } }

/* ===== Hitungan dashboard ===== */
function dash() {
  const masuk = sum(DB.pemasukan, r => r['Biaya']), pr = rowsOf('pengeluaran');
  const anggaran = sum(pr, r => r['Total Anggaran']), keluar = sum(pr, r => r['Total Biaya']), real = +DB.set.realisasi || 0;
  const persen = real ? keluar / real : 0, kat = {};
  pr.forEach(r => { const k = String(r['Kategori'] || '').trim() || '(Tanpa kategori)'; const o = kat[k] || (kat[k] = { k, anggaran: 0, biaya: 0 }); o.anggaran += r['Total Anggaran']; o.biaya += r['Total Biaya']; });
  const kategori = Object.values(kat), warnings = [];
  kategori.forEach(x => { if (x.biaya > x.anggaran) warnings.push({ level: 'red', text: x.k + ' lewat ' + rp(x.biaya - x.anggaran) + ' dari anggaran' }); });
  if (real > 0) {
    if (persen > 1) warnings.push({ level: 'red', text: 'Total pengeluaran melebihi Total Realisasi sebesar ' + rp(keluar - real) });
    else if (persen >= 0.8) warnings.push({ level: 'yellow', text: 'Pemakaian sudah ' + (persen * 100).toFixed(0) + '% dari Total Realisasi' });
  }
  return { destinasi: DB.set.destinasi, real, anggaran, masuk, keluar, saldo: masuk - keluar, persen, kategori, warnings };
}
const hbar = (l, v, mx, c, t) => `<div class="hrow"><div>${esc(l)}</div><div class="htrack"><div style="width:${mx > 0 ? Math.min(100, v / mx * 100) : 0}%;background:${c}"></div></div><div class="hv">${t}</div></div>`;
const stat = (l, v) => `<div class="stat"><small>${esc(l)}</small><b>${esc(v)}</b></div>`;

/* ===== Navigasi ===== */
const TABS = [['dashboard', 'Dashboard']].concat(KEYS.map(k => [k, CFG[k].label])).concat([['checklist', 'Checklist'], ['simulasi', 'Simulasi'], ['bayar', 'Pembayaran'], ['rekap', 'Rekap'], ['trip', 'Trip & Arsip'], ['bagihasil', 'Bagi Hasil'], ['kategori', 'Kategori'], ['daftar', 'Pendaftaran'], ['akun', 'Akun'], ['pengaturan', 'Pengaturan'], ['kalk', 'Kalkulator'], ['panduan', 'Panduan']]);
function show(k) {

  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.k === (MAIN.includes(k) ? k : k === 'pengaturan' ? 'akun' : 'more')));
  if (k === 'dashboard') renderDash(); else if (k === 'more') renderMore(); else if (k === 'checklist') renderCl(); else if (k === 'trip') renderTrip(); else if (k === 'simulasi') renderSim(); else if (k === 'bayar') renderBayar(); else if (k === 'rekap') renderRekap(); else if (k === 'bagihasil') renderBagiHasil(); else if (k === 'kategori') renderKat(); else if (k === 'daftar') renderDaftar(); else if (k === 'akun') renderAkun(); else if (k === 'pengaturan') renderPeng(); else if (k === 'kalk') renderKalk(); else if (k === 'panduan') { if (!PD.keep) PD.ch = -1; PD.keep = false; renderPanduan(); } else renderSheet(k);
  if (k !== 'dashboard' && k !== 'more') { const lb = (TABS.find(t => t[0] === k) || ['', ''])[1]; $('main').insertAdjacentHTML('afterbegin', `<div class="pgh">${MAIN.includes(k) ? '' : k === 'pengaturan' ? '<button class="back" onclick="show(\'akun\')">‹ Akun</button>' : '<button class="back" onclick="show(\'more\')">‹ Menu</button>'}<h2>${lb}</h2>${k === 'akun' ? `<button class="pgear" onclick="show(\'pengaturan\')" aria-label="Buka Pengaturan">${SVG_GEAR}</button>` : ''}</div>`); }
  if (tutupOn() && ['dashboard', 'pemasukan', 'pengeluaran', 'bayar', 'bagihasil'].indexOf(k) >= 0) { const h = $('main').querySelector('.pgh'); if (h) h.insertAdjacentHTML('afterend', tutupBanner()); else $('main').insertAdjacentHTML('afterbegin', tutupBanner()); }
  if (CR_OK === false) $('main').insertAdjacentHTML('afterbegin', '<div class="warn red">Identitas pembuat aplikasi berubah. Fitur PDF dikunci. Pasang ulang aplikasi asli.</div>');
  window.scrollTo(0, 0);
}

async function pushSewa() {

  const label = 'Sewa perlengkapan', ex = DB.pengeluaran.find(r => r['Detail pengeluaran'] === label);
  if (ex) { const b0 = JSON.parse(JSON.stringify(ex)); ex['Anggaran'] = total; ex['Biaya'] = total; ex['Quantity'] = 1; const d = logDiff('pengeluaran', b0, ex); if (d.length) logAdd('ubah', 'pengeluaran', ex, { s: 'sewa', d }); }
  else { const nr = { id: DB.seq++, 'Detail pengeluaran': label, 'Kategori': 'Peralatan', 'Anggaran': total, 'Biaya': total, 'Quantity': 1, 'Tanggal transaksi': today(), 'Dibayar oleh': '', 'Catatan': 'Otomatis dari tab Perlengkapan' }; DB.pengeluaran.push(nr); logAdd('tambah', 'pengeluaran', nr, { s: 'sewa' }); }

}
function resetForm(key) {

async function submitRow(key) {
  if (UANG(key) && bukuTutup()) return;
  const c = CFG[key], data = {};
  c.fields.forEach((f, i) => { if (!f.ro) data[f.h] = $('f' + i).value; });
  if (!String(data[c.fields[0].h]).trim()) return setMsg('fmsg', c.fields[0].h + ' wajib diisi', 0);
  c.fields.forEach(f => { if (f.type === 'number' && data[f.h] !== '') data[f.h] = Number(f.rp ? String(data[f.h]).replace(/\./g, '') : data[f.h]); });
  if (BUKTI !== null) data['Bukti'] = BUKTI;
  let nrow, before = null;
  if (editId) { const r = DB[key].find(x => x.id === editId); if (UANG(key)) before = JSON.parse(JSON.stringify(r)); Object.assign(r, data); nrow = r; }
  else { nrow = Object.assign({ id: DB.seq++ }, data); DB[key].push(nrow); }
  if (UANG(key)) { if (before) { const d = logDiff(key, before, nrow); if (d.length) logAdd('ubah', key, nrow, { s: 'manual', d }); } else logAdd('tambah', key, nrow, { s: 'manual' }); }
  if (!editId && $('frep') && $('frep').value) { const t = JSON.parse(JSON.stringify(data)); delete t.Bukti; const n = +$('frep').value; DB.ulang.push({ id: DB.seq++, key, data: t, tiap: n, next: addDays(String(data['Tanggal transaksi'] || today()).slice(0, 10), n) }); }
  const wasEdit = !!editId; await save(); resetForm(key); drawList(key); if (key === 'perlengkapan') drawSewa();
  closeSheet(); toast(wasEdit ? 'Data diperbarui' : 'Data tersimpan');

function editRow(key, id) {
  if (UANG(key) && bukuTutup()) return;
  const r = DB[key].find(x => x.id === id); editId = id; BUKTI = null; showPrev(r.Bukti);
  CFG[key].fields.forEach((f, i) => { const e = $('f' + i); if (e) e.value = r[f.h] == null ? '' : (f.rp ? fmtN(r[f.h]) : r[f.h]); });
  $('ftitle').textContent = 'Edit ' + CFG[key].label; $('fbtn').textContent = 'Update'; $('fcancel').style.display = 'block'; openSheet();
}
function drawList(key) {
  const c = CFG[key], box = $('tblbox'); if (!box) return;
  const HB = key === 'pemasukan' || key === 'pengeluaran'; if (key === 'itinerary') drawRundown();
  const q = ($('q').value || '').toLowerCase().trim(), d1 = $('d1') ? $('d1').value : '', d2 = $('d2') ? $('d2').value : '';
  const di = c.fields.find(f => f.type === 'date');
  const all = rowsOf(key).reverse();
  const rows = all.filter(r => {
    if (q && c.fields.map(f => r[f.h]).join(' ').toLowerCase().indexOf(q) < 0) return false;
    for (let i = 0; i < c.fields.length; i++) { const s = $('flt' + i); if (s && s.value && r[c.fields[i].h] !== s.value) return false; }
    if (di && (d1 || d2)) { const v = String(r[di.h] || '').slice(0, 10); if (!v || (d1 && v < d1) || (d2 && v > d2)) return false; }
    return true;
  });
  let h = `<small class="mut">Menampilkan ${rows.length} dari ${all.length} data</small>`;
  if (!rows.length) { box.innerHTML = h + '<div>Belum ada data.</div>'; return; }
  box.innerHTML = h + rows.map(r => txRow(key, r)).join('');
}

/* ===== Simulasi ===== */
const SIM_T = { orang: 'Per orang', grup: 'Sekali per trip', tenda: 'Tenda (sewa jika stok kurang)' };
const KATS = CFG.pengeluaran.fields[1].options, up5 = x => { const b = (typeof DB !== 'undefined' && DB && DB.pref && Number(DB.pref.bulat)) || 5000; return Math.ceil(x / b) * b; };
const simDef = () => ({ nama: '', peserta: 0, official: 0, ikut: true, harga: 0, target: 0, items: [] });
let SIM = null;
function simCalc(s, p) {
  const orang = p + (s.ikut ? +s.official || 0 : 0); let total = 0, tendaSewa = 0; const rows = [];
  s.items.forEach(it => {
    const std = +it.std || 0, sim = +it.sim || 0; let cost, qty, sewa = 0, unitStd = std;
    if (it.t === 'orang') { cost = sim * orang; qty = orang; }
    else if (it.t === 'grup') { cost = sim; qty = 1; unitStd = std * p; }
    else { const need = Math.ceil(orang / Math.max(1, +it.kap || 1)); sewa = Math.max(0, need - (+it.stok || 0)); cost = sewa * sim; qty = sewa; tendaSewa += sewa; }
    total += cost; rows.push({ n: String(it.n || ''), t: it.t, kat: it.kat || 'Lainnya', cost, rev: std * p, qty, unitSim: sim, unitStd, sewa });
  });
  const off = +s.official || 0, pend = (+s.harga || 0) * p, profit = pend - total;
  return { orang, total, rows, tendaSewa, pend, profit, perOff: off ? profit / off : 0, margin: pend ? profit / pend * 100 : 0,
    be: p ? up5(total / p) : 0, hTarget: p ? up5((total + (+s.target || 0) * off) / p) : 0 };
}
function renderSim() {
  SIM = SIM || simDef();
  $('main').innerHTML = `<div class="card"><h3>Skenario Simulasi</h3><select id="ssel"><option value="">-- Pilih skenario tersimpan --</option>${DB.sim.map(x => `<option value="${x.id}">${esc(x.nama)} (${esc(x.diubah)})</option>`).join('')}</select>
  <div class="flt"><button class="btn alt" onclick="simLoad()">Muat</button><button class="btn" onclick="simSave()">Simpan</button><button class="btn alt" onclick="simDel()">Hapus</button><button class="btn alt" onclick="SIM=simDef();renderSim()">Form baru</button></div><div id="smsg" class="msg"></div></div>

/* pola 3x3 */
function polaPad(id, done) {
  const el = $(id); if (!el) return null; let seq = [], on = false, px = 0, py = 0;
  const pt = i => [50 + 100 * (i % 3), 50 + 100 * Math.floor(i / 3)];
  el.innerHTML = '<svg viewBox="0 0 300 300" style="touch-action:none;display:block;width:min(78vw,280px);margin:12px auto;user-select:none"><polyline fill="none" stroke="var(--pri)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>' + [0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => { const [x, y] = pt(i); return `<circle cx="${x}" cy="${y}" r="34" fill="transparent"/><circle class="pd" cx="${x}" cy="${y}" r="10" fill="var(--mut)"/>`; }).join('') + '</svg>';
  const svg = el.firstChild, pl = svg.querySelector('polyline'), ds = svg.querySelectorAll('.pd');
  const draw = () => { pl.setAttribute('points', seq.map(i => pt(i).join(',')).concat(on ? [px + ',' + py] : []).join(' ')); ds.forEach((d, i) => { d.setAttribute('fill', seq.includes(i) ? 'var(--pri)' : 'var(--mut)'); d.setAttribute('r', seq.includes(i) ? 14 : 10); }); };
  const xy = e => { const r = svg.getBoundingClientRect(); px = (e.clientX - r.left) * 300 / r.width; py = (e.clientY - r.top) * 300 / r.height; };
  const hit = () => { for (let i = 0; i < 9; i++) { const [x, y] = pt(i); if (Math.hypot(px - x, py - y) < 38) return i; } return -1; };
  const add = i => {

    if (seq.length) { const l = seq[seq.length - 1], r1 = Math.floor(l / 3), c1 = l % 3, r2 = Math.floor(i / 3), c2 = i % 3;
      if ((r2 - r1) % 2 === 0 && (c2 - c1) % 2 === 0) { const m = ((r1 + r2) / 2) * 3 + (c1 + c2) / 2; if (!seq.includes(m)) seq.push(m); } }
    seq.push(i);
  };
  svg.addEventListener('pointerdown', e => { e.preventDefault(); try { svg.setPointerCapture(e.pointerId); } catch (x) {} seq = []; on = true; xy(e); add(hit()); draw(); });
  svg.addEventListener('pointermove', e => { if (!on) return; xy(e); add(hit()); draw(); });
  const end = () => { if (!on) return; on = false; draw(); const r = seq.slice(); if (r.length) done(r); };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  return { reset() { seq = []; on = false; draw(); } };
}
async function polaCek(seq) {

}

function geserTgl(v, diff) { const m = /^(\d{4})-(\d{2})-(\d{2})(.*)$/.exec(String(v || '')); if (!m) return ''; return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3] + diff)).toISOString().slice(0, 10) + m[4]; }
function templateItin(src, tglBaru) {

  let diff = 0; if (tglBaru && awal) { const a = awal.split('-'), b = tglBaru.split('-'); diff = Math.round((Date.UTC(+b[0], +b[1] - 1, +b[2]) - Date.UTC(+a[0], +a[1] - 1, +a[2])) / 86400000); }
  return src.map(r => { const o = JSON.parse(JSON.stringify(r)); o.id = DB.seq++;
    if (tglBaru && awal) { o['Waktu mulai'] = geserTgl(r['Waktu mulai'], diff); o['Waktu berakhir'] = geserTgl(r['Waktu berakhir'], diff); }
    else { o['Waktu mulai'] = ''; o['Waktu berakhir'] = ''; } return o; });
}

/* ===== Lisensi (seumur hidup, offline). Disimpan di key terpisah, tidak ikut cadangan ===== */
const LIC_PUB = {"kty":"EC","crv":"P-256","x":"mD6bhZjeFLyK40bL1ls_1Xvd3porPlmcp6oY4Eut1X0","y":"Eol83fbMSZCdEcwHF9_SJ5FbpRfz8j371PnFLnOwFHk"};
const LIC_AL = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
async function kvGet(k) { const d = await idb(); return new Promise(ok => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => ok(q.result === undefined ? null : q.result); q.onerror = () => ok(null); }); }
async function kvPut(k, v) { const d = await idb(); return new Promise(ok => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = ok; t.onerror = ok; }); }
async function devId() {
  let id = await kvGet('devid'); try { id = id || localStorage.getItem('bu_id'); } catch (e) {}
  if (!/^BU-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$/.test(id || '')) { const a = crypto.getRandomValues(new Uint8Array(8)); const c = Array.from(a, x => LIC_AL[x % 32]).join(''); id = 'BU-' + c.slice(0, 4) + '-' + c.slice(4); }
  await kvPut('devid', id); try { localStorage.setItem('bu_id', id); } catch (e) {}
  return id;
}
async function licOk(id, key) {
  try {
    const sig = Uint8Array.from(atob(String(key).trim().replace(/\s/g, '').replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
    if (sig.length !== 64) return false;
    const k = await crypto.subtle.importKey('jwk', LIC_PUB, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
    return await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, k, sig, new TextEncoder().encode('bawaulin|' + id));
  } catch (e) { return false; }
}
async function cekLisensi() { try { const id = await devId(), l = await kvGet('lic'); return !!l && await licOk(id, l); } catch (e) { return false; } }
async function layarAktivasi(note) {
  const id = await devId(); if (Date.now() - licReg > 6e5) { licReg = Date.now(); licKirim('reg'); }
  $('nav').innerHTML = ''; $('main').innerHTML = `<div class="card"><h3>🔑 Aktivasi Aplikasi</h3>
  <div class="msg err">${note || ''}</div>
  <p>Kode perangkat Anda:</p><input id="did" value="${id}" readonly>
  <button class="btn alt" onclick="salinId()">Salin kode perangkat</button>
  <p>Kirim kode ini ke penjual, lalu tempel kunci aktivasi dari penjual di bawah.</p>
  <textarea id="lk" rows="4" placeholder="Tempel kunci aktivasi"></textarea>
  <button class="btn" onclick="aktifkan()">Aktifkan</button></div>${pembuatHtml()}`;
}
function salinId() { const e = $('did'); e.select(); try { navigator.clipboard.writeText(e.value); } catch (x) { document.execCommand('copy'); } toast('Kode tersalin'); }
async function aktifkan() {
  const id = await devId(), k = $('lk').value.trim();
  if (!k) return layarAktivasi('Tempel kunci aktivasi dulu.');
  if (!await licOk(id, k)) return layarAktivasi('Kunci tidak cocok dengan perangkat ini.');
  await kvPut('lic', k); await kvPut('srv', null); await kvPut('seen', Date.now()); licKirim('reg'); toast('Aplikasi aktif'); await mulai(); licLatar();
}

/* ===== v21: pemantauan lisensi ke server. Dikirim HANYA: kode perangkat, versi, token pasang, asal alamat, hash kode, penanda kunci sah. Tidak ada data trip/uang. ===== */
const LIC_URL = 'https://eqrubezljxejfnjgqigb.supabase.co/functions/v1/hyper-action';
const LIC_CEK_MS = 36e5, LIC_TOL_DEF = 30, LIC_JAM_TOL = 10 * 6e4;
let licReg = 0;
const vNum = v => String(v || '').replace(/^v/i, '').split('.').map(x => parseInt(x, 10) || 0);
const vLebih = (a, b) => { const x = vNum(a), y = vNum(b); for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d < 0; } return false; };
async function licTok() {
  let t = await kvGet('tok'); try { t = t || localStorage.getItem('bu_tok'); } catch (e) {}
  if (!t) t = [...crypto.getRandomValues(new Uint8Array(12))].map(b => b.toString(16).padStart(2, '0')).join('');
  await kvPut('tok', t); try { localStorage.setItem('bu_tok', t); } catch (e) {} return t;
}
async function licKirim(a) {
  try {
    const id = await devId(), ok = await cekLisensi(), ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 8000);
    const r = await fetch(LIC_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, signal: ctl.signal, body: JSON.stringify({ a, id, v: APP_V, tok: await licTok(), org: location.origin, h: await sha(licOk.toString() + '|' + JSON.stringify(LIC_PUB)), k: ok ? 1 : 0 }) });
    clearTimeout(to); const j = await r.json(); return j && j.ok ? j : null;
  } catch (e) { return null; }
}
async function licJam() {
  const now = Date.now(); let seen = Number(await kvGet('seen')) || 0; try { seen = Math.max(seen, Number(localStorage.getItem('bu_seen')) || 0); } catch (e) {}
  if (now < seen - LIC_JAM_TOL) return false;
  seen = Math.max(seen, now); await kvPut('seen', seen); try { localStorage.setItem('bu_seen', String(seen)); } catch (e) {} return true;
}
function licAlasan(r) { if (r.st === 'DICABUT') return 'dicabut'; if (r.st === 'BELUM' && !r.mig) return 'belum'; if (r.vmin && vLebih(APP_V, r.vmin)) return 'versi'; return ''; }
async function licSimpan(r) { const n = Date.now(), s = { st: r.st, vmin: r.vmin || '', tol: Number(r.tol) || LIC_TOL_DEF, mig: !!r.mig, t: n, c: n, blk: licAlasan(r) }; await kvPut('srv', s); return s; }
async function licBlokir(alasan) {
  const M = { dicabut: ['Lisensi dicabut', 'Lisensi perangkat ini sudah tidak aktif. Hubungi penjual.'], belum: ['Belum terdaftar', 'Perangkat ini belum terdaftar. Hubungi penjual dan kirim kode perangkat Anda.'], versi: ['Perlu pembaruan', 'Versi aplikasi ini sudah terlalu lama. Perbarui aplikasi untuk melanjutkan.'], jam: ['Jam HP tidak sesuai', 'Jam HP lebih mundur dari sebelumnya. Perbaiki tanggal dan jam HP, lalu buka lagi.'], tol: ['Perlu internet', 'Aplikasi perlu terhubung internet untuk memeriksa lisensi. Sambungkan internet lalu coba lagi.'] }[alasan] || ['Tidak dapat dibuka', 'Hubungi penjual.'];
  LOCKED = true; const id = await devId(); $('nav').innerHTML = '';
  $('main').innerHTML = `<div class="card"><h3>🔒 ${M[0]}</h3><div class="msg err">${M[1]}</div><p>Kode perangkat: <b>${id}</b></p><button class="btn" onclick="${alasan === 'versi' ? "navigator.serviceWorker&&navigator.serviceWorker.getRegistration().then(g=>g&&g.update()).finally(()=>location.reload())" : 'location.reload()'}">${alasan === 'versi' ? 'Perbarui sekarang' : 'Coba lagi'}</button><a class="btn alt" href="${CR.wa}" target="_blank" rel="noopener">Hubungi penjual</a></div>`;
}
async function licGerbang() {
  if (!await licJam()) { await licBlokir('jam'); return false; }
  let s = await kvGet('srv');
  if (!s) { s = { st: 'AKTIF', vmin: '', tol: LIC_TOL_DEF, mig: true, t: Date.now(), c: 0, blk: '' }; await kvPut('srv', s); }
  const lewat = Date.now() - s.t > s.tol * 864e5;
  if (s.blk || lewat) {
    const r = await licKirim('chk');
    if (r) { s = await licSimpan(r); if (!s.blk) return true; await licBlokir(s.blk); return false; }
    await licBlokir(s.blk || 'tol'); return false;
  }
  return true;
}
async function licLatar() {
  if (!navigator.onLine) return; const s = await kvGet('srv'); if (s && Date.now() - s.c < LIC_CEK_MS) return;
  const r = await licKirim('chk'); if (!r) return; const n = await licSimpan(r); if (n.blk) licBlokir(n.blk);
}
/* v21.1: tombol manual "Periksa status lisensi sekarang" (jeda 30 detik agar tidak membanjiri server) */
let licManual = 0;
async function cekLisensiSekarang() {
  if (Date.now() - licManual < 30000) return toast('Tunggu sebentar, baru saja diperiksa');
  if (!navigator.onLine) return toast('Tidak ada internet');
  licManual = Date.now(); toast('Memeriksa status lisensi...');
  const r = await licKirim('chk');
  if (!r) return toast('Server tidak terjangkau. Coba lagi nanti.');
  const n = await licSimpan(r);
  if (n.blk) return licBlokir(n.blk);
  toast(n.st === 'AKTIF' || n.st === 'LAMA' ? 'Lisensi aktif ✓' : 'Status lisensi: ' + n.st);
}
