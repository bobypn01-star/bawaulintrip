.msp{position:fixed;inset:0;z-index:60;overflow:hidden;color:#fff;font-family:inherit;clip-path:circle(0% at 50% 80%);transition:clip-path .5s cubic-bezier(.65,0,.35,1);-webkit-tap-highlight-color:transparent;cursor:pointer}
.msp.in{clip-path:circle(150% at 50% 80%)}
.msp.out{opacity:0;transform:scale(1.05);transition:opacity .5s ease,transform .5s ease}
.msp-bg{position:absolute;inset:0}
.t-open .msp-bg{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 26%,#0b0a1f) 0%,color-mix(in srgb,var(--c) 58%,#1a1035) 56%,color-mix(in srgb,var(--c) 45%,#f59e0b) 100%)}
.t-tektok .msp-bg{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 62%,#0b3b66) 0%,var(--c) 46%,color-mix(in srgb,var(--c) 30%,#ffe9a8) 100%)}
.t-bersama .msp-bg{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 52%,#042f1a) 0%,var(--c) 58%,color-mix(in srgb,var(--c) 55%,#fde68a) 100%)}
.msp-sc{position:absolute;inset:0;width:100%;height:100%}
.fb{transform-box:fill-box;transform-origin:50% 100%}
.msp-rays{position:absolute;left:50%;top:40%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.17) 0 6deg,transparent 6deg 20deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 52%);mask:radial-gradient(circle,#000 0,transparent 52%);opacity:0}
.msp.in .msp-rays{opacity:1;transition:opacity .9s .3s;animation:mspSpin 46s linear infinite}
@keyframes mspSpin{to{transform:rotate(360deg)}}
.msp-c{position:absolute;left:0;right:0;bottom:calc(5% + env(safe-area-inset-bottom));text-align:center;opacity:0;transform:translateY(18px);text-shadow:0 2px 14px rgba(0,0,0,.45)}
.msp.in .msp-c{animation:mspUp .6s .55s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes mspUp{to{opacity:1;transform:none}}
.msp-ic{width:68px;height:68px;margin:0 auto 12px;border-radius:22px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.42);display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.msp-ic svg{width:40px;height:40px}
.msp-ic{display:none}
.msp-c small.k{display:block;font-size:12px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;opacity:.85}
.msp-c b{display:block;margin-top:4px;font-size:30px;font-weight:800;letter-spacing:-.02em}
.msp-c small.g{display:block;margin-top:6px;font-size:13.5px;opacity:.9}
.msp.in.t-open .msp-ic svg{animation:icBreath 1.8s 1.1s ease-in-out infinite}
.msp.in.t-tektok .msp-ic svg{animation:icWalk .36s 1s ease-in-out infinite alternate}
.msp.in.t-bersama .msp-ic svg{animation:icHop .8s 1.1s ease-in-out infinite}
@keyframes icBreath{50%{transform:scale(1.14)}}
@keyframes icWalk{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-3px) rotate(4deg)}}
@keyframes icHop{50%{transform:translateY(-6px)}}
@keyframes mspFade{from{opacity:0}to{opacity:1}}
@keyframes mspPop{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
/* --- Open trip: senja di perkemahan --- */
.msp.in .st{animation:twk 1.8s ease-in-out infinite alternate}
@keyframes twk{from{opacity:.15}to{opacity:1}}
.msp.in .moon{animation:moonUp 1.5s .15s ease-out both}
@keyframes moonUp{from{transform:translateY(60px);opacity:0}}
.msp.in .mtn-a{animation:riseA .9s .1s ease-out both}
.msp.in .mtn-b{animation:riseA .9s .25s ease-out both}
@keyframes riseA{from{transform:translateY(140px)}}
.msp.in .tent{animation:mspPop .85s .45s cubic-bezier(.3,1.55,.5,1) both}
.msp.in .door{animation:doorGlow 1.3s 1.2s ease-in-out infinite alternate}
@keyframes doorGlow{from{opacity:.7}to{opacity:1}}
.msp.in .pen{animation:flagW .5s ease-in-out infinite alternate}
@keyframes flagW{from{transform:scaleX(1)}to{transform:scaleX(.7)}}
.pen{transform-box:fill-box;transform-origin:0 50%}
.fire{opacity:0}
.msp.in .fire{animation:mspFade .5s 1s both}
.msp.in .fl{animation:flick .45s ease-in-out infinite alternate}
.msp.in .fl.f2{animation-delay:.15s}
@keyframes flick{from{transform:scale(1,.86) skewX(-4deg)}to{transform:scale(.92,1.12) skewX(4deg)}}
.msp.in .fglow{animation:fglow 1.1s ease-in-out infinite alternate}
@keyframes fglow{from{opacity:.45}to{opacity:.95}}
.msp.in .sp{animation:spark 1.5s ease-out infinite}
@keyframes spark{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),-80px);opacity:0}}
/* --- Tektok: fajar dan jalan setapak --- */
.msp.in .sun{animation:sunUp 1.5s .15s cubic-bezier(.2,.8,.2,1) both}
@keyframes sunUp{from{transform:translateY(220px);opacity:0}}
.msp.in .cl{animation:cloud linear infinite}
@keyframes cloud{from{transform:translateX(480px)}to{transform:translateX(-360px)}}
.msp.in .far{animation:scr 8s linear infinite}
.msp.in .near{animation:scr 3.4s linear infinite}
@keyframes scr{to{transform:translateX(-390px)}}
.msp.in .trail{animation:dash .42s linear infinite}
@keyframes dash{to{stroke-dashoffset:-44}}
.hk{opacity:0}
.msp.in .hk{animation:hkIn .9s .35s cubic-bezier(.2,.9,.3,1) both}
@keyframes hkIn{from{transform:translateX(-320px);opacity:0}to{transform:none;opacity:1}}
.msp.in .hb{animation:hkBob .36s ease-in-out infinite alternate}
@keyframes hkBob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.msp.in .lg{animation:legSw .36s ease-in-out infinite alternate}
.msp.in .lg.l2{animation-direction:alternate-reverse}
@keyframes legSw{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
.msp.in .pole{animation:poleSw .36s ease-in-out infinite alternate-reverse}
@keyframes poleSw{from{transform:rotate(-16deg)}to{transform:rotate(22deg)}}
.msp.in .sl{animation:slin .55s linear infinite}
@keyframes slin{from{transform:translateX(40px);opacity:0}35%{opacity:.55}to{transform:translateX(-60px);opacity:0}}
/* --- Pendakian bersama: puncak bersama-sama --- */
.msp.in .pi{animation:mspPop .55s var(--d) cubic-bezier(.3,1.6,.5,1) both,hop .85s calc(var(--d) + .7s) ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.msp.in .arm{animation:wave .45s ease-in-out infinite alternate}
.msp.in .arm.r{animation-direction:alternate-reverse}
@keyframes wave{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.msp.in .flag{animation:flagUp .8s .5s cubic-bezier(.3,1.4,.5,1) both}
@keyframes flagUp{from{transform:translateY(60px) scale(.2);opacity:0}to{transform:none;opacity:1}}
.cloth{transform-box:fill-box;transform-origin:0 50%}
.msp.in .cloth{animation:wv .55s ease-in-out infinite alternate}
@keyframes wv{from{transform:scaleX(1) skewY(-5deg)}to{transform:scaleX(.8) skewY(5deg)}}
.bond{stroke-dasharray:520;stroke-dashoffset:520}
.msp.in .bond{animation:draw 1.1s 1.1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.cf{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.msp.in .cf{animation:fall var(--t) var(--d) linear infinite}
@keyframes fall{0%{transform:translate(0,-40px) rotate(0);opacity:0}8%{opacity:1}100%{transform:translate(var(--s),920px) rotate(560deg);opacity:1}}
#main.ent>*{animation:entUp .5s cubic-bezier(.2,.8,.2,1) both}
#main.ent>*:nth-child(2){animation-delay:.06s}#main.ent>*:nth-child(3){animation-delay:.12s}#main.ent>*:nth-child(4){animation-delay:.18s}#main.ent>*:nth-child(5){animation-delay:.24s}#main.ent>*:nth-child(n+6){animation-delay:.3s}
@keyframes entUp{from{opacity:0;transform:translateY(16px)}}
.v3:not(.same) .pg>*:not(.deco){animation:v3in .5s cubic-bezier(.2,.8,.2,1) both}
.v3:not(.same) .pg>*:nth-child(3){animation-delay:.05s}.v3:not(.same) .pg>*:nth-child(4){animation-delay:.1s}.v3:not(.same) .pg>*:nth-child(5){animation-delay:.15s}.v3:not(.same) .pg>*:nth-child(6){animation-delay:.2s}.v3:not(.same) .pg>*:nth-child(n+7){animation-delay:.25s}
@keyframes v3in{from{opacity:0;transform:translateY(18px)}}
.v3 .mc3{transition:transform .15s ease}.v3 .mc3:active{transform:scale(.985)}
header .hm.pop{animation:hmPop .55s cubic-bezier(.2,.8,.2,1)}
@keyframes hmPop{0%{transform:scale(.8);opacity:.4}60%{transform:scale(1.08)}100%{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.msp,.msp *,.msp-rays,#main.ent>*,.v3 .pg>*,.pkm:before,header .hm.pop{animation:none!important;transition:none!important}}

<body>
<header><button type="button" id="hlogob" class="hl" aria-label="Halaman awal" onclick="v3Buka('awal')"><span class="lc"><img id="hlogo" src="logo-cash.png" alt="Logo bawaulin.cash"></span></button><div class="ht"><h1>Budgeting Pendakian</h1><button type="button" id="hmode" class="hm" hidden onclick="v3Buka('mode','chip')"></button></div><div id="net"><button type="button" id="hbdg" class="hb" hidden onclick="lencanaInfo()"></button><button type="button" id="hdot" class="dt" onclick="netToast()" aria-label="Online"></button></div></header>
<nav id="nav"></nav>
<div id="v3" class="v3" hidden></div>
<main id="main">Memuat...</main>
<script>
/* ===== Struktur data (sama dengan sheet di Spreadsheet lama) ===== */
const CFG = {
  tamu: { label: 'Tamu', fields: [
    { h: 'Nama', type: 'text', req: 1 }, { h: 'Meeting Point', type: 'text' }, { h: 'Ponsel', type: 'tel' }, { h: 'Peran', type: 'select', options: ['Ketua', 'Bendahara', 'Anggota', 'Lainnya'], om: 4 },
    { h: 'Status', type: 'select', options: ['Diterima', 'Menunggu respons', 'Ditolak'], xo: ['Daftar tunggu', 'Batal'] }, { h: 'Sesi', type: 'select', options: [], xs: 1, om: 3 },
    { h: 'Tagihan', type: 'select', options: ['Lunas', 'DP', 'Belum Lunas'] }, { h: 'Grup', type: 'text', om: 2 }, { h: 'Catatan', type: 'textarea' }] },
  pemasukan: { label: 'Pemasukan', fields: [
    { h: 'Detail pemasukan', type: 'text', req: 1 }, { h: 'Kategori', type: 'select', options: ['Peserta', 'Panitia', 'Sponsor'] },
    { h: 'Biaya', type: 'number', rp: 1 }, { h: 'Tanggal transaksi', type: 'date' }, { h: 'Dibayar oleh', type: 'text' }, { h: 'Catatan', type: 'textarea' }] },
  pengeluaran: { label: 'Pengeluaran', fields: [
    { h: 'Detail pengeluaran', type: 'text', req: 1 },
    { h: 'Kategori', type: 'select', options: ['Transportasi', 'Konsumsi', 'Peralatan', 'Darurat', 'Simaksi', 'Ojeg BC', 'P3K', 'Lainnya'] },
    { h: 'Anggaran', type: 'number', rp: 1 }, { h: 'Biaya', type: 'number', rp: 1 }, { h: 'Quantity', type: 'number', def: 1 },
    { h: 'Total Anggaran', ro: 1, rp: 1, f: r => (+r['Anggaran'] || 0) * (+r['Quantity'] || 0) },
    { h: 'Total Biaya', ro: 1, rp: 1, f: r => (+r['Biaya'] || 0) * (+r['Quantity'] || 0) },
    { h: 'Tanggal transaksi', type: 'date' }, { h: 'Dibayar oleh', type: 'text' }, { h: 'Catatan', type: 'textarea' }] },
  itinerary: { label: 'Itinerary', fields: [
    { h: 'Aktivitas', type: 'text', req: 1 },
    { h: 'Jenis aktivitas', type: 'select', options: ['Mepo - BC', 'BC - POS 1', 'POS 1 - POS 2', 'POS 2 - POS 3', 'POS 3 - POS 4', 'POS 4 - POS 5', 'POS 5 - POS 6', 'ISHOMA', 'CAMP GROUND', 'CAMP - BC', 'BC - MEPO', 'SUMMIT'], xt: ['Kumpul & briefing', 'Pendakian naik', 'Puncak & istirahat', 'Turun ke basecamp', 'Bubar'] },
    { h: 'Waktu mulai', type: 'datetime-local' }, { h: 'Waktu berakhir', type: 'datetime-local' }, { h: 'Lokasi', type: 'text' }, { h: 'Catatan', type: 'textarea' }] },
  perlengkapan: { label: 'Perlengkapan', fields: [
    { h: 'Perlengkapan', type: 'text', req: 1 }, { h: 'Jenis', type: 'select', options: ['Kelompok', 'Pribadi'], om: 5 }, { h: 'Kebutuhan', type: 'number' }, { h: 'Kesediaan', type: 'number' },
    { h: 'Sewa', ro: 1, f: r => r['Jenis'] === 'Pribadi' ? 0 : Math.max(0, (+r['Kebutuhan'] || 0) - (+r['Kesediaan'] || 0)) },
    { h: 'Harga/Unit', type: 'number', rp: 1 },
    { h: 'Total Sewa', ro: 1, rp: 1, f: r => r['Jenis'] === 'Pribadi' ? 0 : Math.max(0, (+r['Kebutuhan'] || 0) - (+r['Kesediaan'] || 0)) * (+r['Harga/Unit'] || 0) },
    { h: 'Pembawa', type: 'select', options: [], xa: 1, om: 4, bsx: 1 }, { h: 'Berat (kg)', type: 'number', om: 4, bsx: 1 }] },
  tiket: { label: 'Tiket & Parkir', fields: [
    { h: 'Komponen', type: 'select', req: 1, options: ['Tiket masuk', 'Simaksi', 'Asuransi', 'Registrasi / retribusi', 'Parkir motor', 'Parkir mobil', 'Parkir bus', 'Lainnya'] },
    { h: 'Tarif', type: 'number', rp: 1 }, { h: 'Satuan', type: 'select', options: ['Per orang', 'Per kendaraan', 'Per rombongan'] }, { h: 'Jumlah', type: 'number' },
    { h: 'Unit', ro: 1, f: r => tkUnit(r) }, { h: 'Total', ro: 1, rp: 1, f: r => (+r['Tarif'] || 0) * tkUnit(r) }, { h: 'Catatan', type: 'textarea' }] },
  kru: { label: 'Kru Panitia', fields: [
    { h: 'Nama', type: 'text', req: 1 }, { h: 'Peran', type: 'select', options: ['Leader', 'Guide', 'Porter', 'Sweeper', 'Chef', 'Dokumentasi', 'Medis', 'Lainnya'] },
    { h: 'Upah', type: 'number', rp: 1 }, { h: 'Catatan', type: 'textarea' }] },
  tugas: { label: 'Tugas', fields: [
    { h: 'Tugas', type: 'text', req: 1 }, { h: 'Penanggung jawab', type: 'select', options: [], xa: 1 },
    { h: 'Catatan', type: 'textarea' }, { h: 'Selesai', type: 'select', options: ['Belum', 'Sudah'] }] },
  logistik: { label: 'Logistik makan', fields: [
    { h: 'Menu', type: 'text', req: 1 }, { h: 'Hari', type: 'select', options: ['Hari 1', 'Hari 2', 'Hari 3', 'Hari 4', 'Hari 5', 'Hari 6', 'Hari 7'] },
    { h: 'Waktu makan', type: 'select', options: ['Sarapan', 'Makan siang', 'Makan malam', 'Camilan'] },
    { h: 'Porsi', type: 'number', get def() { try { return anggotaNama().length || ''; } catch (e) { return ''; } } },
    { h: 'Bahan', type: 'textarea' }, { h: 'Perkiraan biaya', type: 'number', rp: 1 },
    { h: 'Pembeli', type: 'select', options: [], xa: 1 }, { h: 'Pemasak', type: 'select', options: [], xa: 1 },
    { h: 'Sudah dibeli', type: 'select', options: ['Belum', 'Sudah'] }] }
};
Object.defineProperty(CFG.tamu, 'label', { get() { try { return isBS() ? 'Anggota' : 'Tamu'; } catch (e) { return 'Tamu'; } }, configurable: true });
const KEYS = Object.keys(CFG);

/* ===== Penyimpanan lokal (IndexedDB) ===== */
let DB, cur = 'dashboard', editId = null;
const blank = () => ({ set: { destinasi: '', realisasi: 0 }, tamu: [], pemasukan: [], pengeluaran: [], itinerary: [], perlengkapan: [], kru: [], tugas: [], logistik: [], tiket: [], checklist: [], arsip: [], sim: [], simAktif: null, pin: null, ganti: {}, kat: {}, ulang: [], seen: {}, trash: [], log: [], pribadi: [], lastBackup: 0, seq: 1, pref: {}, profil: {}, kw: {}, nomor: {}, slot: {} });
function idb() { return new Promise((ok, no) => { const r = indexedDB.open('budgeting', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); }
async function load() { const d = await idb(); return new Promise(ok => { const q = d.transaction('kv').objectStore('kv').get('db'); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); }
async function save() { const d = await idb(); return new Promise(ok => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(DB, 'db'); t.oncomplete = ok; t.onerror = ok; }); }

/* ===== Helper ===== */
const $ = id => document.getElementById(id);
const rp = n => 'Rp ' + Math.round(Number(n) || 0).toLocaleString('id-ID');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = v => { const m = String(v || '').match(/^(\d{4})-(\d\d)-(\d\d)(?:T(\d\d:\d\d))?/); return m ? m[3] + '/' + m[2] + '/' + m[1] + (m[4] ? ' ' + m[4] : '') : (v || ''); };
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
function badge(v) {
  const s = String(v).toLowerCase(), c = ['lunas', 'diterima'].includes(s) ? 'g' : ['dp', 'menunggu respons'].includes(s) ? 'y' : ['belum lunas', 'ditolak'].includes(s) ? 'r' : '';
  return c ? `<span class="badge ${c}">${esc(v)}</span>` : esc(v);
}
function calc(key, r) { const o = Object.assign({}, r); CFG[key].fields.forEach(f => { if (f.ro) o[f.h] = f.f(o); }); return o; }
const rowsOf = key => DB[key].map(r => calc(key, r));
const sum = (a, f) => a.reduce((s, x) => s + (+f(x) || 0), 0);
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type || 'application/json' })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
/* v1.0.1: rapikan nomor HP (angka 0 di depan sering hilang dari Google Sheet) */
function normHP(v) { const s = String(v == null ? '' : v).trim(); if (!s || !/^[+\d\s().-]+$/.test(s)) return s; const d = s.replace(/\D/g, ''); if (/^62\d{8,13}$/.test(d)) return '0' + d.slice(2); if (/^8\d{8,11}$/.test(d)) return '0' + d; return s; }
function waDigits(v) { let d = normHP(v).replace(/\D/g, ''); if (d.indexOf('0') === 0) d = '62' + d.slice(1); return d; }
function openWA(t, no) { const a = document.createElement('a'); a.href = 'https://wa.me/' + (no || '') + '?text=' + encodeURIComponent(t); a.target = '_blank'; document.body.appendChild(a); a.click(); a.remove(); }
function setMsg(id, text, ok) { const e = $(id); if (e) { e.textContent = text; e.className = 'msg ' + (ok ? 'ok' : 'err'); } }

/* ===== Hitungan dashboard ===== */
function dash() {
  const masuk = sum(DB.pemasukan, r => r['Biaya']), pr = rowsOf('pengeluaran');
  const anggaran = sum(pr, r => r['Total Anggaran']), keluar = sum(pr, r => r['Total Biaya']), real = +DB.set.realisasi || 0;
  const persen = real ? keluar / real : 0, kat = {};
  pr.forEach(r => { const k = String(r['Kategori'] || '').trim() || '(Tanpa kategori)'; const o = kat[k] || (kat[k] = { k, anggaran: 0, biaya: 0 }); o.anggaran += r['Total Anggaran']; o.biaya += r['Total Biaya']; });
  const kategori = Object.values(kat), warnings = [];
  kategori.forEach(x => { if (x.biaya > x.anggaran) warnings.push({ level: 'red', text: x.k + ' lewat ' + rp(x.biaya - x.anggaran) + ' dari anggaran' }); });
  if (real > 0) {
    if (persen > 1) warnings.push({ level: 'red', text: 'Total pengeluaran melebihi Total Realisasi sebesar ' + rp(keluar - real) });
    else if (persen >= 0.8) warnings.push({ level: 'yellow', text: 'Pemakaian sudah ' + (persen * 100).toFixed(0) + '% dari Total Realisasi' });
  }
  return { destinasi: DB.set.destinasi, real, anggaran, masuk, keluar, saldo: masuk - keluar, persen, kategori, warnings };
}
const hbar = (l, v, mx, c, t) => `<div class="hrow"><div>${esc(l)}</div><div class="htrack"><div style="width:${mx > 0 ? Math.min(100, v / mx * 100) : 0}%;background:${c}"></div></div><div class="hv">${t}</div></div>`;
const stat = (l, v) => `<div class="stat"><small>${esc(l)}</small><b>${esc(v)}</b></div>`;

/* ===== Navigasi ===== */
const TABS = [['dashboard', 'Dashboard']].concat(KEYS.map(k => [k, CFG[k].label])).concat([['checklist', 'Checklist'], ['simulasi', 'Simulasi'], ['bayar', 'Pembayaran'], ['rekap', 'Rekap'], ['trip', 'Trip & Arsip'], ['bagihasil', 'Bagi Hasil'], ['selesai', 'Penyelesaian'], ['kategori', 'Kategori'], ['daftar', 'Pendaftaran'], ['akun', 'Akun'], ['pengaturan', 'Pengaturan'], ['kalk', 'Kalkulator'], ['panduan', 'Panduan']]);
function show(k) {
  cur = k; editId = null;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.k === (MAIN.includes(k) ? k : k === 'pengaturan' ? 'akun' : 'more')));
  if (k === 'dashboard') renderDash(); else if (k === 'more') renderMore(); else if (k === 'checklist') renderCl(); else if (k === 'trip') renderTrip(); else if (k === 'simulasi') renderSim(); else if (k === 'bayar') renderBayar(); else if (k === 'rekap') renderRekap(); else if (k === 'bagihasil') renderBagiHasil(); else if (k === 'selesai') renderSelesai(); else if (k === 'kategori') renderKat(); else if (k === 'daftar') renderDaftar(); else if (k === 'akun') renderAkun(); else if (k === 'pengaturan') renderPeng(); else if (k === 'kalk') renderKalk(); else if (k === 'panduan') { if (!PD.keep) PD.ch = -1; PD.keep = false; renderPanduan(); } else renderSheet(k);
  if (k !== 'dashboard' && k !== 'more') { const lb = k === 'tamu' ? CFG.tamu.label : (TABS.find(t => t[0] === k) || ['', ''])[1]; $('main').insertAdjacentHTML('afterbegin', `<div class="pgh">${MAIN.includes(k) ? '' : k === 'pengaturan' ? '<button class="back" onclick="show(\'akun\')">‹ Akun</button>' : '<button class="back" onclick="show(\'more\')">‹ Menu</button>'}<h2>${otHi(k)}${lb}</h2>${k === 'akun' ? `<button class="pgear" onclick="show(\'pengaturan\')" aria-label="Buka Pengaturan">${SVG_GEAR}</button>` : ''}</div>`); }
  if (tutupOn() && ['dashboard', 'pemasukan', 'pengeluaran', 'bayar', 'bagihasil', 'selesai'].indexOf(k) >= 0) { const h = $('main').querySelector('.pgh'); if (h) h.insertAdjacentHTML('afterend', tutupBanner()); else $('main').insertAdjacentHTML('afterbegin', tutupBanner()); }
  if (CR_OK === false) $('main').insertAdjacentHTML('afterbegin', '<div class="warn red">Identitas pembuat aplikasi berubah. Fitur PDF dikunci. Pasang ulang aplikasi asli.</div>');
  chipMode();
  window.scrollTo(0, 0);
}

/* ===== Dashboard ===== */
function renderDash() {
  const d = dash();
  $('main').innerHTML = `
  <div class="hero"><small>${esc(d.destinasi || 'Belum ada destinasi')}</small><div class="big">${rp(d.saldo)}</div><small>Sisa saldo</small>
    <div class="chips" style="margin-top:12px"><div class="chip"><small>Pemasukan</small><b>${rp(d.masuk)}</b></div><div class="chip"><small>Pengeluaran</small><b>${rp(d.keluar)}</b></div></div></div>
  ${pgBand()}<button class="btn" style="margin:0 0 14px" onclick="catatCepat()">＋ Catat transaksi</button>
  ${isBS() ? kasBSCard() : ''}
  <div class="card ringw"><svg width="96" height="96" viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" fill="none" style="stroke:var(--card2)" stroke-width="9"/><circle cx="40" cy="40" r="34" fill="none" style="stroke:${d.persen > 1 ? '#ef4444' : 'var(--pri)'}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${Math.min(1, d.persen) * 213.6} 213.6" transform="rotate(-90 40 40)"/><text x="40" y="45" text-anchor="middle" style="fill:var(--tx)" font-size="15" font-weight="800">${(d.persen * 100).toFixed(0)}%</text></svg>
    <div><b>Pemakaian anggaran</b><br><small class="mut">Realisasi</small> ${rp(d.real)}<br><small class="mut">Anggaran</small> ${rp(d.anggaran)}</div></div>
  ${pengingatCard()}
  <div class="card"><h3>Peringatan Anggaran</h3>${d.warnings.length ? d.warnings.map(w => `<div class="warn ${w.level}">${w.level === 'red' ? '⚠️' : '🔔'} ${esc(w.text)}</div>`).join('') : '<div class="warn green">✅ Semua kategori masih sesuai anggaran.</div>'}</div>
  <div class="card"><h3>Pemasukan vs Pengeluaran</h3>${(() => { const mx = Math.max(d.masuk, d.keluar, 1); return hbar('Pemasukan', d.masuk, mx, '#16a34a', rp(d.masuk)) + hbar('Pengeluaran', d.keluar, mx, d.keluar > d.masuk ? '#dc2626' : '#f59e0b', rp(d.keluar)); })()}</div>
  <div class="card"><h3>Pengeluaran per Kategori</h3><small class="mut">Abu-abu = anggaran, hijau/merah = biaya</small>
    ${d.kategori.length ? (() => { const mx = Math.max(1, ...d.kategori.map(x => Math.max(x.anggaran, x.biaya))); return d.kategori.map(x => `<div style="margin-top:10px"><b>${esc(x.k)}</b>${hbar('Anggaran', x.anggaran, mx, '#9ca3af', rp(x.anggaran))}${hbar('Biaya', x.biaya, mx, x.biaya > x.anggaran ? '#dc2626' : '#16a34a', rp(x.biaya))}</div>`).join(''); })() : '<div>Belum ada data pengeluaran.</div>'}</div>
  <div class="card"><h3>Data Trip</h3>
    <label>Destinasi</label><input id="sDest" value="${esc(d.destinasi)}">
    <label>Kode destinasi untuk nomor kwitansi</label><input id="sKode" maxlength="6" value="${esc(DB.set.kodeDest || '')}" placeholder="${esc(kodeD())}" style="text-transform:uppercase">
    <label>Total Realisasi (Rp)</label><input id="sReal" type="number" inputmode="decimal" value="${d.real}">
    <button class="btn" onclick="saveSet()">Simpan Data Trip</button><div id="sMsg" class="msg"></div></div>`;
}
async function saveSet() { DB.set.destinasi = $('sDest').value.trim(); DB.set.kodeDest = $('sKode').value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6); DB.set.realisasi = Number($('sReal').value) || 0; await save(); renderDash(); setMsg('sMsg', 'Data trip disimpan.', 1); }

/* ===== Tab data (Tamu, Pemasukan, Pengeluaran, Itinerary, Perlengkapan) ===== */
function renderSheet(key) {
  const c = CFG[key];
  const inputs = c.fields.map((f, i) => {
    if (f.ro || !omOK(f)) return '';

function polaPad(id, done) {

    seq.push(i);

  svg.addEventListener('pointermove', e => { if (!on) return; xy(e); add(hit()); draw(); });

async function licMulai() {

}
async function licGerbang() {

  let s = await kvGet('srv');

  const lewat = Date.now() - s.t > s.tol * 864e5, cabutHabis = !!(s.cb && s.cbe && Date.now() + (Number(s.off) || 0) > s.cbe);

    const r = await licKirim('chk');
    if (r) { s = await licSimpan(r); if (!s.blk) return true; await licBlokir(s.blk); return false; }
    await licBlokir(s.blk || (cabutHabis ? 'dicabut' : 'tol')); return false;
  }
  return true;
}
