PAN.forEach(c => { const e = EN[c.t]; if (e) { EN[c.ic + ' ' + c.t] = c.ic + ' ' + e; EN['‹ ' + c.t] = '‹ ' + e; EN[c.t + ' ›'] = e + ' ›'; } });

const PD = { ch: -1, f: 0, timer: null, play: true };
function renderPanduan() {
  clearInterval(PD.timer);
  if (PD.ch < 0) {
    $('main').innerHTML = `<div class="card"><h3>Panduan lengkap</h3><small class="mut">Pilih topik. Setiap topik punya demo bergerak, langkah rinci, dan tips. Semua jalan tanpa internet.</small></div>
    <div class="pdl">${PAN.map((c, i) => `<button class="pdc" onclick="pdBuka(${i})"><span class="pdi">${c.ic}</span><span class="pdt"><b>${esc(c.t)}</b><small>${esc(c.s)}</small></span><span class="zch">›</span></button>`).join('')}</div>`;
    return;
  }
  const c = PAN[PD.ch], n = c.demo ? c.demo.length : 0;
  $('main').innerHTML = `<button class="back" onclick="pdBuka(-1)">‹ Semua topik</button>
  <div class="card"><h3>${c.ic} ${esc(c.t)}</h3><small class="mut">${esc(c.s)}</small>
  ${n ? `<div class="pd-phone" id="pdph" onclick="pdNext()"><div class="pd-scr">${c.demo.map((f, i) => `<div class="pd-f${i === 0 ? ' on' : ''}">${f.ui}</div>`).join('')}</div><div class="pd-tap" id="pdtap"></div></div>
  <div class="pd-cap" id="pdcap"></div><div class="pd-dots" id="pdd">${c.demo.map((f, i) => `<button onclick="pdShow(${i})" aria-label="Langkah ${i + 1}"></button>`).join('')}</div>
  <div class="kchips" style="justify-content:center"><button class="kchip" onclick="pdPrev()">⏮</button><button class="kchip" id="pdpl" onclick="pdToggle()">⏸ Jeda</button><button class="kchip" onclick="pdNext()">⏭</button></div>` : ''}</div>
  <div class="card"><h3>Langkah rinci</h3>${c.st.map((x, i) => `<div class="pds"><span>${i + 1}</span><div>${esc(x)}</div></div>`).join('')}</div>
  ${c.tp.length ? `<div class="card"><h3>💡 Tips</h3>${c.tp.map(x => `<div class="warn note">${esc(x)}</div>`).join('')}</div>` : ''}
  ${c.go ? `<button class="btn" onclick="show('${c.go}')">Coba sekarang ›</button>` : ''}
  <div class="flt" style="margin-top:6px">${PD.ch > 0 ? `<button class="btn alt" onclick="pdBuka(${PD.ch - 1})">‹ ${esc(PAN[PD.ch - 1].t)}</button>` : ''}${PD.ch < PAN.length - 1 ? `<button class="btn alt" onclick="pdBuka(${PD.ch + 1})">${esc(PAN[PD.ch + 1].t)} ›</button>` : ''}</div>`;
  if (n) { PD.play = true; setTimeout(() => { pdShow(0); PD.timer = setInterval(() => { if (cur !== 'panduan' || !$('pdtap')) { clearInterval(PD.timer); return; } if (PD.play) pdShow((PD.f + 1) % PAN[PD.ch].demo.length); }, 3600); }, 60); }
}
function pdBuka(i) { PD.ch = i; PD.f = 0; PD.keep = true; show('panduan'); }
function pdShow(i) {
  const c = PAN[PD.ch]; if (!c || !c.demo || !$('pdph')) return; PD.f = i;
  const fr = document.querySelectorAll('.pd-f'); fr.forEach((e, j) => e.classList.toggle('on', j === i));
  document.querySelectorAll('#pdd button').forEach((e, j) => e.classList.toggle('on', j === i));
  $('pdcap').innerHTML = `<b>${i + 1}/${c.demo.length}</b> ${esc(c.demo[i].c)}`;
  const ph = $('pdph'), t = $('pdtap'), tg = fr[i].querySelector('.tp');
  t.classList.remove('hit');
  if (tg) { const a = ph.getBoundingClientRect(), b = tg.getBoundingClientRect(); t.style.display = 'block'; t.style.left = (b.left - a.left + Math.min(b.width * .6, 90)) + 'px'; t.style.top = (b.top - a.top + b.height * .55) + 'px'; setTimeout(() => t.classList.add('hit'), 650); } else t.style.display = 'none';
}
const pdNext = () => { const n = PAN[PD.ch].demo.length; pdShow((PD.f + 1) % n); };
const pdPrev = () => { const n = PAN[PD.ch].demo.length; pdShow((PD.f + n - 1) % n); };
function pdToggle() { PD.play = !PD.play; $('pdpl').textContent = PD.play ? '⏸ Jeda' : '▶ Putar'; }

/* ===== Mulai ===== */
async function mulai() {
  DB = Object.assign(blank(), await load() || {}); DB.pref = DB.pref || {}; DB.profil = DB.profil || {}; DB.kw = DB.kw || {}; DB.nomor = DB.nomor || {}; applyKat(); DB.trash = (DB.trash || []).filter(x => Date.now() - x.ts < 30 * 864e5); if (jalankanUlang()) { await save(); setTimeout(() => toast('Transaksi berulang ditambahkan'), 700); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  if (DB.pref.bahasa && DB.pref.bahasa !== LANG) setBahasa(DB.pref.bahasa); applyAll(); cekPembuat().then(ok => { CR_OK = ok; if (!ok && !LOCKED) rerender(); });
  BIO_OK = await bioTersedia();
  if (DB.pin) lock(); else { buildNav(); show('dashboard'); }
}
(async function () {
  if (await cekLisensi()) {
    if (await licGerbang()) { await mulai(); licLatar(); APP_SIAP = true; setTimeout(onbCek, 1200); setTimeout(updAuto, 4000); document.addEventListener('visibilitychange', async () => { if (document.hidden || LOCKED) return; if (await licJam()) licLatar(); else licBlokir('jam'); }); }
  } else { const lama = await kvGet('lic'); await layarAktivasi(lama ? 'Kunci lama tidak berlaku. Minta kunci baru ke penjual dengan kode perangkat ini.' : ''); }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
