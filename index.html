<style>:root{--bg:#0b0b0d;--card:rgba(23,23,27,.86);--card2:rgba(255,255,255,.08);--tx:#fff7ed;--mut:#e0cfb0;--bd:rgba(251,191,36,.18);--h:#fbbf24;--pri:#f97316;--pri2:#fbbf24;--grn:#22c55e;--red:#ef4444;color-scheme:dark}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px 14px;text-align:left;color:var(--tx);font-size:16px;font-weight:700}
.tile span{display:block;font-size:28px;margin-bottom:8px}.tile small{display:block;color:var(--mut);font-weight:400;font-size:12px;margin-top:2px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:20px;z-index:60;font-weight:600;display:none}
.cl{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.cl .t{flex:1}.cl .t b{display:block}.cl .t small{color:var(--mut)}.cl.done .t b{text-decoration:line-through;color:var(--mut)}
.rdday{background:linear-gradient(90deg,#166534,#22c55e);color:#fff;padding:7px 12px;border-radius:10px;margin:12px 0 6px;font-weight:700}
.rdi{display:flex;gap:10px;padding:8px 0 8px 12px;border-left:3px solid #f97316;margin-left:8px;position:relative}.rdi:before{content:'';position:absolute;left:-8px;top:12px;width:11px;height:11px;border-radius:50%;background:#fbbf24;border:2px solid #f97316}
.rdt{min-width:78px;font-weight:700;color:var(--pri2)}.rdx b{display:block}.rdx small{color:var(--mut)}
.cgh{display:flex;justify-content:space-between;background:var(--card2);padding:8px 12px;border-radius:10px;margin-top:10px;font-weight:700}
@media print{html,html[data-t=light]{--bg:#fff;--card:#fff;--card2:#f3f4f6;--tx:#111;--mut:#555;--bd:#ddd;--h:#166534}}

.dsub{font-size:13px;font-weight:700;margin:10px 0}.db h2{font-size:13px;color:#fff;background:#166534;padding:5px 8px;margin:14px 0 6px;border-left:5px solid #f97316}
#pdoc table{width:100%;border-collapse:collapse;margin-bottom:6px}#pdoc th{background:#fef3c7;border:1px solid #bbb;padding:4px;text-align:left}#pdoc td{border:1px solid #ccc;padding:4px;white-space:normal}#pdoc tr.tot td{font-weight:800;background:#f0fdf4}
.sum{display:flex;flex-wrap:wrap;gap:6px}.sum div{flex:1 1 30%;border:1px solid #bbb;border-radius:6px;padding:6px}.sum b{display:block;font-size:14px}

:root{--tx:#f7f1e8;--mut:#b8ada0;--hd:#fbbf24;--card:rgba(24,22,20,.8);--card2:rgba(255,255,255,.07);--bd:rgba(255,255,255,.1);--solid:#1a1816}
html[data-t=light]{--tx:#1c1917;--mut:#6b625a;--hd:#c2410c;--card:rgba(255,255,255,.84);--card2:rgba(0,0,0,.05);--bd:rgba(0,0,0,.1);--solid:#fff}

<body>
<header><img src="logo.png" alt="Bawaulin Trip"><div class="ht"><h1>Budgeting Pendakian</h1><small>bawaulin.trip</small></div><button id="tg" onclick="toggleTheme()"></button></header>
<nav id="nav"></nav>
<main id="main">Memuat...</main>
<script>
/* ===== Struktur data (sama dengan sheet di Spreadsheet lama) ===== */
const CFG = {
  tamu: { label: 'Tamu', fields: [
    { h: 'Nama', type: 'text', req: 1 }, { h: 'Meeting Point', type: 'text' }, { h: 'Ponsel', type: 'tel' },
    { h: 'Status', type: 'select', options: ['Diterima', 'Menunggu respons', 'Ditolak'] },
    { h: 'Tagihan', type: 'select', options: ['Lunas', 'DP', 'Belum Lunas'] }, { h: 'Catatan', type: 'textarea' }] },
  pemasukan: { label: 'Pemasukan', fields: [
    { h: 'Detail pemasukan', type: 'text', req: 1 }, { h: 'Kategori', type: 'select', options: ['Peserta', 'Panitia', 'Sponsor'] },
    { h: 'Biaya', type: 'number', rp: 1 }, { h: 'Tanggal transaksi', type: 'date' }, { h: 'Dibayar oleh', type: 'text' }, { h: 'Catatan', type: 'textarea' }] },
  pengeluaran: { label: 'Pengeluaran', fields: [
    { h: 'Detail pengeluaran', type: 'text', req: 1 },
    { h: 'Kategori', type: 'select', options: ['Transportasi', 'Konsumsi', 'Peralatan', 'Darurat', 'Simaksi', 'Ojeg BC', 'P3K', 'Lainnya'] },
    { h: 'Anggaran', type: 'number', rp: 1 }, { h: 'Biaya', type: 'number', rp: 1 }, { h: 'Quantity', type: 'number', def: 1 },
    { h: 'Total Anggaran', ro: 1, rp: 1, f: r => (+r['Anggaran'] || 0) * (+r['Quantity'] || 0) },
    { h: 'Total Biaya', ro: 1, rp: 1, f: r => (+r['Biaya'] || 0) * (+r['Quantity'] || 0) },
    { h: 'Tanggal transaksi', type: 'date' }, { h: 'Dibayar oleh', type: 'text' }, { h: 'Catatan', type: 'textarea' }] },
  itinerary: { label: 'Itinerary', fields: [
    { h: 'Aktivitas', type: 'text', req: 1 },
    { h: 'Jenis aktivitas', type: 'select', options: ['Mepo - BC', 'BC - POS 1', 'POS 1 - POS 2', 'POS 2 - POS 3', 'POS 3 - POS 4', 'POS 4 - POS 5', 'POS 5 - POS 6', 'ISHOMA', 'CAMP GROUND', 'CAMP - BC', 'BC - MEPO', 'SUMMIT'] },
    { h: 'Waktu mulai', type: 'datetime-local' }, { h: 'Waktu berakhir', type: 'datetime-local' }, { h: 'Lokasi', type: 'text' }, { h: 'Catatan', type: 'textarea' }] },
  perlengkapan: { label: 'Perlengkapan', fields: [
    { h: 'Perlengkapan', type: 'text', req: 1 }, { h: 'Kebutuhan', type: 'number' }, { h: 'Kesediaan', type: 'number' },
    { h: 'Sewa', ro: 1, f: r => Math.max(0, (+r['Kebutuhan'] || 0) - (+r['Kesediaan'] || 0)) },
    { h: 'Harga/Unit', type: 'number', rp: 1 },
    { h: 'Total Sewa', ro: 1, rp: 1, f: r => Math.max(0, (+r['Kebutuhan'] || 0) - (+r['Kesediaan'] || 0)) * (+r['Harga/Unit'] || 0) }] }
};
const KEYS = Object.keys(CFG);

/* ===== Penyimpanan lokal (IndexedDB) ===== */
let DB, cur = 'dashboard', editId = null;
const blank = () => ({ set: { destinasi: '', realisasi: 0 }, tamu: [], pemasukan: [], pengeluaran: [], itinerary: [], perlengkapan: [], checklist: [], arsip: [], sim: [], simAktif: null, pin: null, ganti: {}, kat: {}, ulang: [], seq: 1 });
function idb() { return new Promise((ok, no) => { const r = indexedDB.open('budgeting', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); }
async function load() { const d = await idb(); return new Promise(ok => { const q = d.transaction('kv').objectStore('kv').get('db'); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); }
async function save() { const d = await idb(); return new Promise(ok => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(DB, 'db'); t.oncomplete = ok; t.onerror = ok; }); }

/* ===== Helper ===== */
const $ = id => document.getElementById(id);
const rp = n => 'Rp ' + Math.round(Number(n) || 0).toLocaleString('id-ID');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = v => { const m = String(v || '').match(/^(\d{4})-(\d\d)-(\d\d)(?:T(\d\d:\d\d))?/); return m ? m[3] + '/' + m[2] + '/' + m[1] + (m[4] ? ' ' + m[4] : '') : (v || ''); };
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
function badge(v) {
  const s = String(v).toLowerCase(), c = ['lunas', 'diterima'].includes(s) ? 'g' : ['dp', 'menunggu respons'].includes(s) ? 'y' : ['belum lunas', 'ditolak'].includes(s) ? 'r' : '';
  return c ? `<span class="badge ${c}">${esc(v)}</span>` : esc(v);
}
function calc(key, r) { const o = Object.assign({}, r); CFG[key].fields.forEach(f => { if (f.ro) o[f.h] = f.f(o); }); return o; }
const rowsOf = key => DB[key].map(r => calc(key, r));
const sum = (a, f) => a.reduce((s, x) => s + (+f(x) || 0), 0);
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type || 'application/json' })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
function openWA(t, no) { const a = document.createElement('a'); a.href = 'https://wa.me/' + (no || '') + '?text=' + encodeURIComponent(t); a.target = '_blank'; document.body.appendChild(a); a.click(); a.remove(); }
function setMsg(id, text, ok) { const e = $(id); if (e) { e.textContent = text; e.className = 'msg ' + (ok ? 'ok' : 'err'); } }

/* ===== Hitungan dashboard ===== */
function dash() {
  const masuk = sum(DB.pemasukan, r => r['Biaya']), pr = rowsOf('pengeluaran');
  const anggaran = sum(pr, r => r['Total Anggaran']), keluar = sum(pr, r => r['Total Biaya']), real = +DB.set.realisasi || 0;
  const persen = real ? keluar / real : 0, kat = {};
  pr.forEach(r => { const k = String(r['Kategori'] || '').trim() || '(Tanpa kategori)'; const o = kat[k] || (kat[k] = { k, anggaran: 0, biaya: 0 }); o.anggaran += r['Total Anggaran']; o.biaya += r['Total Biaya']; });
  const kategori = Object.values(kat), warnings = [];
  kategori.forEach(x => { if (x.biaya > x.anggaran) warnings.push({ level: 'red', text: x.k + ' lewat ' + rp(x.biaya - x.anggaran) + ' dari anggaran' }); });
  if (real > 0) {
    if (persen > 1) warnings.push({ level: 'red', text: 'Total pengeluaran melebihi Total Realisasi sebesar ' + rp(keluar - real) });
    else if (persen >= 0.8) warnings.push({ level: 'yellow', text: 'Pemakaian sudah ' + (persen * 100).toFixed(0) + '% dari Total Realisasi' });
  }
  return { destinasi: DB.set.destinasi, real, anggaran, masuk, keluar, saldo: masuk - keluar, persen, kategori, warnings };
}
const hbar = (l, v, mx, c, t) => `<div class="hrow"><div>${esc(l)}</div><div class="htrack"><div style="width:${mx > 0 ? Math.min(100, v / mx * 100) : 0}%;background:${c}"></div></div><div class="hv">${t}</div></div>`;
const stat = (l, v) => `<div class="stat"><small>${esc(l)}</small><b>${esc(v)}</b></div>`;

/* ===== Navigasi ===== */
const TABS = [['dashboard', 'Dashboard']].concat(KEYS.map(k => [k, CFG[k].label])).concat([['checklist', 'Checklist'], ['simulasi', 'Simulasi'], ['bayar', 'Pembayaran'], ['rekap', 'Rekap'], ['trip', 'Trip & Arsip'], ['talangan', 'Talangan'], ['kategori', 'Kategori']]);
function show(k) {
  cur = k; editId = null;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.k === (MAIN.includes(k) ? k : 'more')));
  if (k === 'dashboard') renderDash(); else if (k === 'more') renderMore(); else if (k === 'checklist') renderCl(); else if (k === 'trip') renderTrip(); else if (k === 'simulasi') renderSim(); else if (k === 'bayar') renderBayar(); else if (k === 'rekap') renderRekap(); else if (k === 'talangan') renderTalangan(); else if (k === 'kategori') renderKat(); else renderSheet(k);
  if (k !== 'dashboard' && k !== 'more') { const lb = (TABS.find(t => t[0] === k) || ['', ''])[1]; $('main').insertAdjacentHTML('afterbegin', `<div class="pgh">${MAIN.includes(k) ? '' : '<button class="back" onclick="show(\'more\')">‹ Menu</button>'}<h2>${lb}</h2></div>`); }
  window.scrollTo(0, 0);
}

/* ===== Dashboard ===== */
function renderDash() {
  const d = dash();
  $('main').innerHTML = `
  <div class="hero"><small>${esc(d.destinasi || 'Belum ada destinasi')}</small><div class="big">${rp(d.saldo)}</div><small>Sisa saldo</small>

async function submitRow(key) {

function drawList(key) {

/* ===== Simulasi ===== */
const SIM_T = { orang: 'Per orang', grup: 'Sekali per trip', tenda: 'Tenda (sewa jika stok kurang)' };
const KATS = CFG.pengeluaran.fields[1].options, up5 = x => Math.ceil(x / 5000) * 5000;
const simDef = () => ({ nama: '', peserta: 0, official: 0, ikut: true, harga: 0, target: 0, items: [] });
let SIM = null;
function simCalc(s, p) {
  const orang = p + (s.ikut ? +s.official || 0 : 0); let total = 0, tendaSewa = 0; const rows = [];
  s.items.forEach(it => {
    const std = +it.std || 0, sim = +it.sim || 0; let cost, qty, sewa = 0, unitStd = std;
    if (it.t === 'orang') { cost = sim * orang; qty = orang; }
    else if (it.t === 'grup') { cost = sim; qty = 1; unitStd = std * p; }
    else { const need = Math.ceil(orang / Math.max(1, +it.kap || 1)); sewa = Math.max(0, need - (+it.stok || 0)); cost = sewa * sim; qty = sewa; tendaSewa += sewa; }
    total += cost; rows.push({ n: String(it.n || ''), t: it.t, kat: it.kat || 'Lainnya', cost, rev: std * p, qty, unitSim: sim, unitStd, sewa });
  });
  const off = +s.official || 0, pend = (+s.harga || 0) * p, profit = pend - total;
  return { orang, total, rows, tendaSewa, pend, profit, perOff: off ? profit / off : 0, margin: pend ? profit / pend * 100 : 0,
    be: p ? up5(total / p) : 0, hTarget: p ? up5((total + (+s.target || 0) * off) / p) : 0 };
}

    const num = (l, k) => `<label>${l}</label><input type="number" inputmode="decimal" value="${it[k]}" oninput="SIM.items[${i}].${k}=+this.value||0;drawSim()">`;

    <button class="del" style="margin-top:10px" onclick="SIM.items.splice(${i},1);drawItems();drawSim()">Hapus komponen</button></div>`;

function vsReal() {

    let bi = 0, ada = false;
    pr.forEach((r, i) => { if (String(r['Detail pengeluaran']).trim().toLowerCase() === x.n.trim().toLowerCase()) { bi += r['Total Biaya']; ada = true; used[i] = 1; } });
    return { n: x.n, rencana: x.cost, nyata: bi, ada, selisih: ada ? x.cost - bi : null };
  });
  let luar = 0; pr.forEach((r, i) => { if (!used[i]) luar += r['Total Biaya']; });
  const off = +s.official || 0, saldo = masuk - biaya, sebab = [];
  if (masuk < plan.pend) sebab.push('Pemasukan baru ' + rp(masuk) + ' dari target ' + rp(plan.pend) + ' (kurang ' + rp(plan.pend - masuk) + ').');
  else if (masuk > plan.pend) sebab.push('Pemasukan melebihi target sebesar ' + rp(masuk - plan.pend) + '.');
  komp.forEach(k => {
    if (!k.ada) sebab.push(k.n + ' belum dicatat di Pengeluaran.');
    else if (k.selisih < 0) sebab.push(k.n + ' lebih mahal ' + rp(-k.selisih) + ' dari rencana.');
    else if (k.selisih > 0) sebab.push(k.n + ' lebih hemat ' + rp(k.selisih) + ' dari rencana.');
  });

}

    im.onload = () => { const k = Math.min(1, 1000 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); BUKTI = c.toDataURL('image/jpeg', .72); URL.revokeObjectURL(u); showPrev(BUKTI); };

  const { base, p, s } = pesertaInfo(i), d = DB.set, no = 'KW-' + today().replace(/-/g, '') + '-' + String(i + 1).padStart(3, '0');
  const pay = rowsOf('pemasukan').filter(r => r['Kategori'] === 'Peserta' && (normN(r['Dibayar oleh']) || normN(r['Detail pemasukan'])) === normN(p.nama));
  const body = `<div class="sum"><div>No. Kwitansi<b>${no}</b></div><div>Telah terima dari<b>${esc(p.nama)}</b></div><div>Status<b>${s <= 0 ? 'LUNAS' : 'BELUM LUNAS'}</b></div></div>
  <h2>Rincian Pembayaran</h2><table><tr><th>No</th><th>Tanggal</th><th>Keterangan</th><th>Jumlah</th></tr>${pay.map((r, k) => `<tr><td>${k + 1}</td><td>${esc(fmtDate(r['Tanggal transaksi']))}</td><td>${esc(r['Detail pemasukan'])}</td><td>${rp(r['Biaya'])}</td></tr>`).join('') || '<tr><td colspan="4">Belum ada pembayaran tercatat</td></tr>'}
  <tr class="tot"><td colspan="3">Total dibayar</td><td>${rp(p.dibayar)}</td></tr><tr><td colspan="3">Total tagihan</td><td>${rp(base)}</td></tr><tr class="tot"><td colspan="3">${s > 0 ? 'Sisa yang harus dibayar' : 'Status'}</td><td>${s > 0 ? rp(s) : s < 0 ? 'Lebih ' + rp(-s) : 'Lunas'}</td></tr></table>
  ${s > 0 && (d.rek || d.qris) ? `<h2>Cara Pembayaran</h2>${d.rek ? `<div style="white-space:pre-line;margin-bottom:6px">${esc(d.rek)}</div>` : ''}${d.qris ? `<img src="${d.qris}" style="width:150px">` : ''}${d.tenggat ? `<div>Tenggat: ${esc(fmtDate(d.tenggat))}</div>` : ''}` : ''}
  <div class="ttd"><div>Peserta</div><div>Bendahara</div></div>`;
  printDoc(docWrap('KWITANSI PEMBAYARAN', 'Trip: ' + (d.destinasi || '-'), body));
}
function drawBayar() {
  const b = bayarData(), base = window._per[$('bsel').value], td = today(), tg = DB.set.tenggat;
  const telat = b.ps.filter(p => base - p.dibayar > 0 && tg && td > tg).length;
  $('bbox').innerHTML = (tg ? `<div class="warn ${telat ? 'red' : 'note'}">Tenggat ${esc(fmtDate(tg))}${telat ? ' - ' + telat + ' peserta telat bayar' : ''}</div>` : '') + (b.ps.length ? b.ps.map((p, i) => {
    const s = base - p.dibayar, late = s > 0 && tg && td > tg;
    return `<div class="txw"><div class="tx"><div class="av ${s <= 0 ? 'in' : late ? 'out' : ''}">${esc(String(p.nama).charAt(0).toUpperCase())}</div><div class="tm"><b>${esc(p.nama)}</b><small>Bayar ${rp(p.dibayar)} dari ${rp(base)}</small><div style="margin-top:4px">${badge(p.tagihan)}${late ? '<span class="badge r">Telat</span>' : ''}</div></div><div class="ta ${s <= 0 ? 'in' : 'out'}">${sisaTxt(s)}</div></div>
    <div class="acts"><button class="edt" onclick="kwitansi(${i})">🧾 Kwitansi</button>${s > 0 ? `<button class="edt" onclick="tagihWA(${i})">💬 Tagih</button>` : ''}</div></div>`;
  }).join('') : '<div>Belum ada peserta berstatus Diterima.</div>');
}

/* ===== Talangan panitia ===== */
function talanganData() {
  const m = {};
  rowsOf('pengeluaran').forEach(r => { const w = String(r['Dibayar oleh'] || '').trim(), k = normN(w); if (!k || ['kas', 'bendahara', 'kas trip'].includes(k)) return; const o = m[k] || (m[k] = { nama: w, tot: 0, items: [] }); o.tot += r['Total Biaya']; o.items.push(r['Detail pengeluaran']); });
  return Object.keys(m).map(k => Object.assign(m[k], { k, ganti: +DB.ganti[k] || 0 }));
}
function renderTalangan() {
  const L = talanganData();
  $('main').innerHTML = `<div class="card"><h3>Talangan Panitia</h3><small class="mut">Dihitung dari kolom "Dibayar oleh" di Pengeluaran. Nama "Kas" atau "Bendahara" dianggap dari kas, bukan talangan.</small>
  <div class="grid" style="margin-top:10px">${stat('Total talangan', rp(sum(L, x => x.tot)))}${stat('Belum diganti', rp(sum(L, x => Math.max(0, x.tot - x.ganti))))}</div></div>` +
  (L.length ? L.map((x, i) => { const s = x.tot - x.ganti; return `<div class="card"><div class="tx" style="padding:0"><div class="av ${s <= 0 ? 'in' : 'out'}">${esc(x.nama.charAt(0).toUpperCase())}</div><div class="tm"><b>${esc(x.nama)}</b><small>Menalangi ${rp(x.tot)} | sudah diganti ${rp(x.ganti)}</small></div><div class="ta ${s <= 0 ? 'in' : 'out'}">${s > 0 ? rp(s) : 'Lunas'}</div></div>
    <small class="mut">${esc(x.items.slice(0, 6).join(', '))}</small><div class="acts" style="padding:8px 0 0"><button class="edt" onclick="catatGanti(${i})">+ Catat penggantian</button><button class="del" onclick="catatGanti(${i},1)">Reset</button></div></div>`; }).join('') + '<button class="btn" style="background:#25d366" onclick="openWA(talanganText())">💬 Bagikan ke WhatsApp</button>' : '<div class="card">Belum ada pengeluaran dengan penalang. Isi kolom "Dibayar oleh" di Pengeluaran.</div>');
}
async function catatGanti(i, reset) {
  const x = talanganData()[i]; if (!x) return;
  if (reset) { if (!confirm('Reset catatan penggantian ' + x.nama + '?')) return; delete DB.ganti[x.k]; }
  else { const n = Number(String(prompt('Jumlah yang diganti ke ' + x.nama + ' (Rp)', '') || '').replace(/\D/g, '')); if (!n) return; DB.ganti[x.k] = (+DB.ganti[x.k] || 0) + n; }
  await save(); renderTalangan();
}
function talanganText() {
  let t = '*TALANGAN PANITIA*' + (DB.set.destinasi ? ' - ' + DB.set.destinasi : '') + '\n\n';
  talanganData().forEach(x => { const s = x.tot - x.ganti; t += '- ' + x.nama + ': menalangi ' + rp(x.tot) + ', ' + (s > 0 ? 'harus diganti ' + rp(s) : 'sudah lunas') + '\n'; }); return t;
}

/* ===== Mulai ===== */
(async function () {
  DB = Object.assign(blank(), await load() || {}); applyKat(); if (jalankanUlang()) { await save(); setTimeout(() => toast('Transaksi berulang ditambahkan'), 700); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  if (DB.pin) lock(); else { buildNav(); show('dashboard'); }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
