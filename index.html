<header><img src="logo.png" alt="Bawaulin Trip"><div class="ht"><h1>Budgeting Pendakian</h1><small>bawaulin.trip</small></div><button id="tg" onclick="toggleTheme()"></button></header>
<nav id="nav"></nav>
<main id="main">Memuat...</main>
<script>
/* ===== Struktur data (sama dengan sheet di Spreadsheet lama) ===== */
const CFG = {
  tamu: { label: 'Tamu', fields: [
    { h: 'Nama', type: 'text', req: 1 }, { h: 'Meeting Point', type: 'text' }, { h: 'Ponsel', type: 'tel' },
    { h: 'Status', type: 'select', options: ['Diterima', 'Menunggu respons', 'Ditolak'] },
    { h: 'Tagihan', type: 'select', options: ['Lunas', 'DP', 'Belum Lunas'] }, { h: 'Catatan', type: 'textarea' }] },
  pemasukan: { label: 'Pemasukan', fields: [
    { h: 'Detail pemasukan', type: 'text', req: 1 }, { h: 'Kategori', type: 'select', options: ['Peserta', 'Panitia', 'Sponsor'] },
    { h: 'Biaya', type: 'number', rp: 1 }, { h: 'Tanggal transaksi', type: 'date' }, { h: 'Dibayar oleh', type: 'text' }, { h: 'Catatan', type: 'textarea' }] },
  pengeluaran: { label: 'Pengeluaran', fields: [
    { h: 'Detail pengeluaran', type: 'text', req: 1 },
    { h: 'Kategori', type: 'select', options: ['Transportasi', 'Konsumsi', 'Peralatan', 'Darurat', 'Simaksi', 'Ojeg BC', 'P3K', 'Lainnya'] },
    { h: 'Anggaran', type: 'number', rp: 1 }, { h: 'Biaya', type: 'number', rp: 1 }, { h: 'Quantity', type: 'number', def: 1 },
    { h: 'Total Anggaran', ro: 1, rp: 1, f: r => (+r['Anggaran'] || 0) * (+r['Quantity'] || 0) },
    { h: 'Total Biaya', ro: 1, rp: 1, f: r => (+r['Biaya'] || 0) * (+r['Quantity'] || 0) },
    { h: 'Tanggal transaksi', type: 'date' }, { h: 'Dibayar oleh', type: 'text' }, { h: 'Catatan', type: 'textarea' },
    { h: 'Status bayar', type: 'select', options: ['Lunas', 'DP', 'Belum bayar'] }, { h: 'Sudah dibayar', type: 'number', rp: 1 }, { h: 'Tenggat bayar', type: 'date' }] },
  itinerary: { label: 'Itinerary', fields: [
    { h: 'Aktivitas', type: 'text', req: 1 },
    { h: 'Jenis aktivitas', type: 'select', options: ['Mepo - BC', 'BC - POS 1', 'POS 1 - POS 2', 'POS 2 - POS 3', 'POS 3 - POS 4', 'POS 4 - POS 5', 'POS 5 - POS 6', 'ISHOMA', 'CAMP GROUND', 'CAMP - BC', 'BC - MEPO', 'SUMMIT'] },
    { h: 'Waktu mulai', type: 'datetime-local' }, { h: 'Waktu berakhir', type: 'datetime-local' }, { h: 'Lokasi', type: 'text' }, { h: 'Catatan', type: 'textarea' }] },
  perlengkapan: { label: 'Perlengkapan', fields: [
    { h: 'Perlengkapan', type: 'text', req: 1 }, { h: 'Kebutuhan', type: 'number' }, { h: 'Kesediaan', type: 'number' },
    { h: 'Sewa', ro: 1, f: r => Math.max(0, (+r['Kebutuhan'] || 0) - (+r['Kesediaan'] || 0)) },
    { h: 'Harga/Unit', type: 'number', rp: 1 },
    { h: 'Total Sewa', ro: 1, rp: 1, f: r => Math.max(0, (+r['Kebutuhan'] || 0) - (+r['Kesediaan'] || 0)) * (+r['Harga/Unit'] || 0) }] }
};
const KEYS = Object.keys(CFG);

/* ===== Penyimpanan lokal (IndexedDB) ===== */
let DB, cur = 'dashboard', editId = null;
const blank = () => ({ set: { destinasi: '', realisasi: 0 }, tamu: [], pemasukan: [], pengeluaran: [], itinerary: [], perlengkapan: [], checklist: [], arsip: [], sim: [], simAktif: null, pin: null, ganti: {}, kat: {}, ulang: [], seen: {}, trash: [], lastBackup: 0, seq: 1 });
function idb() { return new Promise((ok, no) => { const r = indexedDB.open('budgeting', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); }
async function load() { const d = await idb(); return new Promise(ok => { const q = d.transaction('kv').objectStore('kv').get('db'); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); }
async function save() { const d = await idb(); return new Promise(ok => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(DB, 'db'); t.oncomplete = ok; t.onerror = ok; }); }

/* ===== Helper ===== */
const $ = id => document.getElementById(id);
const rp = n => 'Rp ' + Math.round(Number(n) || 0).toLocaleString('id-ID');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = v => { const m = String(v || '').match(/^(\d{4})-(\d\d)-(\d\d)(?:T(\d\d:\d\d))?/); return m ? m[3] + '/' + m[2] + '/' + m[1] + (m[4] ? ' ' + m[4] : '') : (v || ''); };
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
function badge(v) {
  const s = String(v).toLowerCase(), c = ['lunas', 'diterima'].includes(s) ? 'g' : ['dp', 'menunggu respons'].includes(s) ? 'y' : ['belum lunas', 'ditolak'].includes(s) ? 'r' : '';
  return c ? `<span class="badge ${c}">${esc(v)}</span>` : esc(v);
}
function calc(key, r) { const o = Object.assign({}, r); CFG[key].fields.forEach(f => { if (f.ro) o[f.h] = f.f(o); }); return o; }
const rowsOf = key => DB[key].map(r => calc(key, r));
const sum = (a, f) => a.reduce((s, x) => s + (+f(x) || 0), 0);
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type || 'application/json' })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
function openWA(t, no) { const a = document.createElement('a'); a.href = 'https://wa.me/' + (no || '') + '?text=' + encodeURIComponent(t); a.target = '_blank'; document.body.appendChild(a); a.click(); a.remove(); }
function setMsg(id, text, ok) { const e = $(id); if (e) { e.textContent = text; e.className = 'msg ' + (ok ? 'ok' : 'err'); } }

/* ===== Hitungan dashboard ===== */
function dash() {
  const masuk = sum(DB.pemasukan, r => r['Biaya']), pr = rowsOf('pengeluaran');
  const anggaran = sum(pr, r => r['Total Anggaran']), keluar = sum(pr, r => r['Total Biaya']), real = +DB.set.realisasi || 0;
  const persen = real ? keluar / real : 0, kat = {};
  pr.forEach(r => { const k = String(r['Kategori'] || '').trim() || '(Tanpa kategori)'; const o = kat[k] || (kat[k] = { k, anggaran: 0, biaya: 0 }); o.anggaran += r['Total Anggaran']; o.biaya += r['Total Biaya']; });
  const kategori = Object.values(kat), warnings = [];
  kategori.forEach(x => { if (x.biaya > x.anggaran) warnings.push({ level: 'red', text: x.k + ' lewat ' + rp(x.biaya - x.anggaran) + ' dari anggaran' }); });
  if (real > 0) {
    if (persen > 1) warnings.push({ level: 'red', text: 'Total pengeluaran melebihi Total Realisasi sebesar ' + rp(keluar - real) });
    else if (persen >= 0.8) warnings.push({ level: 'yellow', text: 'Pemakaian sudah ' + (persen * 100).toFixed(0) + '% dari Total Realisasi' });
  }
  return { destinasi: DB.set.destinasi, real, anggaran, masuk, keluar, saldo: masuk - keluar, persen, kategori, warnings };
}

/* ===== Simulasi ===== */
const SIM_T = { orang: 'Per orang', grup: 'Sekali per trip', tenda: 'Tenda (sewa jika stok kurang)' };
const KATS = CFG.pengeluaran.fields[1].options, up5 = x => Math.ceil(x / 5000) * 5000;
const simDef = () => ({ nama: '', peserta: 0, official: 0, ikut: true, harga: 0, target: 0, items: [] });
let SIM = null;
function simCalc(s, p) {
  const orang = p + (s.ikut ? +s.official || 0 : 0); let total = 0, tendaSewa = 0; const rows = [];
  s.items.forEach(it => {
    const std = +it.std || 0, sim = +it.sim || 0; let cost, qty, sewa = 0, unitStd = std;
    if (it.t === 'orang') { cost = sim * orang; qty = orang; }
    else if (it.t === 'grup') { cost = sim; qty = 1; unitStd = std * p; }
    else { const need = Math.ceil(orang / Math.max(1, +it.kap || 1)); sewa = Math.max(0, need - (+it.stok || 0)); cost = sewa * sim; qty = sewa; tendaSewa += sewa; }
    total += cost; rows.push({ n: String(it.n || ''), t: it.t, kat: it.kat || 'Lainnya', cost, rev: std * p, qty, unitSim: sim, unitStd, sewa });
  });
  const off = +s.official || 0, pend = (+s.harga || 0) * p, profit = pend - total;
  return { orang, total, rows, tendaSewa, pend, profit, perOff: off ? profit / off : 0, margin: pend ? profit / pend * 100 : 0,
    be: p ? up5(total / p) : 0, hTarget: p ? up5((total + (+s.target || 0) * off) / p) : 0 };
}

  const d = DB.set;
  return `<div class="card"><h3>🏦 Rekening, QRIS & Tenggat</h3><small class="mut">Tampil di kwitansi dan pesan tagihan WhatsApp.</small>
  <label>Info rekening</label><textarea id="rk" rows="2" placeholder="BCA 1234567890 a.n. Nama">${esc(d.rek || '')}</textarea>
  <label>Tenggat pembayaran</label><input type="date" id="tg2" value="${d.tenggat || ''}"><label>Tagihan per peserta (opsional)</label><input id="tgn" inputmode="numeric" oninput="fmtNum(this)" value="${d.tagihan ? fmtN(d.tagihan) : ''}" placeholder="Contoh: 400.000">
  <label>QRIS</label><div class="flt"><button class="btn alt" style="margin:0" onclick="$('qf').click()">Unggah QRIS</button><button class="btn alt" style="margin:0" onclick="DB.set.qris='';simpanRek()">Hapus QRIS</button></div>
  <input type="file" id="qf" accept="image/*" hidden onchange="pickQris(this)">${d.qris ? `<img src="${d.qris}" style="max-width:160px;border-radius:10px;margin-top:8px;background:#fff">` : ''}
  <button class="btn" onclick="simpanRek()">Simpan</button></div>`;
}
async function simpanRek() { if ($('rk')) { DB.set.rek = $('rk').value.trim(); DB.set.tenggat = $('tg2').value; DB.set.tagihan = Number(($('tgn').value || '').replace(/\D/g, '')) || 0; } await save(); renderBayar(); toast('Tersimpan'); }
function pickQris(inp) {
  const f = inp.files[0]; inp.value = ''; if (!f) return; const im = new Image(), u = URL.createObjectURL(f);
  im.onload = async () => { const k = Math.min(1, 700 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
    DB.set.qris = c.toDataURL('image/jpeg', .88); URL.revokeObjectURL(u); await save(); renderBayar(); toast('QRIS tersimpan'); };
  im.src = u;
}
const normN = x => String(x || '').trim().toLowerCase();
function pesertaInfo(i) { const b = bayarData(), base = window._per[$('bsel').value], p = b.ps[i]; return { base, p, s: base - p.dibayar }; }
function tagihWA(i) {
  const { base, p, s } = pesertaInfo(i), d = DB.set, late = s > 0 && d.tenggat && today() > d.tenggat;
  const t = 'Halo ' + p.nama + ', tagihan trip' + (d.destinasi ? ' ' + d.destinasi : '') + ':\nTotal tagihan: ' + rp(base) + '\nSudah dibayar: ' + rp(p.dibayar) + '\n*Sisa: ' + rp(s) + '*' + (d.tenggat ? '\nTenggat: ' + fmtDate(d.tenggat) + (late ? ' (sudah lewat)' : '') : '') + (d.rek ? '\n\nTransfer ke:\n' + d.rek : '') + (d.qris ? '\n(atau scan QRIS yang dikirim terpisah)' : '') + '\n\nMohon kirim bukti transfer. Terima kasih 🙏';
  let no = String(p.ponsel || '').replace(/\D/g, ''); if (no.indexOf('0') === 0) no = '62' + no.slice(1); openWA(t, no);
}
function terbilang(n) {
  const s = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
  const t = n => { n = Math.floor(n); if (n < 12) return s[n]; if (n < 20) return t(n - 10) + ' belas'; if (n < 100) return t(n / 10) + ' puluh' + (n % 10 ? ' ' + t(n % 10) : '');
    if (n < 200) return 'seratus' + (n > 100 ? ' ' + t(n - 100) : ''); if (n < 1000) return t(n / 100) + ' ratus' + (n % 100 ? ' ' + t(n % 100) : '');
    if (n < 2000) return 'seribu' + (n > 1000 ? ' ' + t(n - 1000) : ''); if (n < 1e6) return t(n / 1e3) + ' ribu' + (n % 1e3 ? ' ' + t(n % 1e3) : '');
    if (n < 1e9) return t(n / 1e6) + ' juta' + (n % 1e6 ? ' ' + t(n % 1e6) : ''); return t(n / 1e9) + ' miliar' + (n % 1e9 ? ' ' + t(n % 1e9) : ''); };
  n = Math.floor(n); return n <= 0 ? 'nol rupiah' : t(n) + ' rupiah';
}
function statusBayar(base, dibayar) { if (base <= 0) return dibayar > 0 ? 'PEMBAYARAN DITERIMA (tagihan belum diatur)' : 'BELUM ADA TAGIHAN'; return base - dibayar <= 0 ? 'LUNAS' : dibayar > 0 ? 'BELUM LUNAS (sebagian)' : 'BELUM BAYAR'; }
function paidFor(paid, nm) { if (paid[nm] !== undefined) return paid[nm]; let t = 0; Object.keys(paid).forEach(k => { if (nm.length >= 3 && k.length >= 3 && (k.indexOf(nm) >= 0 || nm.indexOf(k) >= 0)) t += paid[k]; }); return t; }
function payRowsFor(nama) {
  const n = normN(nama), rows = rowsOf('pemasukan').filter(r => r['Kategori'] === 'Peserta'), key = r => normN(r['Dibayar oleh']) || normN(r['Detail pemasukan']), ex = rows.filter(r => key(r) === n);
  return ex.length ? ex : rows.filter(r => { const k = key(r); return n.length >= 3 && k.length >= 3 && (k.indexOf(n) >= 0 || n.indexOf(k) >= 0); });
}
function drawBayar() {
  const b = bayarData(), base = window._per[$('bsel').value], td = today(), tg = DB.set.tenggat;
  const telat = b.ps.filter(p => base - p.dibayar > 0 && tg && td > tg).length;
  $('bbox').innerHTML = (tg ? `<div class="warn ${telat ? 'red' : 'note'}">Tenggat ${esc(fmtDate(tg))}${telat ? ' - ' + telat + ' peserta telat bayar' : ''}</div>` : '') + (b.ps.length ? b.ps.map((p, i) => {
    const s = base - p.dibayar, late = s > 0 && tg && td > tg;
    return `<div class="txw"><div class="tx"><div class="av ${s <= 0 ? 'in' : late ? 'out' : ''}">${esc(String(p.nama).charAt(0).toUpperCase())}</div><div class="tm"><b>${esc(p.nama)}</b><small>Bayar ${rp(p.dibayar)} dari ${rp(base)}</small><div style="margin-top:4px">${badge(p.tagihan)}${late ? '<span class="badge r">Telat</span>' : ''}</div></div><div class="ta ${s <= 0 ? 'in' : 'out'}">${base > 0 ? sisaTxt(s) : 'Atur tagihan'}</div></div>
    <div class="acts"><button class="edt" onclick="kwitansi(${i})">🧾 Kwitansi</button>${s > 0 ? `<button class="edt" onclick="tagihWA(${i})">💬 Tagih</button>` : ''}</div></div>`;
  }).join('') : '<div>Belum ada peserta berstatus Diterima.</div>');
}

/* ===== Talangan panitia ===== */
function talanganData() {
  const m = {};
  rowsOf('pengeluaran').forEach(r => { const w = String(r['Dibayar oleh'] || '').trim(), k = normN(w); if (!k || ['kas', 'bendahara', 'kas trip'].includes(k)) return; const o = m[k] || (m[k] = { nama: w, tot: 0, items: [] }); o.tot += r['Total Biaya']; o.items.push(r['Detail pengeluaran']); });
  return Object.keys(m).map(k => Object.assign(m[k], { k, ganti: +DB.ganti[k] || 0 }));
}
function renderTalangan() {
  const L = talanganData();
  $('main').innerHTML = `<div class="card"><h3>Talangan Panitia</h3><small class="mut">Dihitung dari kolom "Dibayar oleh" di Pengeluaran. Nama "Kas" atau "Bendahara" dianggap dari kas, bukan talangan.</small>
  <div class="grid" style="margin-top:10px">${stat('Total talangan', rp(sum(L, x => x.tot)))}${stat('Belum diganti', rp(sum(L, x => Math.max(0, x.tot - x.ganti))))}</div></div>` +
  (L.length ? L.map((x, i) => { const s = x.tot - x.ganti; return `<div class="card"><div class="tx" style="padding:0"><div class="av ${s <= 0 ? 'in' : 'out'}">${esc(x.nama.charAt(0).toUpperCase())}</div><div class="tm"><b>${esc(x.nama)}</b><small>Menalangi ${rp(x.tot)} | sudah diganti ${rp(x.ganti)}</small></div><div class="ta ${s <= 0 ? 'in' : 'out'}">${s > 0 ? rp(s) : 'Lunas'}</div></div>
    <small class="mut">${esc(x.items.slice(0, 6).join(', '))}</small><div class="acts" style="padding:8px 0 0"><button class="edt" onclick="catatGanti(${i})">+ Catat penggantian</button><button class="del" onclick="catatGanti(${i},1)">Reset</button></div></div>`; }).join('') + '<button class="btn" style="background:#25d366" onclick="openWA(talanganText())">💬 Bagikan ke WhatsApp</button>' : '<div class="card">Belum ada pengeluaran dengan penalang. Isi kolom "Dibayar oleh" di Pengeluaran.</div>');
}
async function catatGanti(i, reset) {
  const x = talanganData()[i]; if (!x) return;
  if (reset) { if (!confirm('Reset catatan penggantian ' + x.nama + '?')) return; delete DB.ganti[x.k]; }
  else { const n = Number(String(prompt('Jumlah yang diganti ke ' + x.nama + ' (Rp)', '') || '').replace(/\D/g, '')); if (!n) return; DB.ganti[x.k] = (+DB.ganti[x.k] || 0) + n; }
  await save(); renderTalangan();
}
function talanganText() {
  let t = '*TALANGAN PANITIA*' + (DB.set.destinasi ? ' - ' + DB.set.destinasi : '') + '\n\n';
  talanganData().forEach(x => { const s = x.tot - x.ganti; t += '- ' + x.nama + ': menalangi ' + rp(x.tot) + ', ' + (s > 0 ? 'harus diganti ' + rp(s) : 'sudah lunas') + '\n'; }); return t;
}

/* ===== Dokumen PDF: ikut tema, kwitansi ringkas, laporan lengkap ===== */
function matchNama(w, names) {
  if (names.indexOf(w) >= 0 || w.length < 3) return w;
  const c = names.filter(x => x.length >= 3 && (x.indexOf(w) >= 0 || w.indexOf(x) >= 0));
  c.sort((a, b) => Math.abs(a.length - w.length) - Math.abs(b.length - w.length)); return c[0] || w;
}
const pT = (h, rows, tot) => rows.length ? `<table><tr>${h.map(x => `<th>${esc(x)}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}${tot ? `<tr class="tot">${tot.map(c => `<td>${esc(c)}</td>`).join('')}</tr>` : ''}</table>` : '<div class="pw">Belum ada data.</div>';
function docWrap(judul, sub, body, nota) {
  return `${nota ? '' : '<div class="wm"></div>'}<div class="${nota ? 'nota' : 'fulldoc'}"><div class="dh"><img src="logo.png" alt=""><div class="dc"><div class="dt">Budgeting Pendakian</div><div class="ds">bawaulin.trip</div></div><span></span></div>
  <div class="dj">${esc(judul)}</div><div class="dm">${esc(sub || '')}${sub ? ' | ' : ''}No. BWL-${today().replace(/-/g, '')} | ${new Date().toLocaleString('id-ID')}</div><div class="db">${body}</div><div class="df">Dokumen dibuat otomatis oleh bawaulin.trip</div></div>`;
}
function kwitansi(i) {
  const { base, p, s } = pesertaInfo(i), d = DB.set, ada = base > 0, lunas = ada && s <= 0, no = 'KW-' + today().replace(/-/g, '') + '-' + String(i + 1).padStart(3, '0');
  const names = DB.tamu.filter(t => t['Status'] === 'Diterima').map(t => normN(t['Nama']));
  const pay = rowsOf('pemasukan').filter(r => r['Kategori'] === 'Peserta' && matchNama(normN(r['Dibayar oleh']) || normN(r['Detail pemasukan']), names) === normN(p.nama));
  const kv = (a, b) => `<div class="kv"><span>${a}</span><b>${esc(b)}</b></div>`;
  const body = kv('No. Kwitansi', no) + kv('Tanggal', fmtDate(today())) + (d.destinasi ? kv('Trip', d.destinasi) : '') + kv('Diterima dari', p.nama) +
  `<table style="margin-top:6px"><tr><th>No</th><th>Tanggal</th><th>Keterangan</th><th>Jumlah</th></tr>${pay.map((r, k) => `<tr><td>${k + 1}</td><td>${esc(fmtDate(r['Tanggal transaksi']))}</td><td>${esc(r['Detail pemasukan'])}${r['Dibayar oleh'] && normN(r['Dibayar oleh']) !== normN(r['Detail pemasukan']) ? ' (' + esc(r['Dibayar oleh']) + ')' : ''}</td><td>${rp(r['Biaya'])}</td></tr>`).join('') || '<tr><td colspan="4">Belum ada pembayaran tercatat</td></tr>'}
  <tr class="tot"><td colspan="3">Total dibayar</td><td>${rp(p.dibayar)}</td></tr>${ada ? `<tr><td colspan="3">Total tagihan</td><td>${rp(base)}</td></tr><tr class="tot"><td colspan="3">${s > 0 ? 'Sisa yang harus dibayar' : 'Status'}</td><td>${s > 0 ? rp(s) : s < 0 ? 'Lebih ' + rp(-s) : 'Lunas'}</td></tr>` : '<tr><td colspan="4">Total tagihan belum ditetapkan</td></tr>'}</table>
  <div class="st" style="color:${lunas ? '#16a34a' : ada ? '#dc2626' : '#9ca3af'}">${lunas ? 'LUNAS' : ada ? 'BELUM LUNAS' : 'TAGIHAN BELUM DITETAPKAN'}</div>
  ${s > 0 && ada && (d.rek || d.qris || d.tenggat) ? `<div><b>Cara bayar:</b>${d.rek ? `<div style="white-space:pre-line">${esc(d.rek)}</div>` : ''}${d.tenggat ? `<div>Tenggat: ${esc(fmtDate(d.tenggat))}</div>` : ''}${d.qris ? `<img src="${d.qris}" style="width:90px;margin-top:4px">` : ''}</div>` : ''}
  <div class="ttd"><div>Peserta</div><div>Bendahara</div></div>`;
  printDoc(docWrap('KWITANSI PEMBAYARAN', '', body, true));

function laporanHtml() {
  const d = dash(), b = bayarData(), v = vsReal(), pm = rowsOf('pemasukan'), pg = rowsOf('pengeluaran'), pl = rowsOf('perlengkapan'), tl = talanganData(), it = rundownRows(), cl = DB.checklist, base = baseTagihan(b);
  const lamp = pm.map(r => ({ t: 'Pemasukan', n: r['Detail pemasukan'], a: r['Biaya'], v: r.Bukti })).concat(pg.map(r => ({ t: 'Pengeluaran', n: r['Detail pengeluaran'], a: r['Total Biaya'], v: r.Bukti }))).filter(x => x.v && x.v.indexOf('data:image') === 0);

  o += sec('3. Status Pembayaran Peserta (tagihan ' + (base > 0 ? rp(base) + ' / orang' : 'belum ditetapkan') + ')', pT(['Nama', 'Tagihan', 'Sudah bayar', 'Sisa'], b.ps.map(p => [p.nama, p.tagihan || '-', rp(p.dibayar), base > 0 ? sisaTxt(base - p.dibayar) : '-'])));

  o += sec('6. Perlengkapan & Barang yang Disewa', pT(['Barang', 'Butuh', 'Punya', 'Sewa', 'Harga/unit', 'Total sewa'], pl.map(r => [r['Perlengkapan'], r['Kebutuhan'], r['Kesediaan'], r['Sewa'], rp(r['Harga/Unit']), rp(r['Total Sewa'])]), ['', '', '', '', 'TOTAL SEWA', rp(sum(pl, r => r['Total Sewa']))]));

  o += sec('9. Rundown Itinerary', pT(['No', 'Mulai', 'Selesai', 'Aktivitas', 'Jenis', 'Lokasi'], it.map((r, i) => [i + 1, fmtDate(r['Waktu mulai']), fmtDate(r['Waktu berakhir']), r['Aktivitas'], r['Jenis aktivitas'], r['Lokasi']])));
  o += sec('10. Checklist Perlengkapan (' + cl.filter(x => x.siap).length + ' dari ' + cl.length + ' siap)', pT(['Barang', 'Dibawa oleh', 'Catatan', 'Status'], cl.map(x => [x.barang, x.oleh, x.catatan, x.siap ? 'Siap' : 'Belum'])));

/* ===== Pendaftaran online (hybrid) ===== */
const noWA = p => { let n = String(p || '').replace(/\D/g, ''); if (n.indexOf('0') === 0) n = '62' + n.slice(1); return n; };
function daftarLink() { const u = DB.set.daftarUrl; return u ? location.href.replace(/[^/]*([?#].*)?$/, '') + 'daftar.html?s=' + encodeURIComponent(u) + '&t=' + encodeURIComponent(DB.set.destinasi || '') : ''; }
function renderDaftar() {
  const d = DB.set, link = daftarLink(), pend = DB.tamu.filter(t => t['Status'] === 'Menunggu respons');
  $('main').innerHTML = `<div class="card"><h3>Pengaturan Pendaftaran Online</h3><small class="mut">Setup sekali lewat Apps Script (lihat panduan). Setelah itu peserta mendaftar lewat link, dan kamu mengambil datanya saat ada internet.</small>
  <label>Link Apps Script (Web app URL)</label><input id="du" value="${esc(d.daftarUrl || '')}" placeholder="https://script.google.com/macros/s/.../exec"><label>Kunci rahasia</label><input id="dk" type="password" value="${esc(d.daftarKey || '')}">
  <button class="btn" onclick="simpanDaftar()">Simpan</button></div>
  ${link ? `<div class="card"><h3>Link Pendaftaran</h3><small class="mut">Destinasi: ${esc(d.destinasi || '(belum diisi di Beranda)')}</small><input id="dl" readonly value="${esc(link)}" onclick="this.select()" style="margin-top:8px">
  <div class="flt"><button class="btn alt" style="margin:0" onclick="navigator.clipboard&&navigator.clipboard.writeText($('dl').value);toast('Link disalin')">Salin link</button><button class="btn" style="margin:0;background:#25d366" onclick="openWA('Daftar trip${esc(d.destinasi ? ' ' + d.destinasi : '')} di sini:\\n'+$('dl').value)">Bagikan WA</button></div></div>` : ''}
  <div class="card"><h3>Pendaftar Masuk</h3><button class="btn" onclick="ambilDaftar()">⬇️ Ambil pendaftar baru</button><div id="dmsg" class="msg"></div></div>
  <div class="card"><h3>Menunggu Respons (${pend.length})</h3>${pend.length ? pend.map(t => `<div class="txw"><div class="tx"><div class="av">${esc(String(t['Nama']).charAt(0).toUpperCase())}</div><div class="tm"><b>${esc(t['Nama'])}</b><small>${esc(t['Ponsel'] || '')}</small><small>${esc(String(t['Catatan'] || '').slice(0, 90))}</small></div></div>
  <div class="acts"><button class="edt" onclick="setStatusTamu(${t.id},'Diterima')">Terima</button><button class="del" onclick="setStatusTamu(${t.id},'Ditolak')">Tolak</button><button class="edt" onclick="openWA('Halo ${esc(t['Nama'])}, terima kasih sudah mendaftar.','${noWA(t['Ponsel'])}')">💬 WA</button></div></div>`).join('') : '<div>Tidak ada yang menunggu.</div>'}</div>`;
}
async function simpanDaftar() { DB.set.daftarUrl = $('du').value.trim(); DB.set.daftarKey = $('dk').value.trim(); await save(); renderDaftar(); toast('Tersimpan'); }
async function setStatusTamu(id, s) { DB.tamu.find(t => t.id === id)['Status'] = s; await save(); renderDaftar(); }
async function ambilDaftar() {

  const f = inp.files[0]; inp.value = ''; if (!f) return; const rd = new FileReader();
  rd.onload = async () => {
    const rows = parseCSV(rd.result); if (rows.length < 2) return toast('File CSV kosong atau tanpa data');
    const c = CFG[key], hd = rows[0].map(h => h.trim().toLowerCase()), idx = fd => hd.indexOf(fd.h.toLowerCase());
    if (idx(c.fields[0]) < 0) return alert('Kolom "' + c.fields[0].h + '" tidak ditemukan. Gunakan file hasil Ekspor CSV sebagai contoh format.');
    const have = new Set(DB[key].map(r => sig(c, r))), add = []; let skip = 0, dup = 0;
    rows.slice(1).forEach(cells => {
      const r = {}; c.fields.forEach(fd => {
        if (fd.ro) return; const i = idx(fd); let v = i >= 0 ? String(cells[i] == null ? '' : cells[i]).trim().replace(/^'([=+\-@])/, '$1') : '';
        if (fd.type === 'number') { const n = v === '' ? NaN : parseNum(v); v = isNaN(n) ? (fd.def !== undefined ? fd.def : '') : n; }
        else if (fd.type === 'date') v = normDate(v); else if (fd.type === 'datetime-local') v = normDT(v); r[fd.h] = v; });
      if (!String(r[c.fields[0].h]).trim()) { skip++; return; } const s = sig(c, r); if (have.has(s)) { dup++; return; } have.add(s); add.push(r);
    });
    if (!add.length) return toast('Tidak ada baris baru (' + dup + ' duplikat, ' + skip + ' kosong)');
    if (!confirm('Impor ' + add.length + ' baris ke ' + c.label + '?' + (dup ? '\n' + dup + ' duplikat dilewati.' : '') + (skip ? '\n' + skip + ' baris tanpa ' + c.fields[0].h + ' dilewati.' : ''))) return;
    if (key === 'pemasukan' || key === 'pengeluaran') { const a = katList(key).slice(), n0 = a.length;
      add.forEach(r => { const k = String(r['Kategori'] || '').trim(), e = a.find(x => x.toLowerCase() === k.toLowerCase()); if (e) r['Kategori'] = e; else if (k) a.push(k); });
      if (a.length !== n0) { DB.kat[key] = a; applyKat(); } }
    add.forEach(r => DB[key].push(Object.assign({ id: DB.seq++ }, r))); await save(); show(key); toast(add.length + ' baris diimpor');
  };
  rd.readAsText(f);
}

function settle() {
  const names = offList(), nl = names.map(normN), n = names.length; if (!n) return null;
  const g = bagiData(), fair = -g.s / n, O = names.map(nm => ({ nama: nm, setor: 0, talang: 0, sa: [], ta: [] })), asing = {};
  const idx = w => { const k = normN(w); if (!k || ['kas', 'bendahara', 'kas trip'].includes(k)) return -1; return nl.indexOf(matchNama(k, nl)); };
  DB.pemasukan.forEach(r => { if (r['Kategori'] !== 'Panitia') return; const i = idx(r['Dibayar oleh']); if (i < 0) asing[String(r['Dibayar oleh'] || '(kosong)')] = 1; else { O[i].setor += +r['Biaya'] || 0; O[i].sa.push(+r['Biaya'] || 0); } });
  rowsOf('pengeluaran').forEach(r => { if (!talangOf(r)) return; const w = String(r['Dibayar oleh']).trim(), i = idx(w); if (i < 0) asing[w] = 1; else { O[i].talang += r['Total Biaya']; O[i].ta.push(r['Total Biaya']); } });

  const deb = bal.filter(x => x.v < 0).map(x => ({ nama: x.nama, v: -x.v })).sort((a, b) => b.v - a.v), kre = bal.filter(x => x.v > 0).map(x => ({ nama: x.nama, v: x.v })).sort((a, b) => b.v - a.v), tf = [];

function bagiPdf() {

function kewajibanData() {

/* Laporan untuk peserta (tanpa data pribadi) */
