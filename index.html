<body>
<header><img id="hlogo" src="logo.png" alt="Logo"><div class="ht"><h1>Budgeting Pendakian</h1><small id="hnama">bawaulin.trip</small></div><button id="tg" onclick="toggleTheme()"></button></header>
<nav id="nav"></nav>
<main id="main">Memuat...</main>
<script>
/* ===== Struktur data (sama dengan sheet di Spreadsheet lama) ===== */
const CFG = {
  tamu: { label: 'Tamu', fields: [
    { h: 'Nama', type: 'text', req: 1 }, { h: 'Meeting Point', type: 'text' }, { h: 'Ponsel', type: 'tel' },
    { h: 'Status', type: 'select', options: ['Diterima', 'Menunggu respons', 'Ditolak'] },
    { h: 'Tagihan', type: 'select', options: ['Lunas', 'DP', 'Belum Lunas'] }, { h: 'Catatan', type: 'textarea' }] },
  pemasukan: { label: 'Pemasukan', fields: [
    { h: 'Detail pemasukan', type: 'text', req: 1 }, { h: 'Kategori', type: 'select', options: ['Peserta', 'Panitia', 'Sponsor'] },
    { h: 'Biaya', type: 'number', rp: 1 }, { h: 'Tanggal transaksi', type: 'date' }, { h: 'Dibayar oleh', type: 'text' }, { h: 'Catatan', type: 'textarea' }] },
  pengeluaran: { label: 'Pengeluaran', fields: [
    { h: 'Detail pengeluaran', type: 'text', req: 1 },
    { h: 'Kategori', type: 'select', options: ['Transportasi', 'Konsumsi', 'Peralatan', 'Darurat', 'Simaksi', 'Ojeg BC', 'P3K', 'Lainnya'] },
    { h: 'Anggaran', type: 'number', rp: 1 }, { h: 'Biaya', type: 'number', rp: 1 }, { h: 'Quantity', type: 'number', def: 1 },
    { h: 'Total Anggaran', ro: 1, rp: 1, f: r => (+r['Anggaran'] || 0) * (+r['Quantity'] || 0) },
    { h: 'Total Biaya', ro: 1, rp: 1, f: r => (+r['Biaya'] || 0) * (+r['Quantity'] || 0) },
    { h: 'Tanggal transaksi', type: 'date' }, { h: 'Dibayar oleh', type: 'text' }, { h: 'Catatan', type: 'textarea' }] },
  itinerary: { label: 'Itinerary', fields: [
    { h: 'Aktivitas', type: 'text', req: 1 },
    { h: 'Jenis aktivitas', type: 'select', options: ['Mepo - BC', 'BC - POS 1', 'POS 1 - POS 2', 'POS 2 - POS 3', 'POS 3 - POS 4', 'POS 4 - POS 5', 'POS 5 - POS 6', 'ISHOMA', 'CAMP GROUND', 'CAMP - BC', 'BC - MEPO', 'SUMMIT'] },
    { h: 'Waktu mulai', type: 'datetime-local' }, { h: 'Waktu berakhir', type: 'datetime-local' }, { h: 'Lokasi', type: 'text' }, { h: 'Catatan', type: 'textarea' }] },
  perlengkapan: { label: 'Perlengkapan', fields: [
    { h: 'Perlengkapan', type: 'text', req: 1 }, { h: 'Kebutuhan', type: 'number' }, { h: 'Kesediaan', type: 'number' },
    { h: 'Sewa', ro: 1, f: r => Math.max(0, (+r['Kebutuhan'] || 0) - (+r['Kesediaan'] || 0)) },
    { h: 'Harga/Unit', type: 'number', rp: 1 },
    { h: 'Total Sewa', ro: 1, rp: 1, f: r => Math.max(0, (+r['Kebutuhan'] || 0) - (+r['Kesediaan'] || 0)) * (+r['Harga/Unit'] || 0) }] }
};
const KEYS = Object.keys(CFG);

/* ===== Penyimpanan lokal (IndexedDB) ===== */
let DB, cur = 'dashboard', editId = null;
const blank = () => ({ set: { destinasi: '', realisasi: 0 }, tamu: [], pemasukan: [], pengeluaran: [], itinerary: [], perlengkapan: [], checklist: [], arsip: [], sim: [], simAktif: null, pin: null, ganti: {}, kat: {}, ulang: [], seen: {}, trash: [], pribadi: [], lastBackup: 0, seq: 1, pref: {}, profil: {}, kw: {}, nomor: {} });
function idb() { return new Promise((ok, no) => { const r = indexedDB.open('budgeting', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); }
async function load() { const d = await idb(); return new Promise(ok => { const q = d.transaction('kv').objectStore('kv').get('db'); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); }
async function save() { const d = await idb(); return new Promise(ok => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(DB, 'db'); t.oncomplete = ok; t.onerror = ok; }); }

/* ===== Helper ===== */
const $ = id => document.getElementById(id);
const rp = n => 'Rp ' + Math.round(Number(n) || 0).toLocaleString('id-ID');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = v => { const m = String(v || '').match(/^(\d{4})-(\d\d)-(\d\d)(?:T(\d\d:\d\d))?/); return m ? m[3] + '/' + m[2] + '/' + m[1] + (m[4] ? ' ' + m[4] : '') : (v || ''); };
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
function badge(v) {
  const s = String(v).toLowerCase(), c = ['lunas', 'diterima'].includes(s) ? 'g' : ['dp', 'menunggu respons'].includes(s) ? 'y' : ['belum lunas', 'ditolak'].includes(s) ? 'r' : '';
  return c ? `<span class="badge ${c}">${esc(v)}</span>` : esc(v);
}
function calc(key, r) { const o = Object.assign({}, r); CFG[key].fields.forEach(f => { if (f.ro) o[f.h] = f.f(o); }); return o; }
const rowsOf = key => DB[key].map(r => calc(key, r));
const sum = (a, f) => a.reduce((s, x) => s + (+f(x) || 0), 0);
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type || 'application/json' })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
/* v1.0.1: rapikan nomor HP (angka 0 di depan sering hilang dari Google Sheet) */
function normHP(v) { const s = String(v == null ? '' : v).trim(); if (!s || !/^[+\d\s().-]+$/.test(s)) return s; const d = s.replace(/\D/g, ''); if (/^62\d{8,13}$/.test(d)) return '0' + d.slice(2); if (/^8\d{8,11}$/.test(d)) return '0' + d; return s; }
function waDigits(v) { let d = normHP(v).replace(/\D/g, ''); if (d.indexOf('0') === 0) d = '62' + d.slice(1); return d; }
function openWA(t, no) { const a = document.createElement('a'); a.href = 'https://wa.me/' + (no || '') + '?text=' + encodeURIComponent(t); a.target = '_blank'; document.body.appendChild(a); a.click(); a.remove(); }
function setMsg(id, text, ok) { const e = $(id); if (e) { e.textContent = text; e.className = 'msg ' + (ok ? 'ok' : 'err'); } }

/* ===== Hitungan dashboard ===== */
function dash() {
  const masuk = sum(DB.pemasukan, r => r['Biaya']), pr = rowsOf('pengeluaran');
  const anggaran = sum(pr, r => r['Total Anggaran']), keluar = sum(pr, r => r['Total Biaya']), real = +DB.set.realisasi || 0;
  const persen = real ? keluar / real : 0, kat = {};
  pr.forEach(r => { const k = String(r['Kategori'] || '').trim() || '(Tanpa kategori)'; const o = kat[k] || (kat[k] = { k, anggaran: 0, biaya: 0 }); o.anggaran += r['Total Anggaran']; o.biaya += r['Total Biaya']; });
  const kategori = Object.values(kat), warnings = [];
  kategori.forEach(x => { if (x.biaya > x.anggaran) warnings.push({ level: 'red', text: x.k + ' lewat ' + rp(x.biaya - x.anggaran) + ' dari anggaran' }); });
  if (real > 0) {
    if (persen > 1) warnings.push({ level: 'red', text: 'Total pengeluaran melebihi Total Realisasi sebesar ' + rp(keluar - real) });
    else if (persen >= 0.8) warnings.push({ level: 'yellow', text: 'Pemakaian sudah ' + (persen * 100).toFixed(0) + '% dari Total Realisasi' });
  }
  return { destinasi: DB.set.destinasi, real, anggaran, masuk, keluar, saldo: masuk - keluar, persen, kategori, warnings };
}
const hbar = (l, v, mx, c, t) => `<div class="hrow"><div>${esc(l)}</div><div class="htrack"><div style="width:${mx > 0 ? Math.min(100, v / mx * 100) : 0}%;background:${c}"></div></div><div class="hv">${t}</div></div>`;
const stat = (l, v) => `<div class="stat"><small>${esc(l)}</small><b>${esc(v)}</b></div>`;

/* ===== Navigasi ===== */
const TABS = [['dashboard', 'Dashboard']].concat(KEYS.map(k => [k, CFG[k].label])).concat([['checklist', 'Checklist'], ['simulasi', 'Simulasi'], ['bayar', 'Pembayaran'], ['rekap', 'Rekap'], ['trip', 'Trip & Arsip'], ['bagihasil', 'Bagi Hasil'], ['kategori', 'Kategori'], ['daftar', 'Pendaftaran'], ['akun', 'Akun'], ['pengaturan', 'Pengaturan'], ['kalk', 'Kalkulator'], ['panduan', 'Panduan']]);
function show(k) {
  cur = k; editId = null;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.k === (MAIN.includes(k) ? k : k === 'pengaturan' ? 'akun' : 'more')));
  if (k === 'dashboard') renderDash(); else if (k === 'more') renderMore(); else if (k === 'checklist') renderCl(); else if (k === 'trip') renderTrip(); else if (k === 'simulasi') renderSim(); else if (k === 'bayar') renderBayar(); else if (k === 'rekap') renderRekap(); else if (k === 'bagihasil') renderBagiHasil(); else if (k === 'kategori') renderKat(); else if (k === 'daftar') renderDaftar(); else if (k === 'akun') renderAkun(); else if (k === 'pengaturan') renderPeng(); else if (k === 'kalk') renderKalk(); else if (k === 'panduan') { if (!PD.keep) PD.ch = -1; PD.keep = false; renderPanduan(); } else renderSheet(k);
  if (k !== 'dashboard' && k !== 'more') { const lb = (TABS.find(t => t[0] === k) || ['', ''])[1]; $('main').insertAdjacentHTML('afterbegin', `<div class="pgh">${MAIN.includes(k) ? '' : k === 'pengaturan' ? '<button class="back" onclick="show(\'akun\')">‹ Akun</button>' : '<button class="back" onclick="show(\'more\')">‹ Menu</button>'}<h2>${lb}</h2>${k === 'akun' ? `<button class="pgear" onclick="show(\'pengaturan\')" aria-label="Buka Pengaturan">${SVG_GEAR}</button>` : ''}</div>`); }
  if (tutupOn() && ['dashboard', 'pemasukan', 'pengeluaran', 'bayar', 'bagihasil'].indexOf(k) >= 0) { const h = $('main').querySelector('.pgh'); if (h) h.insertAdjacentHTML('afterend', tutupBanner()); else $('main').insertAdjacentHTML('afterbegin', tutupBanner()); }
  if (CR_OK === false) $('main').insertAdjacentHTML('afterbegin', '<div class="warn red">Identitas pembuat aplikasi berubah. Fitur PDF dikunci. Pasang ulang aplikasi asli.</div>');
  window.scrollTo(0, 0);
}

/* ===== Dashboard ===== */
function renderDash() {
  const d = dash();
  $('main').innerHTML = `
  <div class="hero"><small>${esc(d.destinasi || 'Belum ada destinasi')}</small><div class="big">${rp(d.saldo)}</div><small>Sisa saldo</small>
    <div class="chips" style="margin-top:12px"><div class="chip"><small>Pemasukan</small><b>${rp(d.masuk)}</b></div><div class="chip"><small>Pengeluaran</small><b>${rp(d.keluar)}</b></div></div></div>
  <button class="btn" style="margin:0 0 14px" onclick="catatCepat()">＋ Catat transaksi</button>
  <div class="card ringw"><svg width="96" height="96" viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" fill="none" style="stroke:var(--card2)" stroke-width="9"/><circle cx="40" cy="40" r="34" fill="none" style="stroke:${d.persen > 1 ? '#ef4444' : 'var(--pri)'}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${Math.min(1, d.persen) * 213.6} 213.6" transform="rotate(-90 40 40)"/><text x="40" y="45" text-anchor="middle" style="fill:var(--tx)" font-size="15" font-weight="800">${(d.persen * 100).toFixed(0)}%</text></svg>
    <div><b>Pemakaian anggaran</b><br><small class="mut">Realisasi</small> ${rp(d.real)}<br><small class="mut">Anggaran</small> ${rp(d.anggaran)}</div></div>

/* ===== Simulasi ===== */
const SIM_T = { orang: 'Per orang', grup: 'Sekali per trip', tenda: 'Tenda (sewa jika stok kurang)' };
const KATS = CFG.pengeluaran.fields[1].options, up5 = x => { const b = (typeof DB !== 'undefined' && DB && DB.pref && Number(DB.pref.bulat)) || 5000; return Math.ceil(x / b) * b; };
const simDef = () => ({ nama: '', peserta: 0, official: 0, ikut: true, harga: 0, target: 0, items: [] });
let SIM = null;
function simCalc(s, p) {
  const orang = p + (s.ikut ? +s.official || 0 : 0); let total = 0, tendaSewa = 0; const rows = [];
  s.items.forEach(it => {
    const std = +it.std || 0, sim = +it.sim || 0; let cost, qty, sewa = 0, unitStd = std;
    if (it.t === 'orang') { cost = sim * orang; qty = orang; }
    else if (it.t === 'grup') { cost = sim; qty = 1; unitStd = std * p; }
    else { const need = Math.ceil(orang / Math.max(1, +it.kap || 1)); sewa = Math.max(0, need - (+it.stok || 0)); cost = sewa * sim; qty = sewa; tendaSewa += sewa; }
    total += cost; rows.push({ n: String(it.n || ''), t: it.t, kat: it.kat || 'Lainnya', cost, rev: std * p, qty, unitSim: sim, unitStd, sewa });
  });
  const off = +s.official || 0, pend = (+s.harga || 0) * p, profit = pend - total;
  return { orang, total, rows, tendaSewa, pend, profit, perOff: off ? profit / off : 0, margin: pend ? profit / pend * 100 : 0,
    be: p ? up5(total / p) : 0, hTarget: p ? up5((total + (+s.target || 0) * off) / p) : 0 };
}

function drawItems() {
  $('sitems').innerHTML = SIM.items.map((it, i) => {
    const num = (l, k, m) => `<label>${l}</label>` + (m ? `<input type="text" inputmode="numeric" value="${fmtN(it[k])}" oninput="fmtNum(this);SIM.items[${i}].${k}=numVal(this.value);drawSim()">` : `<input type="number" inputmode="decimal" value="${it[k]}" oninput="SIM.items[${i}].${k}=+this.value||0;drawSim()">`);
    return `<div style="border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:10px"><label>Nama komponen</label><input value="${esc(it.n)}" oninput="SIM.items[${i}].n=this.value;drawSim()">
    <label>Jenis biaya</label><select onchange="SIM.items[${i}].t=this.value;drawItems();drawSim()">${Object.keys(SIM_T).map(k => `<option value="${k}" ${it.t === k ? 'selected' : ''}>${SIM_T[k]}</option>`).join('')}</select>

    ${num('Anggaran per peserta (Rp), bagian dari harga jual', 'std', 1)}${num(it.t === 'orang' ? 'Biaya asli per orang (Rp), yang benar-benar dikeluarkan' : it.t === 'grup' ? 'Biaya asli total per trip (Rp)' : 'Biaya sewa per tenda (Rp)', 'sim', 1)}${it.t === 'tenda' ? num('Kapasitas per tenda (orang)', 'kap') + num('Tenda milik sendiri (stok)', 'stok') : ''}
    <button class="del" style="margin-top:10px" onclick="SIM.items.splice(${i},1);drawItems();drawSim()">Hapus komponen</button></div>`;
  }).join('');
}
function drawSim() {
  const p = +SIM.peserta || 0, r = simCalc(SIM, p), cnt = Array.from({ length: 20 }, (_, i) => i + 1); if (p > 20) cnt.push(p);

function geserTgl(v, diff) { const m = /^(\d{4})-(\d{2})-(\d{2})(.*)$/.exec(String(v || '')); if (!m) return ''; return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3] + diff)).toISOString().slice(0, 10) + m[4]; }

  let diff = 0; if (tglBaru && awal) { const a = awal.split('-'), b = tglBaru.split('-'); diff = Math.round((Date.UTC(+b[0], +b[1] - 1, +b[2]) - Date.UTC(+a[0], +a[1] - 1, +a[2])) / 86400000); }
  return src.map(r => { const o = JSON.parse(JSON.stringify(r)); o.id = DB.seq++;
    if (tglBaru && awal) { o['Waktu mulai'] = geserTgl(r['Waktu mulai'], diff); o['Waktu berakhir'] = geserTgl(r['Waktu berakhir'], diff); }
    else { o['Waktu mulai'] = ''; o['Waktu berakhir'] = ''; } return o; });
}

    st: ['Ketuk ＋ Catat transaksi di Beranda (atau Menu › Masuk / Keluar lalu tombol + bulat).', 'Isi Detail (wajib), Kategori, Biaya, Tanggal transaksi, Dibayar oleh, dan Catatan. Angka otomatis diberi titik ribuan.', 'Khusus Pengeluaran: Anggaran adalah rencana per satuan, Biaya adalah uang nyata per satuan. Total Anggaran dan Total Biaya = nilai × Quantity.', 'Bukti nota: ketuk 📷 Kamera atau 📎 Unggah file. Lihat lagi lewat tombol 📎 Bukti.', 'Dibayar oleh: untuk pemasukan peserta, tulis nama yang sama persis dengan di Tamu supaya status bayarnya terbaca. Untuk pengeluaran, tulis nama official yang menalangi, dipakai di Bagi Hasil.', 'Ulangi otomatis: pilih di formulir untuk transaksi rutin. Ditambahkan sendiri saat aplikasi dibuka.', 'Daftar di bawah formulir bisa dicari, difilter per kategori atau tanggal, dan diubah lewat Edit.', 'Entri yang dihapus masuk Tempat Sampah selama 30 hari (Menu › Trip & Arsip › Pulihkan).', 'Ekspor CSV atau Impor CSV tersedia di kartu Data.'],
    tp: ['Pemasukan dengan kategori Peserta dipakai untuk menghitung siapa yang sudah bayar.', 'Kategori Panitia dipakai untuk setoran official, bukan pemasukan trip.'] },

      { c: 'Hitung Trip berisi 7 rumus siap pakai lengkap dengan langkahnya. Riwayat menyimpan hasil =.', ui: mH('Kalkulator') + `<div class="mseg"><span>Kalkulator</span><span class="tp on">Hitung Trip</span><span>Riwayat</span></div>` + mCard('Patungan per orang', mRow('Total biaya', '21.300.000') + mRow('Hasil', 'Rp 2.150.000')) }],
    st: ['Buka Menu › Kalkulator. Tiga mode: Kalkulator, Hitung Trip, dan Riwayat.', 'Tombol angka, + − × ÷, koma desimal, dan ⌫ seperti kalkulator HP. AC menghapus semua.', 'Tombol ( ) pintar: menaruh kurung buka lalu kurung tutup sesuai kebutuhan.', 'Persen menyesuaikan angka di depannya: 200 + 10% = 220, 200 × 10% = 20, 50% = 0,5.', 'Ketuk = untuk menyimpan hitungan ke Riwayat. Hasil bisa dilanjutkan dengan operator berikutnya.', 'Angka bulat 1.000 ke atas otomatis dieja di bawah hasil (terbilang).', 'Chip 📋 Salin menyalin hasil. 👥 ÷ Peserta membagi hasil dengan jumlah peserta Diterima. ⬆ Bulat membulatkan ke atas sesuai Pengaturan.', 'Memori: M+ dan M− menambah atau mengurangi, MR memanggil, MC menghapus.', 'Hitung Trip: Patungan per orang, Harga jual dari target untung, Balik modal, DP dan sisa, Selisih dan persen, Diskon dan PPN, Konversi mata uang. Ketuk Salin hasil untuk membagikannya.', 'Riwayat: ketuk satu baris untuk memakai lagi hasilnya.'],

    st: ['Menu › Pembayaran. Ringkasan di atas menunjukkan jumlah terkumpul, status tiap peserta, dan tenggat.', 'Tagihan per orang diambil dengan urutan: tagihan tetap, lalu harga jual simulasi, lalu Total Realisasi dibagi peserta Diterima. Ketuk Ubah di baris Tagihan per orang untuk melihat hitungan lain.', 'Cari peserta lewat kotak pencarian, atau saring dengan Belum lunas, Sebagian, Lunas, dan Telat.', 'Ketuk ＋ Catat bayar, cek jumlah, pilih Dibayar lewat, lalu Simpan. Pembayaran tersimpan sebagai Pemasukan kategori Peserta dan bisa diubah atau dihapus di Menu › Masuk.', 'Buka kartu Cara bayar untuk menambah rekening bank dan e-wallet (nama bebas, mis. OVO atau LinkAja). Ketuk Salin nomor untuk menyalin. Matikan Aktif bila tidak ingin tampil.', 'Ketuk 💬 Tagih untuk mengirim pesan WhatsApp berisi total, yang sudah dibayar, sisa, tenggat, dan semua cara bayar aktif. Tagih berikutnya membuka peserta yang belum ditagih satu per satu. Isi pesan bisa diubah di Pengaturan › Pesan tagihan.', 'Bagikan › Kartu cara bayar (PDF) atau Cara bayar ke grup WhatsApp untuk memberi tahu semua peserta sekaligus.', 'Ketuk 🧾 Kwitansi untuk membuat kwitansi. Nomor berformat KW/kode penyelenggara/kode destinasi/tahun/urut. Cetak ulang dengan jumlah bayar yang sama memakai nomor yang sama.', 'Tanda tangan, stempel, nama penanda tangan, dan kode penyelenggara diatur di Akun › Kwitansi.'],

const PD = { ch: -1, f: 0, timer: null, play: true };
function renderPanduan() {
  clearInterval(PD.timer);
  if (PD.ch < 0) {
    $('main').innerHTML = `<div class="card"><h3>Panduan lengkap</h3><small class="mut">Pilih topik. Setiap topik punya demo bergerak, langkah rinci, dan tips. Semua jalan tanpa internet.</small></div>
    <div class="pdl">${PAN.map((c, i) => `<button class="pdc" onclick="pdBuka(${i})"><span class="pdi">${c.ic}</span><span class="pdt"><b>${esc(c.t)}</b><small>${esc(c.s)}</small></span><span class="zch">›</span></button>`).join('')}</div>`;
    return;
  }
  const c = PAN[PD.ch], n = c.demo ? c.demo.length : 0;
  $('main').innerHTML = `<button class="back" onclick="pdBuka(-1)">‹ Semua topik</button>
  <div class="card"><h3>${c.ic} ${esc(c.t)}</h3><small class="mut">${esc(c.s)}</small>
  ${n ? `<div class="pd-phone" id="pdph" onclick="pdNext()"><div class="pd-scr">${c.demo.map((f, i) => `<div class="pd-f${i === 0 ? ' on' : ''}">${f.ui}</div>`).join('')}</div><div class="pd-tap" id="pdtap"></div></div>
  <div class="pd-cap" id="pdcap"></div><div class="pd-dots" id="pdd">${c.demo.map((f, i) => `<button onclick="pdShow(${i})" aria-label="Langkah ${i + 1}"></button>`).join('')}</div>
  <div class="kchips" style="justify-content:center"><button class="kchip" onclick="pdPrev()">⏮</button><button class="kchip" id="pdpl" onclick="pdToggle()">⏸ Jeda</button><button class="kchip" onclick="pdNext()">⏭</button></div>` : ''}</div>
  <div class="card"><h3>Langkah rinci</h3>${c.st.map((x, i) => `<div class="pds"><span>${i + 1}</span><div>${esc(x)}</div></div>`).join('')}</div>
  ${c.tp.length ? `<div class="card"><h3>💡 Tips</h3>${c.tp.map(x => `<div class="warn note">${esc(x)}</div>`).join('')}</div>` : ''}
  ${c.go ? `<button class="btn" onclick="show('${c.go}')">Coba sekarang ›</button>` : ''}
  <div class="flt" style="margin-top:6px">${PD.ch > 0 ? `<button class="btn alt" onclick="pdBuka(${PD.ch - 1})">‹ ${esc(PAN[PD.ch - 1].t)}</button>` : ''}${PD.ch < PAN.length - 1 ? `<button class="btn alt" onclick="pdBuka(${PD.ch + 1})">${esc(PAN[PD.ch + 1].t)} ›</button>` : ''}</div>`;
  if (n) { PD.play = true; setTimeout(() => { pdShow(0); PD.timer = setInterval(() => { if (cur !== 'panduan' || !$('pdtap')) { clearInterval(PD.timer); return; } if (PD.play) pdShow((PD.f + 1) % PAN[PD.ch].demo.length); }, 3600); }, 60); }
}
function pdBuka(i) { PD.ch = i; PD.f = 0; PD.keep = true; show('panduan'); }
function pdShow(i) {
  const c = PAN[PD.ch]; if (!c || !c.demo || !$('pdph')) return; PD.f = i;
  const fr = document.querySelectorAll('.pd-f'); fr.forEach((e, j) => e.classList.toggle('on', j === i));
  document.querySelectorAll('#pdd button').forEach((e, j) => e.classList.toggle('on', j === i));
  $('pdcap').innerHTML = `<b>${i + 1}/${c.demo.length}</b> ${esc(c.demo[i].c)}`;
  const ph = $('pdph'), t = $('pdtap'), tg = fr[i].querySelector('.tp');
  t.classList.remove('hit');
  if (tg) { const a = ph.getBoundingClientRect(), b = tg.getBoundingClientRect(); t.style.display = 'block'; t.style.left = (b.left - a.left + Math.min(b.width * .6, 90)) + 'px'; t.style.top = (b.top - a.top + b.height * .55) + 'px'; setTimeout(() => t.classList.add('hit'), 650); } else t.style.display = 'none';
}
const pdNext = () => { const n = PAN[PD.ch].demo.length; pdShow((PD.f + 1) % n); };
const pdPrev = () => { const n = PAN[PD.ch].demo.length; pdShow((PD.f + n - 1) % n); };
function pdToggle() { PD.play = !PD.play; $('pdpl').textContent = PD.play ? '⏸ Jeda' : '▶ Putar'; }

/* ===== Mulai ===== */
async function mulai() {
  DB = Object.assign(blank(), await load() || {}); DB.pref = DB.pref || {}; DB.profil = DB.profil || {}; DB.kw = DB.kw || {}; DB.nomor = DB.nomor || {}; applyKat(); DB.trash = (DB.trash || []).filter(x => Date.now() - x.ts < 30 * 864e5); if (jalankanUlang()) { await save(); setTimeout(() => toast('Transaksi berulang ditambahkan'), 700); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  applyAll(); cekPembuat().then(ok => { CR_OK = ok; if (!ok && !LOCKED) rerender(); });
  if (DB.pin) lock(); else { buildNav(); show(pref('awal', 'dashboard')); }
}
(async function () {
  if (await cekLisensi()) {
    if (await licGerbang()) { await mulai(); licLatar(); document.addEventListener('visibilitychange', async () => { if (document.hidden || LOCKED) return; if (await licJam()) licLatar(); else licBlokir('jam'); }); }
  } else { const lama = await kvGet('lic'); await layarAktivasi(lama ? 'Kunci lama tidak berlaku. Minta kunci baru ke penjual dengan kode perangkat ini.' : ''); }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
