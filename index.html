'Di Beranda, isi kartu Data Trip: Destinasi dan Total Realisasi (total anggaran), lalu ketuk Simpan.':'On Home, fill in the Trip Data card: Destination and Total Actual (total budget), then tap Save.','Buka Menu lalu Tamu untuk mendaftarkan peserta.':'Open Menu then Guests to register participants.','Buka Simulasi untuk menghitung harga jual dan untung sebelum berangkat.':'Open Simulation to work out the selling price and profit before departure.','Selama trip catat uang masuk dan keluar. Setelah selesai, buka Rekap untuk laporan PDF.':'During the trip, record money in and out. Afterwards, open Summary for the PDF report.','Kartu besar menampilkan Sisa saldo = total pemasukan dikurangi pengeluaran.':'The big card shows Remaining balance = total income minus expenses.','Cincin menunjukkan pemakaian anggaran dibanding Total Realisasi. Merah jika lewat 100%.':'The ring shows budget usage compared with Total Actual. Red when over 100%.','Pengingat muncul untuk telat bayar, pendaftar menunggu, checklist belum siap, dan cadangan. Ketuk Buka untuk langsung ke halamannya.':'Reminders appear for late payments, pending registrants, checklist not ready, and backups. Tap Open to jump to the page.','Ketuk ＋ Catat transaksi di Beranda, lalu pilih Pemasukan atau Pengeluaran.':'Tap ＋ Record transaction on Home, then choose Income or Expenses.','Isi Detail, Kategori, Anggaran, Biaya, Quantity, tanggal, dan Dibayar oleh. Totalnya dihitung otomatis.':'Fill in Detail, Category, Budget, Cost, Quantity, date, and Paid by. The total is calculated automatically.','Entri tersimpan di daftar. Gunakan pencarian dan filter, atau ketuk Edit.':'The entry is saved in the list. Use search and filters, or tap Edit.','Menu › Tamu › tombol +. Isi Nama (wajib), Meeting Point, Ponsel, Status, dan Tagihan.':'Menu › Guests › + button. Fill in Name (required), Meeting Point, Phone, Status, and Bill.','Pendaftaran online: bagikan link ke calon peserta lewat WhatsApp.':'Online registration: share the link with prospective participants via WhatsApp.','Ketuk Ambil pendaftar baru saat ada internet, lalu Terima atau Tolak.':'Tap Fetch new registrants when online, then Accept or Decline.','Itinerary: isi Aktivitas, Jenis aktivitas, Waktu mulai dan berakhir, serta Lokasi.':'Itinerary: fill in Activity, Activity type, Start and End time, and Location.','Perlengkapan: Sewa dihitung otomatis dari Kebutuhan dikurangi Kesediaan.':'Gear: Rental is calculated automatically from Needed minus Available.','Checklist: centang barang yang sudah siap.':'Checklist: tick the items that are ready.','Isi jumlah peserta, official, harga jual, dan target untung per official.':'Enter the number of participants, officials, selling price, and profit target per official.','Tambahkan Komponen Biaya. Pilih jenis: per orang, sekali per trip, atau tenda.':'Add Cost Components. Choose a type: per person, once per trip, or tent.','Hasil Simulasi menampilkan untung, margin, dan harga balik modal. Ketuk Terapkan untuk mengisi anggaran.':'The Simulation Result shows profit, margin, and break-even price. Tap Apply to fill the budget.','Ketik hitungan seperti di kalkulator HP. Hasil langsung terlihat sambil mengetik.':'Type a calculation like on a phone calculator. The result shows as you type.','Chip cepat: Salin, ÷ Peserta (bagi dengan jumlah peserta Diterima), dan Bulat (bulatkan ke atas).':'Quick chips: Copy, ÷ Participants (divide by the number of Accepted participants), and Round (round up).','Hitung Trip berisi 7 rumus siap pakai lengkap dengan langkahnya. Riwayat menyimpan hasil =.':'Trip Calculator has 7 ready-made formulas with their steps. History keeps the = results.','Paling atas ada ringkasan: berapa yang sudah terkumpul, jumlah Lunas, Sebagian, Belum bayar, dan Telat.':'At the top is a summary: how much has been collected, and the counts of Paid, Partial, Not paid, and Overdue.','Ketuk ＋ Catat bayar di peserta. Jumlah terisi otomatis sebesar sisa tagihan.':'Tap ＋ Record payment on a participant. The amount is filled in automatically with the remaining bill.','Tambahkan rekening bank dan e-wallet di kartu Cara bayar. Semuanya ikut di tagihan dan kwitansi.':'Add bank accounts and e-wallets on the Payment methods card. They all appear on bills and receipts.','Kwitansi bernomor otomatis, siap dicetak sebagai PDF.':'Receipts are numbered automatically and ready to print as PDF.','Rekap menampilkan pemasukan, pengeluaran, sisa saldo, pemakaian, dan jumlah tamu.':'Summary shows income, expenses, remaining balance, usage, and guest count.','Unduh Laporan Lengkap Trip dalam PDF, atau bagikan ringkasan ke WhatsApp.':'Download the Full Trip Report as PDF, or share the summary to WhatsApp.','Laporan untuk Peserta menunjukkan uang masuk dan penggunaannya tanpa data pribadi.':'The Report for Participants shows money in and how it was used, without personal data.','Tambahkan nama semua official yang ikut.':'Add the names of all officials who join.','Aplikasi menghitung uang yang dikeluarkan tiap official dan bagian adil masing-masing.':'The app calculates the money each official spent and each one\'s fair share.','Daftar transfer menunjukkan siapa membayar siapa. Tandai dibayar setelah selesai.':'The transfer list shows who pays whom. Mark as paid when done.','Buka Menu › Trip & Arsip. Kartu Tutup Buku Trip ada paling atas. Ketik TUTUP lalu ketuk tombolnya.':'Open Menu › Trip & Archive. The Close Trip Books card is at the top. Type TUTUP, then tap its button.','Setelah ditutup, transaksi uang terkunci dan muncul label di Beranda, Masuk, Keluar, dan Pembayaran.':'Once closed, money transactions are locked and a label appears on Home, Income, Expenses, and Payments.','Perlu mengubah sesuatu? Ketik BUKA di kartu yang sama untuk membuka kunci.':'Need to change something? Type BUKA on the same card to unlock.','Buka Menu › Trip & Arsip. Kartu Riwayat Perubahan ada di bawah kartu Tutup Buku. Isi Nama pencatat bila perlu.':'Open Menu › Trip & Archive. The Change History card is below the Close Books card. Fill in the Recorder name if needed.','Tiap transaksi uang yang ditambah, diubah, atau dihapus muncul dengan waktunya. Yang diubah menampilkan nilai sebelum dan sesudah.':'Every money transaction that is added, edited, or deleted appears with its time. Edited ones show the values before and after.','Gunakan filter Tambah, Ubah, Hapus, atau Kunci, lalu ketuk Unduh CSV untuk menyimpannya.':'Use the Add, Edit, Delete, or Lock filters, then tap Download CSV to save it.','Arsipkan trip yang sudah selesai. Data yang berjalan tidak berubah.':'Archive a finished trip. The running data is not changed.','Mulai Trip Baru: ketik BARU untuk konfirmasi. Trip lama diarsipkan otomatis.':'Start New Trip: type BARU to confirm. The old trip is archived automatically.','Salin Trip sebagai Template: itinerary, checklist, dan kategori terbawa ke trip baru. Ketik SALIN untuk konfirmasi.':'Copy Trip as Template: the itinerary, checklist, and categories carry over to the new trip. Type SALIN to confirm.','Cadangkan lewat Drive atau WhatsApp. Pulihkan dari file cadangan di HP baru.':'Back up via Drive or WhatsApp. Restore from the backup file on the new phone.','Tambahkan kategori sendiri untuk pemasukan atau pengeluaran.':'Add your own categories for income or expenses.','Transaksi Berulang dibuat dari pilihan Ulangi otomatis di formulir, dan ditambahkan sendiri saat aplikasi dibuka.':'Recurring Transactions are created from the Repeat automatically option in the form, and are added by themselves when the app opens.','Ketuk kartu profil untuk mengubah nama, tagline, dan logo. Ikon gerigi di kanan judul Akun membuka Pengaturan.':'Tap the profile card to change the name, tagline, and logo. The gear icon to the right of the Account title opens Settings.','Lengkapi Kontak dan Kwitansi: tanda tangan digambar dengan jari, stempel dari foto.':'Complete Contact and Receipt: draw the signature with your finger, add the stamp from a photo.','Data & Cadangan: lihat cadangan terakhir dan cadangkan sekarang.':'Data & Backup: see the last backup and back up now.','Keamanan: aktifkan PIN 4 sampai 8 angka, tambah pola atau sidik jari, simpan kode pemulihan, dan atur kunci otomatis.':'Security: turn on a 4 to 8 digit PIN, add a pattern or fingerprint, save the recovery code, and set auto-lock.','Tampilan: tema, ukuran huruf, dan warna aplikasi (6 pilihan atau warna sendiri).':'Display: theme, font size, and app color (6 choices or your own color).','Pesan tagihan WhatsApp dan pengingat Beranda bisa disesuaikan.':'The WhatsApp bill message and Home reminders can be customized.','Buka Pengaturan › Keamanan. Aktifkan PIN dulu (4 sampai 8 angka). PIN jadi dasar dan cadangan.':'Open Settings › Security. Turn on a PIN first (4 to 8 digits). The PIN is the base and fallback.','Ketuk Cara buka aplikasi. Atur pola 3x3 (minimal 4 titik, gambar dua kali) atau aktifkan sidik jari.':'Tap Ways to open the app. Set a 3x3 pattern (at least 4 dots, draw it twice) or turn on fingerprint.','Saat aplikasi terkunci, sidik jari muncul otomatis. Bisa pindah ke pola atau PIN lewat tombol di bawah kartu.':'When the app is locked, fingerprint appears automatically. You can switch to pattern or PIN with the buttons below the card.','Di HP lama: Menu › Trip & Arsip, lalu bagikan atau unduh cadangan dan simpan ke Drive atau WhatsApp.':'On the old phone: Menu › Trip & Archive, then share or download the backup and save it to Drive or WhatsApp.','Di HP baru: pasang aplikasi. Layar aktivasi menampilkan kode perangkat baru. Ketuk Salin kode perangkat dan kirim ke penjual.':'On the new phone: install the app. The activation screen shows the new device code. Tap Copy device code and send it to the seller.','Tempel kunci aktivasi baru dari penjual (gratis), lalu ketuk Aktifkan.':'Paste the new activation key from the seller (free), then tap Activate.','Setelah aktif, buka Menu › Trip & Arsip › Pulihkan dari cadangan dan pilih file cadangan.':'Once active, open Menu › Trip & Archive › Restore from backup and choose the backup file.','v1.8.2: terjemahan English diperluas ke Pengaturan, lembar, layar aktivasi dan kunci. Pesan WhatsApp tetap Indonesia.':'v1.8.2: English translation extended to Settings, sheets, and the activation and lock screens. WhatsApp messages stay in Indonesian.','v1.8.1: terjemahan English diperluas ke semua tab utama, toast, dan pesan konfirmasi. Panduan dan Yang baru menyusul.':'v1.8.1: English translation extended to all main tabs, toasts, and confirmation messages. Guide and What\'s new follow.','Baru: pilihan Bahasa (Pengaturan › Tampilan): Indonesia atau English. Tahap awal: menu, tab, Pengaturan, tombol, dan pesan utama sudah berbahasa Inggris; teks yang belum diterjemahkan tetap Indonesia. Pesan WhatsApp, kwitansi, dan PDF untuk peserta tetap Indonesia. Panduan dan daftar Yang baru menyusul.':'New: Language option (Settings › Display): Indonesian or English. First stage: menus, tabs, Settings, buttons, and main messages are in English; untranslated text stays in Indonesian. WhatsApp messages, receipts, and PDFs for participants stay in Indonesian. The guide and What\'s new list follow.','Yang baru di v1.8.5':'What\'s new in v1.8.5',
'v1.8.5: daftar Yang baru, pesan hapus/impor, dan sisa teks halaman diterjemahkan ke English.':'v1.8.5: the What\'s new list, delete/import messages, and remaining page text translated to English.',
'Beranda › kartu Data Trip: isi Destinasi, Kode destinasi (dipakai di nomor kwitansi, boleh dikosongkan) dan Total Realisasi, lalu Simpan Data Trip.':'Home › Trip Data card: fill in Destination, Destination code (used in the receipt number, may be left empty) and Total Actual, then Save Trip Data.','Buka Simulasi: isi jumlah peserta, official, harga jual, dan komponen biaya. Lihat untung atau rugi sebelum berangkat, lalu ketuk Terapkan ke Anggaran Pengeluaran.':'Open Simulation: enter the number of participants, officials, selling price, and cost components. See profit or loss before departure, then tap Apply to Expense Budget.','Menu › Tamu: tambahkan peserta, atau pakai Pendaftaran online supaya peserta mengisi sendiri.':'Menu › Guests: add participants, or use Online registration so participants fill in their own details.','Menu › Pembayaran: lihat tagihan dan sisa bayar tiap peserta, kirim tagihan lewat WhatsApp, cetak kwitansi.':'Menu › Payments: see each participant\'s bill and balance, send bills via WhatsApp, print receipts.','Catat uang masuk dan keluar lewat tombol ＋ Catat transaksi di Beranda.':'Record money in and out with the ＋ Record transaction button on Home.','Sebelum berangkat siapkan Itinerary, Perlengkapan, dan Checklist.':'Before departure, prepare the Itinerary, Gear, and Checklist.','Selesai trip: buka Rekap untuk untung atau rugi dan PDF laporan, lalu Bagi Hasil untuk pembagian ke official.':'After the trip: open Summary for profit or loss and the PDF report, then Profit Sharing to split among officials.','Menu › Trip & Arsip: arsipkan trip yang selesai, lalu mulai trip baru.':'Menu › Trip & Archive: archive the finished trip, then start a new trip.','Cadangkan data secara berkala (Akun › Data & Cadangan).':'Back up your data regularly (Account › Data & Backup).','Urutan ini hanya saran. Semua tab bisa dibuka kapan saja dan data lama tetap aman.':'This order is only a suggestion. Every tab can be opened at any time and old data stays safe.','Kartu atas: nama destinasi, Sisa saldo, serta total Pemasukan dan Pengeluaran.':'Top card: destination name, Remaining balance, and total Income and Expenses.','Tombol ＋ Catat transaksi: pilih Pemasukan atau Pengeluaran, formulir langsung terbuka.':'The ＋ Record transaction button: choose Income or Expenses and the form opens right away.','Cincin Pemakaian anggaran membandingkan pengeluaran dengan Total Realisasi.':'The Budget usage ring compares expenses with Total Actual.','Pengingat: telat bayar, pendaftar menunggu, checklist belum siap, dan cadangan. Tiap jenis bisa dimatikan di Pengaturan.':'Reminders: late payments, pending registrants, checklist not ready, and backups. Each type can be turned off in Settings.','Peringatan Anggaran: kuning saat pemakaian 80% atau lebih, merah jika satu kategori melebihi anggarannya atau total melebihi Realisasi.':'Budget Warnings: yellow at 80% usage or more, red if one category exceeds its budget or the total exceeds Actual.','Grafik Pemasukan vs Pengeluaran dan Pengeluaran per Kategori ada di bawahnya.':'The Income vs Expenses and Expenses by Category charts are below.','Kartu Data Trip di paling bawah untuk mengubah destinasi, kode destinasi, dan Total Realisasi.':'The Trip Data card at the very bottom changes the destination, destination code, and Total Actual.','Halaman awal saat aplikasi dibuka bisa diganti di Pengaturan › Perilaku Input.':'The start page when the app opens can be changed in Settings › Input Behavior.','Ketuk ＋ Catat transaksi di Beranda (atau Menu › Masuk / Keluar lalu tombol + bulat).':'Tap ＋ Record transaction on Home (or Menu › Income / Expenses then the round + button).','Isi Detail (wajib), Kategori, Biaya, Tanggal transaksi, Dibayar oleh, dan Catatan. Angka otomatis diberi titik ribuan.':'Fill in Detail (required), Category, Cost, Transaction date, Paid by, and Notes. Numbers automatically get thousand separators.','Khusus Pengeluaran: Anggaran adalah rencana per satuan, Biaya adalah uang nyata per satuan. Total Anggaran dan Total Biaya = nilai × Quantity.':'Expenses only: Budget is the plan per unit, Cost is the real money per unit. Total Budget and Total Cost = value × Quantity.','Bukti nota: ketuk 📷 Kamera atau 📎 Unggah file. Lihat lagi lewat tombol 📎 Bukti.':'Receipt proof: tap 📷 Camera or 📎 Upload file. View it again with the 📎 Proof button.','Dibayar oleh: untuk pemasukan peserta, tulis nama yang sama persis dengan di Tamu supaya status bayarnya terbaca. Untuk pengeluaran, tulis nama official yang menalangi, dipakai di Bagi Hasil.':'Paid by: for participant income, write exactly the same name as in Guests so the payment status is read correctly. For expenses, write the name of the official who advanced the money; it is used in Profit Sharing.','Ulangi otomatis: pilih di formulir untuk transaksi rutin. Ditambahkan sendiri saat aplikasi dibuka.':'Repeat automatically: choose it in the form for regular transactions. They are added by themselves when the app opens.','Daftar di bawah formulir bisa dicari, difilter per kategori atau tanggal, dan diubah lewat Edit.':'The list below the form can be searched, filtered by category or date, and edited with Edit.','Entri yang dihapus masuk Tempat Sampah selama 30 hari (Menu › Trip & Arsip › Pulihkan).':'Deleted entries go to the Trash for 30 days (Menu › Trip & Archive › Restore).','Ekspor CSV atau Impor CSV tersedia di kartu Data.':'Export CSV or Import CSV is available on the Data card.','Pemasukan dengan kategori Peserta dipakai untuk menghitung siapa yang sudah bayar.':'Income with the Participant category is used to work out who has paid.','Kategori Panitia dipakai untuk setoran official, bukan pemasukan trip.':'The Committee category is used for official deposits, not trip income.','Menu › Tamu › tombol + bulat: isi Nama (wajib), Meeting Point, Ponsel, Status (Diterima, Menunggu respons, Ditolak), Tagihan (Lunas, DP, Belum Lunas), Catatan.':'Menu › Guests › round + button: fill in Name (required), Meeting Point, Phone, Status (Accepted, Awaiting response, Declined), Bill (Paid, Deposit, Unpaid), Notes.','Hanya tamu berstatus Diterima yang dihitung sebagai peserta untuk patungan, tagihan, dan statistik.':'Only guests with Accepted status count as participants for the split, bills, and statistics.','Pendaftaran online (Menu › Pendaftaran): pasang apps-script-pendaftaran.gs di Google Apps Script sekali saja, lalu tempel Link web app dan Kunci rahasia, ketuk Simpan.':'Online registration (Menu › Registration): install apps-script-pendaftaran.gs in Google Apps Script just once, then paste the Web app link and Secret key, and tap Save.','Setelah tersimpan muncul Link Pendaftaran. Ketuk Salin link atau Bagikan WA.':'Once saved, the Registration Link appears. Tap Copy link or Share WA.','Saat ada internet ketuk Ambil pendaftar baru. Pendaftar masuk dengan status Menunggu respons.':'When online, tap Fetch new registrants. Registrants come in with Awaiting response status.','Di kartu Menunggu Respons ketuk Terima, Tolak, atau 💬 WA untuk membalas.':'On the Awaiting Response card, tap Accept, Decline, or 💬 WA to reply.','Tamu bisa diimpor atau diekspor dengan CSV, dan dicari lewat kolom pencarian.':'Guests can be imported or exported with CSV, and searched with the search box.','Tulis nama tamu konsisten agar cocok dengan kolom Dibayar oleh di Pemasukan.':'Write guest names consistently so they match the Paid by column in Income.','Itinerary: tambah tiap kegiatan dengan jenis (Mepo - BC sampai SUMMIT) dan waktunya. Kartu Rekap Rundown menyusunnya per hari, bisa jadi PDF atau dibagikan ke WhatsApp.':'Itinerary: add each activity with its type (Mepo - BC to SUMMIT) and time. The Rundown Summary card arranges them by day, and can become a PDF or be shared to WhatsApp.','Perlengkapan: isi Kebutuhan, Kesediaan (yang sudah ada), dan Harga/Unit. Sewa dan Total Sewa terhitung sendiri.':'Gear: fill in Needed, Available (what you already have), and Price/Unit. Rental and Total Rental are calculated automatically.','Di Ringkasan Sewa ketuk ➡️ Masukkan Total Sewa ke Pengeluaran supaya biaya sewa ikut tercatat.':'In the Rental Summary tap ➡️ Add Total Rental to Expenses so the rental cost is recorded.','Checklist: tambah barang dan siapa yang membawa, lalu centang jika siap. Pakai filter untuk melihat yang belum siap saja.':'Checklist: add items and who carries them, then tick when ready. Use the filter to see only items not ready.','Ketuk 📥 Impor barang dari tab Perlengkapan agar tidak mengetik dua kali.':'Tap 📥 Import items from the Gear tab to avoid typing twice.','Rekap Checklist bisa diunduh PDF atau dibagikan ke WhatsApp.':'The Checklist Summary can be downloaded as PDF or shared to WhatsApp.','Checklist yang belum siap muncul sebagai pengingat di Beranda.':'A checklist that is not ready shows as a reminder on Home.','Parameter: nama simulasi, jumlah peserta, jumlah official, harga jual per peserta, target keuntungan per official. Centang Official ikut berangkat jika biayanya ikut ditanggung.':'Parameters: simulation name, number of participants, number of officials, selling price per participant, profit target per official. Tick Officials join the trip if their costs are covered.','Komponen Biaya: Anggaran adalah bagian harga jual yang dibayar peserta, Biaya asli adalah uang yang benar-benar keluar ke pihak lain.':'Cost Components: Budget is the share of the selling price paid by participants, Actual cost is the money that really goes out to other parties.','Hasil Simulasi: pendapatan, total biaya, untung, untung per official, margin, harga balik modal, harga untuk mencapai target, dan peringatan.':'Simulation Result: revenue, total cost, profit, profit per official, margin, break-even price, price to reach the target, and warnings.','Simpan skenario dengan Simpan, buka lagi dengan Muat. Form baru mengosongkan formulir.':'Save a scenario with Save, open it again with Load. New form clears the form.','Terapkan ke Anggaran Pengeluaran: pilih kolom Anggaran diisi biaya asli atau anggaran komponen, opsional isi kolom Biaya, dan atur Total Realisasi.':'Apply to Expense Budget: choose to fill the Budget column with actual cost or component budget, optionally fill the Cost column, and set Total Actual.','Setelah diterapkan, kartu Simulasi vs Kenyataan membandingkan rencana dengan catatan nyata. Kartu yang sama ada di Rekap.':'Once applied, the Simulation vs Reality card compares the plan with real records. The same card is in Summary.','Kalkulator bantu sekarang ada di Menu › Kalkulator.':'The helper calculator is now in Menu › Calculator.','Pembulatan harga jual (Rp1.000, 5.000, atau 10.000) diatur di Pengaturan › Perilaku Input.':'Selling price rounding (Rp1,000, 5,000, or 10,000) is set in Settings › Input Behavior.','Buka Menu › Kalkulator. Tiga mode: Kalkulator, Hitung Trip, dan Riwayat.':'Open Menu › Calculator. Three modes: Calculator, Trip Calculator, and History.','Tombol angka, + − × ÷, koma desimal, dan ⌫ seperti kalkulator HP. AC menghapus semua.':'Number keys, + − × ÷, decimal comma, and ⌫ work like a phone calculator. AC clears everything.','Tombol ( ) pintar: menaruh kurung buka lalu kurung tutup sesuai kebutuhan.':'The smart ( ) key puts an opening bracket and then a closing bracket as needed.','Persen menyesuaikan angka di depannya: 200 + 10% = 220, 200 × 10% = 20, 50% = 0,5.':'Percent adjusts the number before it: 200 + 10% = 220, 200 × 10% = 20, 50% = 0.5.','Ketuk = untuk menyimpan hitungan ke Riwayat. Hasil bisa dilanjutkan dengan operator berikutnya.':'Tap = to save the calculation to History. The result can be continued with the next operator.','Angka bulat 1.000 ke atas otomatis dieja di bawah hasil (terbilang).':'Whole numbers of 1,000 and above are spelled out below the result automatically.','Chip 📋 Salin menyalin hasil. 👥 ÷ Peserta membagi hasil dengan jumlah peserta Diterima. ⬆ Bulat membulatkan ke atas sesuai Pengaturan.':'The 📋 Copy chip copies the result. 👥 ÷ Participants divides the result by the number of Accepted participants. ⬆ Round rounds up according to Settings.','Memori: M+ dan M− menambah atau mengurangi, MR memanggil, MC menghapus.':'Memory: M+ and M− add or subtract, MR recalls, MC clears.','Hitung Trip: Patungan per orang, Harga jual dari target untung, Balik modal, DP dan sisa, Selisih dan persen, Diskon dan PPN, Konversi mata uang. Ketuk Salin hasil untuk membagikannya.':'Trip Calculator: Split per person, Selling price from profit target, Break-even, Deposit and balance, Difference and percent, Discount and VAT, Currency conversion. Tap Copy result to share it.','Riwayat: ketuk satu baris untuk memakai lagi hasilnya.':'History: tap a row to reuse its result.','Di komputer, keyboard juga bisa dipakai: angka, operator, Enter, Backspace, Esc.':'On a computer, the keyboard also works: digits, operators, Enter, Backspace, Esc.','Menu › Pembayaran. Ringkasan di atas menunjukkan jumlah terkumpul, status tiap peserta, dan tenggat.':'Menu › Payments. The summary at the top shows the amount collected, each participant\'s status, and the deadline.','Tagihan per orang diambil dengan urutan: tagihan tetap, lalu harga jual simulasi, lalu Total Realisasi dibagi peserta Diterima. Ketuk Ubah di baris Tagihan per orang untuk melihat hitungan lain.':'The bill per person is taken in this order: fixed bill, then simulation selling price, then Total Actual divided by Accepted participants. Tap Edit on the Bill per person row to see another calculation.','Cari peserta lewat kotak pencarian, atau saring dengan Belum lunas, Sebagian, Lunas, dan Telat.':'Find a participant with the search box, or filter by Unpaid, Partial, Paid, and Overdue.','Ketuk ＋ Catat bayar, cek jumlah, pilih Dibayar lewat, lalu Simpan. Pembayaran tersimpan sebagai Pemasukan kategori Peserta dan bisa diubah atau dihapus di Menu › Masuk.':'Tap ＋ Record payment, check the amount, choose Paid via, then Save. The payment is saved as Income in the Participant category and can be edited or deleted in Menu › Income.','Buka kartu Cara bayar untuk menambah rekening bank dan e-wallet (nama bebas, mis. OVO atau LinkAja). Ketuk Salin nomor untuk menyalin. Matikan Aktif bila tidak ingin tampil.':'Open the Payment methods card to add bank accounts and e-wallets (free name, e.g. OVO or LinkAja). Tap Copy number to copy. Turn off Active if you don\'t want it shown.','Ketuk 💬 Tagih untuk mengirim pesan WhatsApp berisi total, yang sudah dibayar, sisa, tenggat, dan semua cara bayar aktif. Tagih berikutnya membuka peserta yang belum ditagih satu per satu. Isi pesan bisa diubah di Pengaturan › Pesan tagihan.':'Tap 💬 Bill to send a WhatsApp message with the total, amount paid, balance, deadline, and all active payment methods. Bill next opens participants not yet billed one by one. The message text can be changed in Settings › Bill message.','Bagikan › Kartu cara bayar (PDF) atau Cara bayar ke grup WhatsApp untuk memberi tahu semua peserta sekaligus.':'Share › Payment info card (PDF) or Payment info to WhatsApp group to inform all participants at once.','Ketuk 🧾 Kwitansi untuk membuat kwitansi. Nomor berformat KW/kode penyelenggara/kode destinasi/tahun/urut. Cetak ulang dengan jumlah bayar yang sama memakai nomor yang sama.':'Tap 🧾 Receipt to create a receipt. The number format is KW/organizer code/destination code/year/sequence. Reprinting with the same payment amount uses the same number.','Tanda tangan, stempel, nama penanda tangan, dan kode penyelenggara diatur di Akun › Kwitansi.':'Signature, stamp, signer name, and organizer code are set in Account › Receipt.','Rugi tidak ditagihkan ke peserta. Tagihan peserta tidak pernah dihitung dari biaya aktual.':'Losses are not billed to participants. Participant bills are never calculated from actual cost.','Di dialog cetak HP, pilih Simpan sebagai PDF. PDF selalu bertema terang.':'In the phone print dialog, choose Save as PDF. PDFs always use the light theme.','WhatsApp tidak bisa mengirim pesan massal otomatis, jadi tagihan dikirim satu per satu.':'WhatsApp cannot send automatic bulk messages, so bills are sent one by one.','Buka tab Rekap di navigasi bawah.':'Open the Summary tab in the bottom navigation.','Kartu Rekapitulasi: total pemasukan, pengeluaran, sisa saldo, pemakaian, tamu diterima, dan tagihan atau patungan per orang, plus peringatan anggaran.':'Summary card: total income, expenses, remaining balance, usage, accepted guests, and bill or split per person, plus budget warnings.','Ketuk 📄 Unduh Laporan Lengkap Trip (PDF). Dialog cetak terbuka, pilih Simpan sebagai PDF.':'Tap 📄 Download Full Trip Report (PDF). The print dialog opens, choose Save as PDF.','Ketuk 💬 Bagikan ringkasan ke WhatsApp untuk mengirim ringkasan teks.':'Tap 💬 Share summary to WhatsApp to send a text summary.','Kartu Laporan untuk Peserta berisi uang masuk dan pemakaiannya, aman dibagikan karena tanpa data pribadi.':'The Report for Participants card shows money in and its usage, safe to share because it has no personal data.','Simulasi vs Kenyataan muncul jika simulasi sudah diterapkan.':'Simulation vs Reality appears once a simulation has been applied.','Tabel pemasukan dan pengeluaran per kategori serta perlengkapan disewa ada di bawahnya.':'Tables of income and expenses by category and rented gear are below.','Statistik Antar-Trip membandingkan trip yang sudah diarsipkan: untung, rugi, biaya per peserta.':'Cross-Trip Statistics compares archived trips: profit, loss, cost per participant.','Semua PDF memakai tema terang walau aplikasi sedang mode gelap.':'All PDFs use the light theme even when the app is in dark mode.','Menu › Bagi Hasil. Kartu Hasil Trip menunjukkan UNTUNG atau RUGI. Setoran kategori Panitia tidak dihitung sebagai pemasukan agar rugi tidak tertutupi.':'Menu › Profit Sharing. The Trip Result card shows PROFIT or LOSS. Deposits in the Committee category are not counted as income so a loss is not hidden.','Tambahkan nama official di kartu Official / Panitia.':'Add official names on the Officials / Committee card.','Isi kolom Dibayar oleh di Pengeluaran dengan nama official yang menalangi. Itu masuk ke Uang yang Dikeluarkan Tiap Official.':'Fill the Paid by column in Expenses with the name of the official who advanced the money. It goes into Money Spent by Each Official.','Pemakaian Kas untuk Pribadi: catat uang kas yang terpakai untuk keperluan pribadi official. Itu bukan biaya trip dan harus dikembalikan.':'Cash Used for Personal Purposes: record cash that was used for an official\'s personal needs. It is not a trip cost and must be paid back.','Penyelesaian menampilkan bagian adil tiap official, selisihnya, dan daftar transfer. Ketuk Tandai dibayar setelah transfer.':'Settlement shows each official\'s fair share, the difference, and the transfer list. Tap Mark as paid after transferring.','Ketuk 💬 Kirim rincian untuk mengirim rincian ke tiap official, atau 💬 Bagikan ke grup official.':'Tap 💬 Send details to send the breakdown to each official, or 💬 Share to officials group.','Ketuk 📄 Unduh PDF Bagi Hasil untuk dokumennya.':'Tap 📄 Download Profit Sharing PDF for the document.','Jika trip rugi, kerugian dibagi ke official dan tidak ditagihkan ke peserta.':'If the trip makes a loss, the loss is shared among officials and not billed to participants.','Menu › Trip & Arsip › kartu Tutup Buku Trip. Ketik TUTUP, ketuk Tutup buku trip, lalu konfirmasi.':'Menu › Trip & Archive › Close Trip Books card. Type TUTUP, tap Close trip books, then confirm.','Sebelum dikunci, aplikasi membuat arsip cadangan otomatis (lihat Daftar Arsip).':'Before locking, the app creates a backup archive automatically (see Archive List).','Terkunci: tambah, ubah, hapus, dan impor Pemasukan dan Pengeluaran; Catat bayar; Catat penggantian Talangan; transaksi berulang; terapkan simulasi; masukkan sewa ke Pengeluaran; pulihkan transaksi dari tempat sampah.':'Locked: add, edit, delete, and import Income and Expenses; Record payment; Record advance repayment; recurring transactions; apply simulation; add rental to Expenses; restore transactions from the trash.','Tetap bebas: Tamu, Itinerary, Perlengkapan, Checklist, kwitansi dan PDF, Rekap, arsip, dan cadangan.':'Still free: Guests, Itinerary, Gear, Checklist, receipts and PDFs, Summary, archive, and backup.','Buka kunci: ketik BUKA di kartu yang sama. Aplikasi mencatat berapa kali kunci pernah dibuka.':'Unlock: type BUKA on the same card. The app records how many times the books have been unlocked.','Mulai Trip Baru dan Salin Trip sebagai Template membuat trip baru yang terbuka.':'Start New Trip and Copy Trip as Template create a new open trip.','Tutup buku setelah bagi hasil dan penyelesaian official selesai, supaya laporan PDF tidak berubah.':'Close the books after profit sharing and official settlement are done, so the PDF report does not change.','Menu › Trip & Arsip › kartu Riwayat Perubahan.':'Menu › Trip & Archive › Change History card.','Isi Nama pencatat bila beberapa panitia memakai HP yang sama. Nama ini ditulis di setiap catatan baru. Aplikasi tidak punya login, jadi nama hanya sebagai penanda.':'Fill in Recorder name if several committee members use the same phone. This name is written on every new record. The app has no login, so the name is only a marker.','Dicatat: tambah, ubah (nilai sebelum dan sesudah), hapus, dan pulihkan transaksi Pemasukan dan Pengeluaran; Catat bayar; transaksi berulang; terapkan simulasi; sewa ke Pengeluaran; impor CSV; penggantian Talangan; tutup dan buka kunci buku trip.':'Recorded: add, edit (values before and after), delete, and restore of Income and Expense transactions; Record payment; recurring transactions; apply simulation; rental to Expenses; CSV import; advance repayment; closing and unlocking the trip books.','Ketuk filter Semua, Tambah, Ubah, Hapus, atau Kunci. Ketuk Tampilkan lebih banyak untuk entri lama.':'Tap the All, Add, Edit, Delete, or Lock filter. Tap Show more for older entries.','Ketuk Unduh CSV untuk menyimpan seluruh riwayat. Ketuk Kosongkan untuk menghapus riwayat; ini tidak bisa dilakukan saat buku trip ditutup.':'Tap Download CSV to save the whole history. Tap Clear to delete the history; this cannot be done while the trip books are closed.','Riwayat disimpan di HP ini, ikut cadangan dan arsip, dan dikosongkan saat Mulai Trip Baru. Maksimal 1.000 entri terbaru.':'The history is stored on this phone, included in backups and archives, and cleared on Start New Trip. Maximum 1,000 latest entries.','Menu › Trip & Arsip › 🗂️ Arsipkan sekarang menyimpan salinan trip ke daftar arsip.':'Menu › Trip & Archive › 🗂️ Archive now saves a copy of the trip to the archive list.','Mulai Trip Baru mengosongkan tamu, transaksi, itinerary, perlengkapan, checklist, dan simulasi. Isi destinasi baru (opsional), ketik BARU, lalu ketuk tombolnya.':'Start New Trip clears guests, transactions, itinerary, gear, checklist, and simulation. Enter a new destination (optional), type BARU, then tap its button.','Salin Trip sebagai Template: untuk trip serupa (mis. gunung yang sama). Itinerary, checklist (semua belum siap, tanpa nama pembawa), dan kategori ikut terbawa; tamu, pemasukan, pengeluaran, perlengkapan, dan simulasi kosong. Isi Tanggal mulai agar tanggal itinerary bergeser otomatis (jam tetap); bila dikosongkan, tanggal dan jam itinerary dikosongkan. Ketik SALIN, lalu ketuk tombolnya. Trip lama diarsipkan otomatis.':'Copy Trip as Template: for a similar trip (e.g. the same mountain). The itinerary, checklist (all not ready, without carrier names), and categories carry over; guests, income, expenses, gear, and simulation are empty. Fill in Start date so the itinerary dates shift automatically (times stay); if left empty, itinerary dates and times are cleared. Type SALIN, then tap its button. The old trip is archived automatically.','Daftar Arsip: ketuk Buka untuk menjadikan arsip sebagai data aktif, atau Unduh untuk menyimpannya.':'Archive List: tap Open to make an archive the active data, or Download to save it.','Tempat Sampah menyimpan entri yang dihapus selama 30 hari. Ketuk Pulihkan untuk mengembalikan.':'The Trash keeps deleted entries for 30 days. Tap Restore to bring them back.','Cadangan Data: 📤 Bagikan cadangan (Drive atau WhatsApp), atau ⬇️ Unduh cadangan (JSON).':'Data Backup: 📤 Share backup (Drive or WhatsApp), or ⬇️ Download backup (JSON).','⬆️ Pulihkan dari cadangan akan MENIMPA data saat ini, jadi cadangkan dulu bila ragu.':'⬆️ Restore from backup will OVERWRITE current data, so back up first if unsure.','Reset Total menghapus semua dan tidak bisa dibatalkan.':'Total Reset deletes everything and cannot be undone.','Cadangkan sebelum ganti HP, uninstall aplikasi, atau menghapus data browser.':'Back up before changing phones, uninstalling the app, or clearing browser data.','Menu › Kategori: ketik nama di Tambah kategori lalu ketuk Tambah. Ketuk ✕ untuk menghapus. Kategori Peserta pada pemasukan terkunci 🔒.':'Menu › Categories: type a name in Add category then tap Add. Tap ✕ to delete. The Participant category on income is locked 🔒.','Transaksi Berulang: saat mencatat transaksi pilih Ulangi otomatis dan isi jarak harinya.':'Recurring Transactions: when recording a transaction choose Repeat automatically and fill in the interval in days.','Daftar transaksi berulang beserta jadwal berikutnya ada di bawah kartu kategori, bisa dihentikan kapan saja.':'The list of recurring transactions with their next schedule is below the category card, and can be stopped at any time.','Kategori baru langsung muncul di pilihan formulir dan di Rekap.':'A new category appears right away in the form options and in Summary.','Kartu profil: ketuk untuk mengubah nama, tagline, dan logo yang dipakai di kop dokumen.':'Profile card: tap to change the name, tagline, and logo used in the document header.','Strip Pengaturan di bagian bawah kartu profil memperlihatkan ringkasan PIN, tema, dan warna. Ketuk untuk membuka Pengaturan.':'The Settings strip at the bottom of the profile card shows a summary of PIN, theme, and color. Tap to open Settings.','Kontak: WhatsApp, Instagram, Email, Kota atau alamat. Dipakai di kop PDF.':'Contact: WhatsApp, Instagram, Email, City or address. Used in the PDF header.','Kwitansi: nama dan jabatan penanda tangan, tanda tangan (gambar dengan jari), stempel (foto), dan kode penyelenggara untuk nomor kwitansi.':'Receipt: signer name and title, signature (draw with a finger), stamp (photo), and organizer code for the receipt number.','Data & Cadangan: lihat kapan terakhir dicadangkan dan cadangkan sekarang.':'Data & Backup: see when you last backed up and back up now.','Lisensi: status aktif dan kode perangkat. Ketuk Salin bila diminta pembuat.':'License: active status and device code. Tap Copy when the creator asks for it.','Tentang Pembuat: tombol Instagram dan WhatsApp pembuat aplikasi. Bagian ini dilindungi.':'About the Creator: the creator\'s Instagram and WhatsApp buttons. This section is protected.','Isi Kontak dan penanda tangan dulu supaya kop dan kwitansi PDF langsung rapi.':'Fill in Contact and the signer first so the PDF header and receipts look tidy right away.','Buka dari Akun › ikon gerigi di kanan judul.':'Open from Account › the gear icon to the right of the title.','PIN aplikasi: isi 4 sampai 8 angka. Kode pemulihan (XXXX-XXXX) dibuat otomatis, simpan baik-baik untuk fitur Lupa PIN.':'App PIN: enter 4 to 8 digits. The recovery code (XXXX-XXXX) is created automatically, keep it safe for the Forgot PIN feature.','Cara buka aplikasi (muncul setelah PIN aktif): Atur pola 3x3 (minimal 4 titik, gambar dua kali) atau Aktifkan sidik jari. Mengubahnya meminta PIN. PIN tetap bisa dipakai kapan saja lewat tombol Pakai PIN di layar kunci.':'Ways to open the app (appears once the PIN is active): Set a 3x3 pattern (at least 4 dots, draw it twice) or Turn on fingerprint. Changing it asks for the PIN. The PIN can always be used with the Use PIN button on the lock screen.','Pola salah 5 kali berturut-turut menunggu 30 detik. Lupa PIN lewat kode pemulihan mematikan PIN, pola, dan sidik jari sekaligus.':'A wrong pattern 5 times in a row waits 30 seconds. Forgot PIN via the recovery code turns off the PIN, pattern, and fingerprint at once.','Kunci otomatis: Langsung, 1, 5, 15 menit, atau Tidak pernah.':'Auto-lock: Immediately, 1, 5, 15 minutes, or Never.','Mode privasi menyamarkan nominal Rp di layar. PDF tetap menampilkan angka asli.':'Privacy mode hides Rp amounts on screen. PDFs still show the real numbers.','Tampilan: tema Gelap, Terang, atau Ikuti HP; latar foto; ukuran huruf S, M, L; warna aplikasi.':'Display: Dark, Light, or Follow phone theme; background photo; font size S, M, L; app color.','Perilaku Input: halaman awal, konfirmasi sebelum hapus, getar saat simpan, dan pembulatan harga jual.':'Input Behavior: start page, confirm before delete, vibrate on save, and selling price rounding.','Pesan WhatsApp: ubah isi pesan tagihan dengan kata kunci seperti {nama}, {sisa}, {tenggat}.':'WhatsApp message: change the bill message text with keywords like {nama}, {sisa}, {tenggat}.','Pengingat Beranda: pilih jenis pengingat dan seberapa sering diingatkan mencadangkan data.':'Home Reminders: choose the reminder types and how often you are reminded to back up.','Penyimpanan: minta penyimpanan permanen agar data tidak dibersihkan sistem.':'Storage: request persistent storage so the data is not cleaned up by the system.','Tentang & Bantuan: Cek pembaruan aplikasi, Yang baru, dan Salin info perangkat.':'About & Help: Check for app updates, What\'s new, and Copy device info.','Reset pengaturan saja tidak menghapus data trip. Hapus semua data memerlukan ketikan HAPUS.':'Reset settings only does not delete trip data. Delete all data requires typing HAPUS.','Warna aplikasi hanya mengubah tampilan di layar. PDF tetap tema terang dan logo tidak berubah.':'App color only changes the on-screen look. PDFs stay in the light theme and the logo does not change.','Pengaturan › Keamanan › PIN aplikasi: isi 4 sampai 8 angka, lalu simpan kode pemulihan yang muncul.':'Settings › Security › App PIN: enter 4 to 8 digits, then save the recovery code that appears.','Cara buka aplikasi (muncul setelah PIN aktif): Atur pola, atau Aktifkan sidik jari. Mengubahnya selalu meminta PIN.':'Ways to open the app (appears once the PIN is active): Set pattern, or Turn on fingerprint. Changing it always asks for the PIN.','Pola: minimal 4 titik, gambar dua kali sampai sama. Salah 5 kali berturut-turut, tunggu 30 detik.':'Pattern: at least 4 dots, draw it twice until it matches. Wrong 5 times in a row, wait 30 seconds.','Sidik jari memakai sidik jari yang sudah terdaftar di HP Anda dan bergantung pada HP. Bila tidak didukung, tulisannya "Tidak didukung di perangkat ini" dan pola atau PIN tetap bisa dipakai.':'Fingerprint uses the fingerprints already registered on your phone and depends on the phone. If unsupported, it says "Not supported on this device" and the pattern or PIN can still be used.','Layar kunci memilih cara terakhir yang aktif: sidik jari, lalu pola, lalu PIN. Tombol di bawah kartu untuk berpindah.':'The lock screen picks the last active method: fingerprint, then pattern, then PIN. Buttons below the card switch between them.','Mematikan satu cara: Cara buka aplikasi › Matikan pola atau Matikan sidik jari.':'To turn off one method: Ways to open the app › Turn off pattern or Turn off fingerprint.','Tidak mau dikunci sama sekali: Pengaturan › Keamanan › Matikan semua kunci, masukkan PIN, lalu konfirmasi. PIN, pola, dan sidik jari mati sekaligus.':'If you don\'t want any lock: Settings › Security › Turn off all locks, enter the PIN, then confirm. PIN, pattern, and fingerprint turn off at once.','Lupa PIN: ketuk Lupa PIN? di layar kunci dan masukkan kode pemulihan. Ini juga mematikan pola dan sidik jari.':'Forgot PIN: tap Forgot PIN? on the lock screen and enter the recovery code. This also turns off the pattern and fingerprint.','Cadangan membawa pola, tetapi sidik jari harus didaftarkan ulang di HP baru.':'A backup carries the pattern, but the fingerprint must be registered again on the new phone.','Pola dan sidik jari hanya gerbang di layar, bukan enkripsi data. Tetap simpan kode pemulihan PIN di tempat aman.':'Pattern and fingerprint are only a screen gate, not data encryption. Still keep the PIN recovery code somewhere safe.','Kunci otomatis (Langsung sampai 15 menit) mengatur kapan aplikasi terkunci lagi setelah ditinggalkan.':'Auto-lock (Immediately to 15 minutes) sets when the app locks again after you leave it.','Di HP lama: Menu › Trip & Arsip › Bagikan cadangan (Drive / WhatsApp) atau Unduh cadangan (JSON). Pastikan file cadangan tersimpan di tempat yang bisa dibuka dari HP baru.':'On the old phone: Menu › Trip & Archive › Share backup (Drive / WhatsApp) or Download backup (JSON). Make sure the backup file is saved somewhere that can be opened from the new phone.','Di HP baru: pasang aplikasi. Setiap HP punya kode perangkat sendiri (BU-XXXX-XXXX), jadi aplikasi meminta aktivasi.':'On the new phone: install the app. Every phone has its own device code (BU-XXXX-XXXX), so the app asks for activation.','Ketuk Salin kode perangkat dan kirim kodenya ke penjual. Aktivasi ulang karena ganti HP gratis.':'Tap Copy device code and send it to the seller. Reactivation because of a phone change is free.','Tempel kunci aktivasi baru dari penjual, lalu ketuk Aktifkan.':'Paste the new activation key from the seller, then tap Activate.','Setelah aplikasi aktif: Menu › Trip & Arsip › Pulihkan dari cadangan, pilih file cadangan, lalu konfirmasi. Data di HP baru akan ditimpa isi cadangan.':'Once the app is active: Menu › Trip & Archive › Restore from backup, choose the backup file, then confirm. Data on the new phone will be overwritten by the backup.','Lisensi tidak ikut cadangan dan tidak tersentuh saat memulihkan, jadi aktivasi di HP baru tetap aman.':'The license is not part of the backup and is untouched when restoring, so activation on the new phone stays safe.','Bila HP baru dipulihkan otomatis oleh akun Google (cadangan Android), data dan lisensi bisa ikut kembali tanpa aktivasi. Itu wajar. Bila tidak, ikuti langkah di atas.':'If the new phone is restored automatically by a Google account (Android backup), data and license may come back without activation. That is normal. If not, follow the steps above.','Cadangkan dulu sebelum menyerahkan atau mereset HP lama.':'Back up first before handing over or resetting the old phone.','Kunci aktivasi hanya cocok untuk satu HP. Jangan dibagikan ke orang lain.':'An activation key only fits one phone. Do not share it with others.','Data hilang? Data hanya tersimpan di HP ini. Menghapus data aplikasi atau browser ikut menghapusnya, jadi cadangkan rutin (Akun › Data & Cadangan).':'Data lost? Data is stored only on this phone. Clearing app or browser data deletes it too, so back up regularly (Account › Data & Backup).','Ganti HP: cadangkan di HP lama, lalu di HP baru buka Menu › Trip & Arsip › Pulihkan dari cadangan. Lisensi disimpan terpisah dari cadangan.':'Changing phones: back up on the old phone, then on the new phone open Menu › Trip & Archive › Restore from backup. The license is stored separately from the backup.','Lupa PIN: di layar kunci ketuk Lupa PIN? dan masukkan kode pemulihan. Jika tidak punya kodenya, pulihkan lewat file cadangan.':'Forgot PIN: on the lock screen tap Forgot PIN? and enter the recovery code. If you don\'t have the code, restore from a backup file.','Tampilan belum berubah setelah update: Pengaturan › Tentang & Bantuan › Cek pembaruan aplikasi, lalu Muat ulang. Bila perlu tutup aplikasi sepenuhnya dan buka lagi.':'Display has not changed after an update: Settings › About & Help › Check for app updates, then Reload. If needed, close the app completely and open it again.','PDF tidak muncul: dialog cetak harus dibuka. Pilih Simpan sebagai PDF. Jika tombol PDF terkunci, pasang ulang aplikasi asli.':'PDF doesn\'t appear: the print dialog must open. Choose Save as PDF. If the PDF button is locked, reinstall the original app.','Status bayar peserta salah: pastikan nama di kolom Dibayar oleh sama dengan nama di Tamu dan kategori pemasukannya Peserta.':'Participant payment status is wrong: make sure the name in the Paid by column matches the name in Guests and the income category is Participant.','Nominal tampil Rp •••: mode privasi aktif. Matikan di Pengaturan › Keamanan.':'Amounts show Rp •••: privacy mode is on. Turn it off in Settings › Security.','Salah menghapus entri: buka Menu › Trip & Arsip › Tempat Sampah dalam 30 hari dan ketuk Pulihkan.':'Deleted an entry by mistake: open Menu › Trip & Archive › Trash within 30 days and tap Restore.','Pilih topik. Setiap topik punya demo bergerak, langkah rinci, dan tips. Semua jalan tanpa internet.':'Choose a topic. Each topic has an animated demo, detailed steps, and tips. Everything works offline.',
'v1.8.4: langkah rinci dan tips Panduan kini tersedia dalam English.':'v1.8.4: Panduan detailed steps and tips are now available in English.','v1.8.3: tanggal mengikuti bahasa dan demo Panduan diterjemahkan ke English. Langkah rinci Panduan menyusul.':'v1.8.3: dates follow the language and the Guide demos are translated to English. The Guide\'s detailed steps follow.','Baru: tombol Matikan semua kunci (Pengaturan › Keamanan) mematikan PIN, pola, dan sidik jari sekaligus setelah konfirmasi PIN. Baru juga panduan Keamanan buka aplikasi (Menu › Panduan).':'New: the Turn off all locks button (Settings › Security) turns off PIN, pattern, and fingerprint at once after PIN confirmation. Also new is the App unlock security guide (Menu › Guide).','Layar kunci didesain ulang: tanpa header, dengan logo besar bercahaya, kartu kaca, pola dan sidik jari lebih jelas, serta tombol pindah cara buka berbentuk pil. Cara kerjanya tidak berubah.':'The lock screen was redesigned: no header, a large glowing logo, a glass card, clearer pattern and fingerprint, and pill-shaped buttons to switch unlock methods. How it works is unchanged.','Baru: Cara buka aplikasi (Pengaturan › Keamanan). Selain PIN, buka dengan pola 3x3 atau sidik jari. PIN tetap jadi cadangan dan dipakai untuk mengatur. Pola salah 5 kali menunggu 30 detik. Sidik jari bergantung HP dan belum tentu jalan di semua perangkat; bila tidak didukung, opsinya tidak muncul. Cadangan membawa pola, sidik jari didaftarkan ulang.':'New: Ways to open the app (Settings › Security). Besides the PIN, open with a 3x3 pattern or fingerprint. The PIN stays as the fallback and is used for settings. A wrong pattern 5 times waits 30 seconds. Fingerprint depends on the phone and may not work on every device; if unsupported, the option does not appear. Backups carry the pattern, fingerprints are registered again.','Baru: Riwayat perubahan (Menu › Trip & Arsip, di bawah kartu Tutup Buku). Setiap transaksi uang yang ditambah, diubah (nilai sebelum dan sesudah), dihapus, atau dipulihkan dicatat dengan waktunya, begitu juga saat buku trip ditutup dan dibuka. Isi Nama pencatat bila beberapa panitia memakai HP yang sama. Bisa difilter dan diunduh sebagai CSV. Perubahan sebelum v1.6.0 tidak punya riwayat.':'New: Change history (Menu › Trip & Archive, below the Close Books card). Every money transaction that is added, edited (values before and after), deleted, or restored is recorded with its time, and so is closing and opening the trip books. Fill in Recorder name if several committee members use the same phone. It can be filtered and downloaded as CSV. Changes before v1.6.0 have no history.','Baru: Tutup buku trip (Menu › Trip & Arsip). Setelah trip selesai, transaksi uang dikunci: Pemasukan, Pengeluaran, Catat bayar, penggantian Talangan, transaksi berulang, simulasi dan sewa yang masuk ke Pengeluaran. Arsip cadangan dibuat otomatis, dan kunci hanya bisa dibuka dengan mengetik BUKA. Tamu, Itinerary, Checklist, kwitansi, PDF, dan Rekap tetap bebas.':'New: Close trip books (Menu › Trip & Archive). After the trip is done, money transactions are locked: Income, Expenses, Record payment, advance repayment, recurring transactions, simulation and rental going into Expenses. A backup archive is created automatically, and the lock can only be opened by typing BUKA. Guests, Itinerary, Checklist, receipts, PDFs, and Summary stay free.','Tab Pembayaran dirombak. Paling atas ringkasan (terkumpul dari target, jumlah Lunas/Sebagian/Belum bayar/Telat, tenggat), lalu daftar peserta dengan pencarian dan filter. Tombol ＋ Catat bayar di tiap peserta mengisi sisa tagihan otomatis dan menyimpannya sebagai Pemasukan kategori Peserta. Tombol Tagih berikutnya membuka WhatsApp peserta yang belum ditagih satu per satu. Pengaturan cara bayar dan tagihan dilipat di bawah. Data lama aman.':'The Payments tab was reworked. At the top is a summary (collected against target, count of Paid/Partial/Not paid/Overdue, deadline), then the participant list with search and filters. The ＋ Record payment button on each participant fills in the remaining bill automatically and saves it as Income in the Participant category. The Bill next button opens WhatsApp for participants not yet billed, one by one. Payment method and bill settings are folded below. Old data is safe.','Cara bayar kini berupa daftar: beberapa rekening bank dan e-wallet (DANA, SeaBank, ShopeePay, GoPay, OVO, LinkAja, atau nama lain), tombol Salin nomor, serta sakelar aktif. Semua yang aktif ikut di pesan tagihan WhatsApp, kwitansi, dan kata kunci {rekening}. Teks rekening lama tetap dipakai sebagai catatan.':'Payment methods are now a list: several bank accounts and e-wallets (DANA, SeaBank, ShopeePay, GoPay, OVO, LinkAja, or another name), a Copy number button, and an active switch. All active ones appear in the WhatsApp bill message, receipts, and the {rekening} keyword. The old account text is still used as a note.','Baru: Kartu cara bayar (PDF) dan Cara bayar ke grup WhatsApp, berisi semua rekening, e-wallet, QRIS, dan tenggat. Dasar hitung tagihan disederhanakan jadi satu baris (ketuk Ubah); aturan hitungnya tidak berubah.':'New: Payment info card (PDF) and Payment info to WhatsApp group, containing all accounts, e-wallets, QRIS, and the deadline. The bill calculation basis was simplified into one row (tap Edit); the calculation rules are unchanged.','Formulir pendaftaran online disederhanakan: Nama, Nomor WhatsApp, Meeting point, Alergi makanan (Ya/Tidak), dan Catatan. Golongan darah, riwayat penyakit, dan kontak darurat tidak lagi diminta. Pendaftar dengan alergi ditandai "Alergi makanan: Ya" di Catatan tamu. Data tamu lama tidak diubah. Pasang ulang skrip Apps Script pendaftaran yang baru.':'The online registration form was simplified: Name, WhatsApp number, Meeting point, Food allergy (Yes/No), and Notes. Blood type, medical history, and emergency contact are no longer asked. Registrants with an allergy are marked "Alergi makanan: Ya" in the guest Notes. Old guest data is unchanged. Reinstall the new registration Apps Script.','Baru: Menu › Trip & Arsip › Salin Trip sebagai Template. Trip baru langsung berisi itinerary, checklist (belum siap, tanpa pembawa), dan kategori dari trip sebelumnya; tamu dan uang kosong. Tanggal itinerary bisa digeser otomatis.':'New: Menu › Trip & Archive › Copy Trip as Template. The new trip starts with the itinerary, checklist (not ready, no carriers), and categories from the previous trip; guests and money are empty. Itinerary dates can shift automatically.','Baru: Pengaturan › Tentang & Bantuan › Lapor masalah. Membuka WhatsApp penjual dengan info teknis siap kirim (versi, kode perangkat, status lisensi, perangkat), tanpa data trip, peserta, atau uang. Terkirim hanya bila Anda menekan kirim di WhatsApp.':'New: Settings › About & Help › Report a problem. Opens the seller\'s WhatsApp with technical info ready to send (version, device code, license status, device), without trip, participant, or money data. It is sent only when you press send in WhatsApp.','Baru: panduan Pindah ke HP baru (Menu › Panduan).':'New: Move to a new phone guide (Menu › Guide).','Kartu Ringkasan di Akun dihapus.':'The Summary card in Account was removed.','Perbaikan: angka 0 di depan nomor WhatsApp tidak lagi hilang (tagihan WA, daftar Tamu, dan impor pendaftar online). Data lama tidak diubah.':'Fix: the leading 0 in WhatsApp numbers is no longer lost (WA bills, Guest list, and online registrant import). Old data is unchanged.','Penomoran versi dimulai ulang dari v1.0.0. Tidak ada perubahan fitur.':'Version numbering restarted from v1.0.0. No feature changes.','Keamanan lisensi: aplikasi memeriksa status lisensi ke server (otomatis maks. tiap 1 jam, atau kapan saja lewat Pengaturan › Periksa status lisensi sekarang; tidak menahan aplikasi). Tanpa internet tetap jalan sampai 30 hari sejak pemeriksaan terakhir. Lisensi dicabut, versi terlalu lama, atau jam HP dimundurkan akan mengunci aplikasi. Kunci aktivasi lama diganti kunci baru.':'License security: the app checks the license status with the server (automatically at most every 1 hour, or anytime via Settings › Check license status now; it does not hold up the app). Without internet it keeps working up to 30 days after the last check. A revoked license, a version that is too old, or the phone clock being set back will lock the app. The old activation key was replaced with a new one.','Ikon Pengaturan (gerigi) pindah ke kanan judul Akun, di bawah tombol terang/gelap. Kartu Pengaturan di Akun dihapus.':'The Settings icon (gear) moved to the right of the Account title, below the light/dark button. The Settings card in Account was removed.','Kalkulator pindah ke Menu › Kalkulator: tampilan seperti kalkulator HP, memori, riwayat, tombol ÷ Peserta dan Bulat, plus 7 rumus Hitung Trip.':'The Calculator moved to Menu › Calculator: phone-calculator look, memory, history, ÷ Participants and Round buttons, plus 7 Trip Calculator formulas.','Akun: kartu profil dan tombol Pengaturan menyatu, serta ada Data & Cadangan.':'Account: the profile card and Settings button are merged, and Data & Backup was added.','Tentang pembuat: tombol Instagram dan WhatsApp saja, tanpa tulisan nama atau nomor.':'About the creator: only Instagram and WhatsApp buttons, with no name or number text.','Pengaturan baru: pesan tagihan WhatsApp bisa diubah, pembulatan harga jual, dan Cek pembaruan aplikasi.':'New settings: the WhatsApp bill message can be edited, selling price rounding, and Check for app updates.','Panduan singkat kini berisi demo bergerak dan langkah rinci untuk semua fitur (Menu › Panduan).':'The quick Guide now has animated demos and detailed steps for all features (Menu › Guide).','Anggaran = bagian harga jual yang dibayar tiap peserta (rencana). Biaya asli = uang yang benar-benar kamu keluarkan ke pihak lain.':'Budget = the share of the selling price each participant pays (plan). Actual cost = the money you really pay out to other parties.','Mengisi tab Pengeluaran dari komponen simulasi. Simulasi yang diterapkan menjadi acuan perbandingan dengan kenyataan.':'Fills the Expenses tab from the simulation components. The applied simulation becomes the reference for comparison with reality.','Belum ada simulasi yang diterapkan. Gunakan tombol "Terapkan ke Anggaran Pengeluaran" di atas.':'No simulation has been applied yet. Use the "Apply to Expense Budget" button above.','Atur tagihan: buka kartu "Tagihan & tenggat" di bawah, terapkan simulasi, atau isi Total Realisasi di Beranda.':'Set the bill: open the "Bills & deadlines" card below, apply a simulation, or fill in Total Actual on Home.','Rekening bank dan e-wallet. Yang aktif tampil di kwitansi, pesan tagihan WhatsApp, dan kartu cara bayar.':'Bank accounts and e-wallets. Active ones appear on receipts, WhatsApp bill messages, and the payment info card.','Tagihan tetap menggantikan hitungan otomatis. Kosongkan untuk memakai simulasi atau rencana patungan.':'A fixed bill replaces the automatic calculation. Leave empty to use the simulation or split plan.','Menyimpan salinan seluruh data trip ini ke daftar arsip. Data yang berjalan tidak berubah.':'Saves a copy of all this trip\'s data to the archive list. The running data is not changed.','Bila diisi, tanggal itinerary digeser mengikuti tanggal ini (jam tetap). Bila kosong, tanggal dan jam itinerary dikosongkan.':'If filled in, itinerary dates shift to follow this date (times stay). If empty, itinerary dates and times are cleared.','Data tersimpan di HP ini. Unduh cadangan berkala (atau sebelum uninstall / ganti HP), simpan ke Google Drive atau WhatsApp.':'Data is stored on this phone. Download a backup regularly (or before uninstalling / changing phones), and save it to Google Drive or WhatsApp.','Dibuat lewat pilihan "Ulangi otomatis" di form Pemasukan / Pengeluaran. Ditambahkan otomatis saat aplikasi dibuka.':'Created via the "Repeat automatically" option in the Income / Expenses form. Added automatically when the app opens.','Setup sekali lewat Apps Script (lihat panduan). Setelah itu peserta mendaftar lewat link, dan kamu mengambil datanya saat ada internet.':'Set up once through Apps Script (see the guide). After that participants register via the link, and you fetch the data when online.','Tips: 200 + 10% = 220 (persen menyesuaikan angka di depannya). Ketuk ( ) untuk kurung buka dan tutup otomatis.':'Tip: 200 + 10% = 220 (percent adjusts the number before it). Tap ( ) for automatic opening and closing brackets.','Peserta 🔒':'Participant 🔒','Menampilkan 0 dari 0 data':'Showing 0 of 0 data',
'Masukkan total sewa ke Pengeluaran (kategori Peralatan)? Jika baris "Sewa perlengkapan" sudah ada, nilainya diperbarui.':'Add the total rental to Expenses (Equipment category)? If a "Sewa perlengkapan" row already exists, its value is updated.'

Object.assign(EN, {"Syarat & Ketentuan": "Terms & Conditions", "Dengan mengaktifkan aplikasi, Anda dianggap telah membaca dan menyetujui syarat ini.": "By activating the app, you are deemed to have read and agreed to these terms.", "1. Lisensi: satu lisensi seumur hidup produk untuk satu penyelenggara. Satu kode perangkat (BU-XXXX-XXXX) berlaku untuk satu HP. \"Seumur hidup\" berarti selama aplikasi dan server lisensi masih beroperasi. Bila server lisensi dihentikan, pembeli sah akan mendapat kunci permanen yang bekerja tanpa internet.": "1. License: one lifetime-of-product license for one organizer. One device code (BU-XXXX-XXXX) is valid for one phone. \"Lifetime\" means as long as the app and the license server are in operation. If the license server is shut down, valid buyers will receive a permanent key that works without internet.", "2. Yang dilarang: membagikan aplikasi, tautan, atau kunci aktivasi kepada orang lain; menjual ulang atau menyewakan; menghapus atau mengubah identitas pembuat; mengubah kode aplikasi atau menjalankannya dari alamat lain.": "2. Not allowed: sharing the app, link, or activation key with others; reselling or renting it; removing or changing the creator's identity; modifying the app code or running it from another address.", "3. Pemeriksaan lisensi: aplikasi memeriksa status lisensi ke server penjual saat ada internet. Tanpa internet, aplikasi tetap jalan sampai 60 hari sejak pemeriksaan terakhir yang berhasil; setelah itu perlu online sekali. Buka aplikasi dengan internet sebelum berangkat trip. Jam HP yang dimundurkan akan mengunci aplikasi.": "3. License checks: the app checks the license status with the seller's server when there is internet. Without internet, the app keeps working up to 60 days after the last successful check; after that it needs to go online once. Open the app with internet before leaving for a trip. A phone clock set back will lock the app.", "4. Pindah HP: gratis, maksimal 2 kali per tahun, dengan nomor WhatsApp yang cocok dengan data pembelian. HP hilang atau rusak dapat dibantu dengan penjelasan. Setiap HP baru punya kode perangkat baru, jadi pembeli meminta kunci baru ke penjual lewat WhatsApp.": "4. Changing phones: free, at most 2 times per year, with a WhatsApp number matching the purchase record. A lost or broken phone can be helped with an explanation. Each new phone has a new device code, so the buyer asks the seller for a new key via WhatsApp.", "5. Pencabutan: penjual dapat mencabut lisensi bila syarat dilanggar. Aplikasi yang dicabut terkunci begitu terhubung ke server. Data tetap ada di HP dan aplikasi pulih bila lisensi diaktifkan lagi. Pencabutan karena pelanggaran tidak disertai pengembalian uang.": "5. Revocation: the seller may revoke the license if these terms are violated. A revoked app locks once it connects to the server. Data stays on the phone and the app recovers if the license is reactivated. Revocation for a violation comes with no refund.", "6. Data dan cadangan: data trip, keuangan, dan peserta hanya tersimpan di HP Anda. Menghapus data aplikasi atau mencopot aplikasi dapat menghilangkan semuanya, jadi cadangkan secara rutin (Akun › Data & Cadangan). Anda bertanggung jawab atas data peserta yang Anda kumpulkan, termasuk data kesehatan, dan wajib meminta izin peserta.": "6. Data and backups: trip, finance, and participant data are stored only on your phone. Clearing app data or uninstalling the app can erase everything, so back up regularly (Account › Data & Backup). You are responsible for the participant data you collect, including health data, and must ask participants for permission.", "7. Batas tanggung jawab: aplikasi adalah alat bantu mencatat dan menghitung. Penjual tidak menanggung kerugian akibat kesalahan input atau hitungan, data yang hilang, atau aplikasi yang tidak bisa dipakai karena lama tanpa internet.": "7. Limit of liability: the app is a tool for recording and calculating. The seller is not liable for losses from input or calculation errors, lost data, or the app being unusable after a long time without internet.", "8. Harga dan pengembalian uang: mengikuti yang tertera di halaman penjualan pada saat Anda membeli.": "8. Price and refunds: as stated on the sales page at the time of your purchase.", "Pertanyaan: hubungi penjual lewat WhatsApp (Pengaturan › Lapor masalah).": "Questions: contact the seller via WhatsApp (Settings › Report a problem).", "Kebijakan Privasi": "Privacy Policy", "Data trip, peserta, dan keuangan Anda disimpan di HP Anda sendiri dan tidak dikirim ke server penjual.": "Your trip, participant, and finance data are stored on your own phone and are not sent to the seller's server.", "Yang dikirim ke server lisensi: kode perangkat, versi aplikasi, token pasang acak, alamat asal aplikasi, dan penanda teknis keaslian kode. Tujuannya hanya memeriksa status lisensi dan menjaga agar satu lisensi dipakai di satu HP.": "Sent to the license server: device code, app version, a random install token, the app's origin address, and a technical code-authenticity marker. The purpose is only to check the license status and keep one license on one phone.", "Server juga mencatat kejadian teknis (misalnya kode dipakai di dua HP) dan data pembelian yang diisi penjual: nama pembeli, nomor WhatsApp, dan tanggal aktivasi. Data ini dipakai untuk aktivasi, pindah HP, dan bantuan.": "The server also records technical events (for example a code used on two phones) and purchase data entered by the seller: buyer name, WhatsApp number, and activation date. This data is used for activation, phone changes, and support.", "Pendaftaran online memakai skrip Google milik Anda sendiri; data pendaftar masuk ke Google Sheet Anda, bukan ke server penjual.": "Online registration uses your own Google script; registrant data goes to your own Google Sheet, not the seller's server.", "Lapor masalah hanya mengirim info teknis dan hanya terkirim bila Anda menekan kirim di WhatsApp. Cadangan data berupa berkas yang Anda unduh dan simpan sendiri.": "Report a problem sends only technical info and is sent only when you press send in WhatsApp. Data backups are files you download and keep yourself.", "Aplikasi tidak memakai iklan atau pelacak pihak ketiga. Aplikasi dihosting di GitHub Pages, yang dapat mencatat akses jaringan sesuai kebijakannya sendiri.": "The app uses no ads or third-party trackers. The app is hosted on GitHub Pages, which may log network access under its own policy.", "Penjual tidak menjual data Anda. Untuk meminta data pembelian Anda dihapus, hubungi penjual lewat WhatsApp.": "The seller does not sell your data. To request deletion of your purchase data, contact the seller via WhatsApp.", "Info Umum": "General Info", "Kembali": "Back", "v1.12.0: halaman Info Umum berisi Syarat & Ketentuan dan Kebijakan Privasi (Pengaturan › Bantuan).": "v1.12.0: a General Info page with Terms & Conditions and Privacy Policy (Settings › Help)."});

  const before = JSON.stringify(DB.pin); await setPin();

}
const renderPengRefresh = () => rerender();
function lihatRc() {
  if (!DB.pin) return toast('Aktifkan PIN dulu');
  formSheet('Kode pemulihan PIN', [{ id: 'pin', label: 'Masukkan PIN Anda', type: 'password' }], async v => {
    if (await sha(DB.pin.salt + ':' + v.pin) !== DB.pin.hash) return toast('PIN salah');
    if (!DB.pin.rc) { DB.pin.rc = rcBaru(); await save(); }
    listSheet('Kode pemulihan PIN', ['Kode Anda: ' + DB.pin.rc, 'Simpan di tempat aman. Dipakai lewat "Lupa PIN?" di layar kunci.']);
  });
}
function pinMinta(judul, cb) {
  formSheet(judul, [{ id: 'pin', label: 'Masukkan PIN Anda', type: 'password' }], async v => {
    if (!DB.pin || await sha(DB.pin.salt + ':' + v.pin) !== DB.pin.hash) return toast('PIN salah');
    await cb();
  });
}

function polaAtur() {
  let langkah = 1, pertama = null;
  sheetOpen(`<h3>Atur pola</h3><div id="pamsg" class="msg">Gambar pola (minimal 4 titik).</div><div id="polaPad"></div><button class="btn alt" onclick="$('fsheet').remove()">Batal</button>`);
  const pad = polaPad('polaPad', async seq => {
    const k = seq.join('-');
    if (seq.length < 4) { setMsg('pamsg', 'Minimal 4 titik. Coba lagi.', 0); return pad.reset(); }
    if (langkah === 1) { pertama = k; langkah = 2; setMsg('pamsg', 'Gambar sekali lagi untuk konfirmasi.', 1); return pad.reset(); }
    if (k !== pertama) { langkah = 1; pertama = null; setMsg('pamsg', 'Tidak sama. Ulangi dari awal.', 0); return pad.reset(); }
    const salt = String(Math.random()).slice(2) + Date.now(); DB.pin.pola = { salt, hash: await sha(salt + ':' + k) };
    await save(); const f = $('fsheet'); if (f) f.remove(); rerender(); toast('Pola disimpan');
  });
}

async function bioAktif() {
  try { const id = await bioDaftar(); if (!id) throw 0; DB.pin.bio = { id }; await save(); rerender(); toast('Sidik jari diaktifkan'); }

    st: ['Menu › Tamu › tombol + bulat: isi Nama (wajib), Meeting Point, Ponsel, Status (Diterima, Menunggu respons, Ditolak), Tagihan (Lunas, DP, Belum Lunas), Catatan.', 'Hanya tamu berstatus Diterima yang dihitung sebagai peserta untuk patungan, tagihan, dan statistik.', 'Pendaftaran online (Menu › Pendaftaran): pasang apps-script-pendaftaran.gs di Google Apps Script sekali saja, lalu tempel Link web app dan Kunci rahasia, ketuk Simpan.', 'Setelah tersimpan muncul Link Pendaftaran. Ketuk Salin link atau Bagikan WA.', 'Saat ada internet ketuk Ambil pendaftar baru. Pendaftar masuk dengan status Menunggu respons.', 'Di kartu Menunggu Respons ketuk Terima, Tolak, atau 💬 WA untuk membalas.', 'Tamu bisa diimpor atau diekspor dengan CSV, dan dicari lewat kolom pencarian.'],

    st: ['Parameter: nama simulasi, jumlah peserta, jumlah official, harga jual per peserta, target keuntungan per official. Centang Official ikut berangkat jika biayanya ikut ditanggung.', 'Komponen Biaya: Anggaran adalah bagian harga jual yang dibayar peserta, Biaya asli adalah uang yang benar-benar keluar ke pihak lain.', 'Hasil Simulasi: pendapatan, total biaya, untung, untung per official, margin, harga balik modal, harga untuk mencapai target, dan peringatan.', 'Simpan skenario dengan Simpan, buka lagi dengan Muat. Form baru mengosongkan formulir.', 'Terapkan ke Anggaran Pengeluaran: pilih kolom Anggaran diisi biaya asli atau anggaran komponen, opsional isi kolom Biaya, dan atur Total Realisasi.', 'Setelah diterapkan, kartu Simulasi vs Kenyataan membandingkan rencana dengan catatan nyata. Kartu yang sama ada di Rekap.', 'Kalkulator bantu sekarang ada di Menu › Kalkulator.'],

      { c: 'Hitung Trip berisi 7 rumus siap pakai lengkap dengan langkahnya. Riwayat menyimpan hasil =.', ui: mH('Kalkulator') + `<div class="mseg"><span>Kalkulator</span><span class="tp on">Hitung Trip</span><span>Riwayat</span></div>` + mCard('Patungan per orang', mRow('Total biaya', '21.300.000') + mRow('Hasil', 'Rp 2.150.000')) }],
    st: ['Buka Menu › Kalkulator. Tiga mode: Kalkulator, Hitung Trip, dan Riwayat.', 'Tombol angka, + − × ÷, koma desimal, dan ⌫ seperti kalkulator HP. AC menghapus semua.', 'Tombol ( ) pintar: menaruh kurung buka lalu kurung tutup sesuai kebutuhan.', 'Persen menyesuaikan angka di depannya: 200 + 10% = 220, 200 × 10% = 20, 50% = 0,5.', 'Ketuk = untuk menyimpan hitungan ke Riwayat. Hasil bisa dilanjutkan dengan operator berikutnya.', 'Angka bulat 1.000 ke atas otomatis dieja di bawah hasil (terbilang).', 'Chip 📋 Salin menyalin hasil. 👥 ÷ Peserta membagi hasil dengan jumlah peserta Diterima. ⬆ Bulat membulatkan ke atas sesuai pilihan Pembulatan (Rp1.000, 5.000, atau 10.000) di bawahnya.', 'Memori: M+ dan M− menambah atau mengurangi, MR memanggil, MC menghapus.', 'Hitung Trip: Patungan per orang, Harga jual dari target untung, Balik modal, DP dan sisa, Selisih dan persen, Diskon dan PPN, Konversi mata uang. Ketuk Salin hasil untuk membagikannya.', 'Riwayat: ketuk satu baris untuk memakai lagi hasilnya.'],

    st: ['Menu › Pembayaran. Ringkasan di atas menunjukkan jumlah terkumpul, status tiap peserta, dan tenggat.', 'Tagihan per orang diambil dengan urutan: tagihan tetap, lalu harga jual simulasi, lalu Total Realisasi dibagi peserta Diterima. Ketuk Ubah di baris Tagihan per orang untuk melihat hitungan lain.', 'Cari peserta lewat kotak pencarian, atau saring dengan Belum lunas, Sebagian, Lunas, dan Telat.', 'Ketuk ＋ Catat bayar, cek jumlah, pilih Dibayar lewat, lalu Simpan. Pembayaran tersimpan sebagai Pemasukan kategori Peserta dan bisa diubah atau dihapus di Menu › Masuk.', 'Buka kartu Cara bayar untuk menambah rekening bank dan e-wallet (nama bebas, mis. OVO atau LinkAja). Ketuk Salin nomor untuk menyalin. Matikan Aktif bila tidak ingin tampil.', 'Ketuk 💬 Tagih untuk mengirim pesan WhatsApp berisi total, yang sudah dibayar, sisa, tenggat, dan semua cara bayar aktif. Tagih berikutnya membuka peserta yang belum ditagih satu per satu. Isi pesan bisa diubah di Pengaturan › Pesan tagihan.', 'Bagikan › Kartu cara bayar (PDF) atau Cara bayar ke grup WhatsApp untuk memberi tahu semua peserta sekaligus.', 'Ketuk 🧾 Kwitansi untuk membuat kwitansi. Nomor berformat KW/kode penyelenggara/kode destinasi/tahun/urut. Cetak ulang dengan jumlah bayar yang sama memakai nomor yang sama.', 'Tanda tangan, stempel, nama penanda tangan, dan kode penyelenggara diatur di Akun › Kwitansi.'],
    tp: ['Rugi tidak ditagihkan ke peserta. Tagihan peserta tidak pernah dihitung dari biaya aktual.', 'Di dialog cetak HP, pilih Simpan sebagai PDF. PDF selalu bertema terang.', 'WhatsApp tidak bisa mengirim pesan massal otomatis, jadi tagihan dikirim satu per satu.'] },

    st: ['Menu › Trip & Arsip › kartu Tutup Buku Trip. Ketik TUTUP, ketuk Tutup buku trip, lalu konfirmasi.', 'Sebelum dikunci, aplikasi membuat arsip cadangan otomatis (lihat Daftar Arsip).', 'Setelah buku trip berhasil ditutup, aplikasi mengajak Anda mencadangkan data. Ketuk Cadangkan sekarang.', 'Terkunci: tambah, ubah, hapus, dan impor Pemasukan dan Pengeluaran; Catat bayar; Catat penggantian Talangan; transaksi berulang; terapkan simulasi; masukkan sewa ke Pengeluaran; pulihkan transaksi dari tempat sampah.', 'Tetap bebas: Tamu, Itinerary, Perlengkapan, Checklist, kwitansi dan PDF, Rekap, arsip, dan cadangan.', 'Buka kunci: ketik BUKA di kartu yang sama. Aplikasi mencatat berapa kali kunci pernah dibuka.', 'Mulai Trip Baru dan Salin Trip sebagai Template membuat trip baru yang terbuka.'],
    tp: ['Tutup buku setelah bagi hasil dan penyelesaian official selesai, supaya laporan PDF tidak berubah.'] },

      { c: 'Tiap transaksi uang yang ditambah, diubah, atau dihapus muncul dengan waktunya. Yang diubah menampilkan nilai sebelum dan sesudah.', ui: mH('Riwayat') + mCard('✏️ Diubah · Pengeluaran', mRow('Biaya', '120.000 → 135.000') + mRow('Waktu', '28 Okt 2026 09.41')) + mNav(2) },

    st: ['Menu › Trip & Arsip › kartu Riwayat Perubahan.', 'Isi Nama pencatat bila beberapa panitia memakai HP yang sama. Nama ini ditulis di setiap catatan baru. Aplikasi tidak punya login, jadi nama hanya sebagai penanda.', 'Dicatat: tambah, ubah (nilai sebelum dan sesudah), hapus, dan pulihkan transaksi Pemasukan dan Pengeluaran; Catat bayar; transaksi berulang; terapkan simulasi; sewa ke Pengeluaran; impor CSV; penggantian Talangan; tutup dan buka kunci buku trip.', 'Ketuk filter Semua, Tambah, Ubah, Hapus, atau Kunci. Ketuk Tampilkan lebih banyak untuk entri lama.', 'Ketuk Unduh CSV untuk menyimpan seluruh riwayat. Ketuk Kosongkan untuk menghapus riwayat; ini tidak bisa dilakukan saat buku trip ditutup.'],

      { c: 'Cadangkan lewat Drive atau WhatsApp. Pulihkan dari file cadangan di HP baru.', ui: mH('Trip & Arsip') + mCard('💾 Cadangan Data', mBtn('📤 Bagikan cadangan', 'tp') + mBtn('⬆️ Pulihkan dari cadangan')) + mNav(2) }],
    st: ['Menu › Trip & Arsip › 🗂️ Arsipkan sekarang menyimpan salinan trip ke daftar arsip.', 'Mulai Trip Baru mengosongkan tamu, transaksi, itinerary, perlengkapan, checklist, dan simulasi. Isi destinasi baru (opsional), ketik BARU, lalu ketuk tombolnya.', 'Salin Trip sebagai Template: untuk trip serupa (mis. gunung yang sama). Itinerary, checklist (semua belum siap, tanpa nama pembawa), dan kategori ikut terbawa; tamu, pemasukan, pengeluaran, perlengkapan, dan simulasi kosong. Isi Tanggal mulai agar tanggal itinerary bergeser otomatis (jam tetap); bila dikosongkan, tanggal dan jam itinerary dikosongkan. Ketik SALIN, lalu ketuk tombolnya. Trip lama diarsipkan otomatis.', 'Daftar Arsip: ketuk Buka untuk menjadikan arsip sebagai data aktif, atau Unduh untuk menyimpannya.', 'Tempat Sampah menyimpan entri yang dihapus selama 30 hari. Ketuk Pulihkan untuk mengembalikan.', 'Hapus arsip, skenario, kategori, cara bayar, official, atau riwayat hitungan tanpa konfirmasi. Bila salah, ketuk Batalkan dalam 7 detik; setelah itu tidak bisa dikembalikan.', 'Cadangan Data: 📤 Bagikan cadangan (Drive atau WhatsApp), atau ⬇️ Unduh cadangan (JSON).', '⬆️ Pulihkan dari cadangan akan MENIMPA data saat ini, jadi cadangkan dulu bila ragu.', 'Reset Total menghapus semua dan tidak bisa dibatalkan.'],
    tp: ['Cadangkan sebelum ganti HP, uninstall aplikasi, atau menghapus data browser.'] },
